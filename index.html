<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Тренировка">
<meta name="theme-color" content="#0B0B0C">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<title>Тренировка</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=Unbounded:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0B0C; --s1:#161618; --s2:#1F1F22; --s3:#2B2B2F; --line:rgba(255,255,255,.08);
  --tx:#F4F4F5; --tx2:#D4D4D8; --mu:#A1A1AA; --mu2:#71717A;
  --volt:#D4FF3A; --ink:#0B0B0C; --volt-dim:rgba(212,255,58,.13);
  --warn:#FFB35C; --bad:#FF5A5F; --blue:#8AB4FF;
  --f:'Onest',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --pad:20px; --sb:max(calc(env(safe-area-inset-bottom) - 10px),12px); /* buttons sit just above the home indicator */ --st:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;height:100dvh;height:var(--app-h,100dvh);margin:0;overflow:hidden;background:var(--bg);color:var(--tx);font-family:var(--f);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button:disabled{opacity:.35}
input,textarea{font:inherit;color:inherit}
svg{display:block}
.hide{display:none!important}
.tnum{font-variant-numeric:tabular-nums}
#app{height:100%;padding-top:var(--st)}
.screen{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;position:relative}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scrollbar-width:none}
.scroll::-webkit-scrollbar,.pager::-webkit-scrollbar,.page::-webkit-scrollbar,.car::-webkit-scrollbar,.sheet::-webkit-scrollbar{display:none}
.pad{padding:0 var(--pad)}
@keyframes pulse{50%{opacity:.25}}

/* ---------- shared ---------- */
.sync{display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:500;color:var(--mu);white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--volt)}
.sync.saving i{background:var(--blue);animation:pulse 1s infinite}
.sync.off{color:var(--warn)}
.sync.off i{background:var(--warn)}
.card{background:var(--s1);border-radius:22px;padding:18px}
.bottom{flex:none;position:relative;padding:12px var(--pad) var(--sb);background:var(--bg)}
.bottom:before{content:"";position:absolute;left:0;right:0;top:-24px;height:24px;background:linear-gradient(rgba(11,11,12,0),var(--bg));pointer-events:none}
.cta{width:100%;height:58px;border-radius:18px;background:var(--volt);color:var(--ink);font-weight:700;font-size:18px;letter-spacing:-.01em;display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .12s}
.cta:active{transform:scale(.98)}
.cta.ghost{background:var(--s2);color:var(--tx)}
.cta svg{width:20px;height:20px}
.icon-btn{width:44px;height:44px;border-radius:50%;background:var(--s1);display:grid;place-items:center;flex:none}
.icon-btn svg{width:20px;height:20px}

/* ---------- home ---------- */
.h-top{display:flex;justify-content:space-between;align-items:center;padding:18px 0 0}
.h-date{font-size:15px;color:var(--mu);font-weight:500}
.h1{font-size:34px;line-height:1.08;font-weight:800;letter-spacing:-.04em;margin:8px 0 22px}
.resume{width:100%;display:flex;align-items:center;gap:14px;background:var(--volt);color:var(--ink);border-radius:22px;padding:16px 18px;margin-bottom:12px;text-align:left}
.resume .t{flex:1;min-width:0}
.resume b{display:block;font-size:17px;font-weight:700}
.resume span{display:block;font-size:14px;font-weight:500;opacity:.72;margin-top:2px}
.resume svg{width:24px;height:24px;flex:none}
.resume.alt{background:var(--s1);color:var(--tx)}
.resume.alt span{color:var(--mu);opacity:1}
.resume.alt svg{color:var(--volt)}
.row-b{display:flex;justify-content:space-between;align-items:center;gap:10px}
.t17{font-size:17px;font-weight:700;letter-spacing:-.01em}
.status{display:inline-flex;align-items:center;gap:7px;font-size:15px;font-weight:600;white-space:nowrap}
.status i{width:8px;height:8px;border-radius:50%;background:currentColor}
.good{color:var(--volt)} .warnc{color:var(--warn)} .muc{color:var(--mu)}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);margin-top:18px}
.metric{min-width:0}
.metric + .metric{border-left:1px solid var(--line);padding-left:16px}
.metric .v{font-size:32px;font-weight:700;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.metric .v small{font-size:15px;color:var(--mu);font-weight:500;margin-left:3px;letter-spacing:0}
.metric .l{font-size:14px;color:var(--mu);margin-top:8px}
.metric .d{font-size:13px;font-weight:600;margin-top:2px}
.up{color:var(--volt)} .down{color:var(--warn)} .flat{color:var(--mu2)}
.note-s{font-size:14px;color:var(--mu2);margin-top:16px;line-height:1.4}
.notice{display:flex;align-items:center;gap:14px;background:var(--s1);border-radius:22px;padding:16px;margin-top:12px}
.notice .ic{width:46px;height:46px;border-radius:14px;background:var(--s2);display:grid;place-items:center;flex:none;color:var(--warn)}
.notice .ic svg{width:22px;height:22px}
.notice .tx{flex:1;min-width:0}
.notice .tx b{display:block;font-size:16px;font-weight:600;line-height:1.3}
.notice .tx span{display:block;font-size:14px;color:var(--mu);margin-top:3px}
.btn2{height:42px;padding:0 18px;border-radius:13px;background:var(--tx);color:var(--ink);font-weight:700;font-size:15px;flex:none}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:32px 0 14px}
.sec h2{font-size:24px;font-weight:800;letter-spacing:-.035em;margin:0}
.sec span{font-size:14px;color:var(--mu)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--s1);padding:4px;border-radius:15px;gap:4px}
.seg button{height:42px;border-radius:11px;font-weight:600;font-size:15px;color:var(--mu);transition:background .2s,color .2s}
.seg button.on{background:var(--s3);color:var(--tx)}
.seg .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--volt);margin-left:6px;vertical-align:2px}
.car{display:flex;gap:10px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;margin:12px calc(-1 * var(--pad)) 0;padding:0 var(--pad);scroll-padding:0 var(--pad);scrollbar-width:none;overscroll-behavior-x:contain}
.hero{flex:0 0 calc(100% - 30px);scroll-snap-align:start;scroll-snap-stop:always;position:relative;border-radius:24px;overflow:hidden;height:236px;background:var(--s2);display:flex;flex-direction:column;justify-content:flex-end;text-align:left}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(.25)}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,11,12,0) 25%,rgba(11,11,12,.93) 100%)}
.hero .in{position:relative;z-index:1;padding:18px 18px 20px}
.hero .tag{display:inline-block;font-size:13px;font-weight:700;background:var(--volt);color:var(--ink);padding:4px 10px;border-radius:8px;margin-bottom:10px}
.hero h3{font-size:36px;font-weight:800;letter-spacing:-.045em;line-height:1;margin:0 0 8px}
.hero .meta{font-size:15px;color:var(--tx2);font-weight:500}
.car-hint{text-align:center;font-size:13px;color:var(--mu2);margin-top:10px}
.plist{margin-top:14px;padding:4px 18px}
.pitem{display:flex;gap:14px;align-items:center;padding:12px 0;width:100%;text-align:left}
.pitem + .pitem{border-top:1px solid var(--line)}
.thumb{width:58px;height:58px;border-radius:15px;overflow:hidden;flex:none;background:var(--s2)}
.thumb img{width:100%;height:100%;object-fit:cover}
.pitem .nm{font-size:16px;font-weight:600;line-height:1.25}
.pitem .sx{font-size:14px;color:var(--mu);margin-top:3px}
.badge{display:inline-block;font-size:13px;font-weight:600;color:var(--blue);margin-left:6px}
.kvline{display:flex;justify-content:space-between;gap:12px;font-size:15px;padding:4px 0}
.kvline span:first-child{color:var(--mu)}
.kvline span:last-child{font-weight:600;text-align:right}

/* ---------- workout ---------- */
.w-head{flex:none;padding:12px var(--pad) 6px;background:var(--bg)}
.w-row{display:flex;align-items:center;gap:12px}
.w-title{flex:1;min-width:0}
.w-title b{display:block;font-size:18px;font-weight:700;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.w-title span{display:block;font-size:14px;color:var(--mu);font-variant-numeric:tabular-nums}
.segs{display:flex;gap:4px;margin-top:10px}
.segs button{flex:1;height:22px;display:flex;align-items:center;min-width:0}
.segs button.fin{flex:0 0 22px;justify-content:center;color:var(--mu2)}
.segs button.fin svg{width:14px;height:14px}
.segs button.fin.cur{color:var(--volt)}
.segs i{display:block;position:relative;width:100%;height:4px;border-radius:3px;background:var(--s3);overflow:hidden;transition:height .2s}
.segs i b{position:absolute;left:0;top:0;bottom:0;background:var(--volt);border-radius:3px;transition:width .3s}
.segs button.cur i{height:8px;background:#3C3C42}
.pager{flex:1;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;scrollbar-width:none}
.page{flex:0 0 100%;width:100%;height:100%;overflow-y:auto;overflow-x:hidden;scroll-snap-align:start;scroll-snap-stop:always;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;scrollbar-width:none}
.page-in{padding:8px var(--pad) 36px}
.media{position:relative;display:block;width:100%;height:190px;border-radius:22px;overflow:hidden;background:var(--s2)}
.media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.media img.b{animation:flip 2.6s ease-in-out infinite}
@keyframes flip{0%,38%{opacity:0}50%,88%{opacity:1}100%{opacity:0}}
.media .cnt,.media .how{position:absolute;z-index:1;font-size:14px;font-weight:600;background:rgba(11,11,12,.62);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);padding:6px 11px;border-radius:10px;display:flex;align-items:center;gap:6px}
.media .cnt{top:12px;left:12px}
.media .how{bottom:12px;right:12px}
.media .how svg{width:16px;height:16px}
.ss-bar{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--blue);margin-top:14px}
.ss-bar svg{width:16px;height:16px;flex:none}
.ex-name{font-size:26px;font-weight:800;letter-spacing:-.035em;line-height:1.12;margin:14px 0 8px}
.ex-meta{font-size:15px;color:var(--mu);display:flex;flex-wrap:wrap;gap:4px 14px}
.ex-meta b{color:var(--tx);font-weight:600}
.ex-meta .tg{color:var(--blue);font-weight:500}
.last{background:var(--s1);border-radius:18px;padding:14px 16px;margin-top:16px}
.last .k{font-size:14px;color:var(--mu)}
.last .v{font-size:18px;font-weight:600;margin-top:3px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.last .s{font-size:15px;color:var(--tx2);margin-top:8px;line-height:1.4}
.last .tgt{font-size:15px;font-weight:700;color:var(--volt);margin-top:10px;font-variant-numeric:tabular-nums}
.mode{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;padding:10px 12px 10px 14px;border-radius:14px;background:var(--volt-dim);font-size:14px;line-height:1.35;color:var(--tx2)}
.mode b{color:var(--volt)}
.mode.light{background:rgba(255,179,92,.13)}
.mode.light b{color:var(--warn)}
.mode button{flex:none;height:34px;padding:0 12px;border-radius:10px;background:var(--s2);color:var(--tx);font-weight:600;font-size:14px}
.ci-plan{margin-top:16px;padding:12px 14px;border-radius:14px;background:var(--s2);font-size:15px;line-height:1.4;color:var(--tx2);min-height:22px}
.ci-plan b{color:var(--volt)}
.ci-plan.light b{color:var(--warn)}
.ai{margin-top:12px}
.ai .hd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.ai .tag2{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--volt)}
.ai .tx{font-size:15px;line-height:1.45;color:var(--tx2)}
.ai ul{margin:8px 0 0;padding:0;list-style:none}
.ai li{font-size:15px;line-height:1.4;color:var(--tx2);padding:5px 0 5px 16px;position:relative}
.ai li:before{content:'';position:absolute;left:2px;top:13px;width:5px;height:5px;border-radius:50%;background:var(--volt)}
.ai .wait{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--mu)}
.ai .wait i{width:8px;height:8px;border-radius:50%;background:var(--volt);animation:pulse 1.2s infinite;flex:none}
.ai .more{color:var(--volt);font-size:14px;font-weight:600;margin-top:6px}
.sheet .ai-sum{color:var(--tx2);margin-top:8px}
/* ===== insights: premium cards, charts, history, week ===== */
:root{--org:#FF7A33;--org-dim:rgba(255,122,51,.14);--same:#8A8A93;--d:'Unbounded',var(--f);
  --heat:linear-gradient(120deg,#FF5E2B 0%,#FF9A3C 42%,#D4FF3A 100%)}
.lux{position:relative;overflow:hidden;border-radius:28px;padding:20px;
  background:radial-gradient(120% 90% at 105% -10%,rgba(255,122,51,.30),transparent 52%),radial-gradient(90% 80% at -10% 110%,rgba(212,255,58,.16),transparent 58%),linear-gradient(180deg,#1B1B1E,#121214)}
.lux:before,.glass:before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
  background:linear-gradient(140deg,rgba(255,154,60,.55),rgba(255,255,255,.06) 40%,rgba(212,255,58,.35));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.glass{position:relative;border-radius:24px;padding:18px;background:linear-gradient(180deg,#19191C,#141416)}
.glass:before{background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.03) 50%,rgba(255,255,255,.07))}
.gap{height:12px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mu)}
.eyebrow.hot{background:var(--heat);-webkit-background-clip:text;background-clip:text;color:transparent}
.ctitle{font-size:19px;font-weight:800;letter-spacing:-.025em;margin:4px 0 0}
.chd{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:14px}
.chd .side{font-size:13px;color:var(--mu);text-align:right}
.big{font-family:var(--d);font-weight:700;letter-spacing:-.04em;line-height:.95;font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:999px;font-size:13px;font-weight:700;white-space:nowrap;background:rgba(255,255,255,.07);color:var(--tx2)}
.chip.up{background:var(--volt-dim);color:var(--volt)}
.chip.down{background:var(--org-dim);color:var(--org)}
.chip.new{background:rgba(122,167,255,.14);color:#7AA7FF}
.chip.heat{background:var(--heat);color:var(--ink)}
/* compact coach card on home */
.ai.tap{display:block;width:100%;text-align:left;color:inherit}
.ai .ttl{font-size:16px;font-weight:600;line-height:1.38;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ai .go{display:flex;align-items:center;justify-content:space-between;margin-top:14px;font-size:14px;font-weight:700;color:var(--volt)}
.ai .go svg{width:16px;height:16px}
.rv-row{display:flex;gap:14px;align-items:center}
.rv-row .ttl{flex:1;min-width:0}
/* folded coach points */
.pts{margin-top:12px}
.pts details{border-top:1px solid var(--line)}
.pts summary{list-style:none;display:flex;gap:10px;align-items:center;padding:13px 0;cursor:pointer}
.pts summary::-webkit-details-marker{display:none}
.pts summary b{flex:none;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:5px 8px;border-radius:8px;background:var(--volt-dim);color:var(--volt)}
.pts summary b.warn{background:var(--org-dim);color:var(--org)}
.pts summary b.info{background:rgba(122,167,255,.14);color:#7AA7FF}
.pts summary span{flex:1;min-width:0;font-size:15px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pts details[open] summary span{display:none}
.pts summary:after{content:'';flex:none;margin-left:auto;width:8px;height:8px;border-right:2px solid var(--mu);border-bottom:2px solid var(--mu);transform:rotate(45deg) translateY(-3px);transition:transform .2s}
.pts details[open] summary:after{transform:rotate(225deg) translateY(-1px)}
.pts p{margin:-2px 0 14px;font-size:15px;line-height:1.5;color:var(--tx2)}
/* donut / rings */
.donut{position:relative;flex:none}
.donut svg{display:block;width:100%;height:100%;overflow:visible}
.donut .dc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.donut .dc b{font-family:var(--d);font-size:26px;font-weight:700;letter-spacing:-.04em;line-height:1}
.donut .dc span{font-size:11px;color:var(--mu);margin-top:4px;line-height:1.2}
.mixrow{display:flex;align-items:center;gap:20px}
.lg{flex:1;min-width:0;display:flex;flex-direction:column;gap:9px}
.lg div{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--tx2)}
.lg i{width:10px;height:10px;border-radius:3px;flex:none}
.lg b{margin-left:auto;font-weight:700;color:var(--tx);font-variant-numeric:tabular-nums;white-space:nowrap}
/* history list */
.hrow{display:flex;align-items:center;gap:14px;width:100%;padding:14px 0;text-align:left;color:inherit}
.hrow + .hrow{border-top:1px solid var(--line)}
.hrow .dt{flex:none;width:52px;height:56px;border-radius:16px;background:rgba(255,255,255,.05);display:flex;flex-direction:column;align-items:center;justify-content:center}
.hrow .dt b{font-family:var(--d);font-size:20px;font-weight:700;letter-spacing:-.04em;line-height:1}
.hrow .dt span{font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:.06em;margin-top:3px}
.hrow .dt.hot{background:var(--heat);color:var(--ink)}
.hrow .dt.hot span{color:rgba(11,11,12,.7)}
.hrow .md{flex:1;min-width:0}
.hrow .md b{display:block;font-size:16px;font-weight:700}
.hrow .md span{display:block;font-size:13px;color:var(--mu);margin-top:3px}
.hrow .sb{display:flex;gap:2px;height:6px;margin-top:9px;border-radius:3px;overflow:hidden}
.hrow .sb i{display:block;height:100%}
.hrow .rt{flex:none;text-align:right}
.hrow .rt b{display:block;font-family:var(--d);font-size:15px;font-weight:700;letter-spacing:-.03em}
.hrow .rt span{display:block;font-size:11px;color:var(--mu);margin-top:3px}
.hrow>svg{flex:none;width:16px;height:16px;color:var(--mu2)}
/* workout hero */
.hx{padding:22px 20px 20px}
.hx .ghost{position:absolute;right:-18px;top:-42px;font-family:var(--d);font-weight:800;font-size:220px;line-height:1;color:transparent;-webkit-text-stroke:1.5px rgba(255,255,255,.05);pointer-events:none}
.hx .big{font-size:56px;margin-top:18px}
.hx .big small{font-family:var(--f);font-size:17px;font-weight:600;color:var(--mu);letter-spacing:0;margin-left:6px}
.hx .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}
.tile{border-radius:16px;padding:12px;background:rgba(255,255,255,.055);backdrop-filter:blur(8px)}
.tile b{display:block;font-family:var(--d);font-size:20px;font-weight:700;letter-spacing:-.04em}
.tile span{display:block;font-size:12px;color:var(--mu);margin-top:4px}
.feelq{margin-top:14px;font-size:14px;color:var(--tx2)}
/* exercises */
.exc{position:relative;padding:16px 16px 14px 20px;border-radius:22px;background:linear-gradient(180deg,#19191C,#141416);overflow:hidden}
.exc + .exc{margin-top:10px}
.exc:before{content:'';position:absolute;left:0;top:16px;bottom:16px;width:4px;border-radius:0 4px 4px 0;background:var(--c,#8A8A93)}
.exc .top{display:flex;align-items:flex-start;gap:10px}
.exc .nm{flex:1;min-width:0;font-size:16px;font-weight:700;line-height:1.3}
.exc .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.exc .was{font-size:12px;color:var(--mu);margin-top:10px}
.setbars{display:flex;align-items:flex-end;gap:8px;height:92px;margin-top:14px}
.setbars .sb1{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end}
.setbars .col{position:relative;width:100%;max-width:56px;flex:none}
.setbars .bar{position:absolute;left:0;right:0;bottom:0;border-radius:10px 10px 4px 4px}
.setbars .tick{position:absolute;left:-3px;right:-3px;height:0;border-top:2px dashed rgba(255,255,255,.55)}
.setbars .lb{font-size:12px;font-weight:700;color:var(--tx2);margin-top:7px;white-space:nowrap;font-variant-numeric:tabular-nums}
.setbars .lb.f{color:var(--org)}
.keyline{display:flex;gap:14px;font-size:12px;color:var(--mu);margin:-4px 0 12px}
.keyline span{display:inline-flex;align-items:center;gap:6px}
.keyline i{display:inline-block;width:14px;height:8px;border-radius:3px;background:var(--heat)}
.keyline i.t{height:0;border-top:2px dashed rgba(255,255,255,.55);background:none}
.trend{flex:none;text-align:right}
.trend svg{display:block;width:84px;height:34px}
.trend span{display:block;font-size:11px;font-weight:700;margin-top:2px}
/* bars (tonnage, kcal) */
.vbars{display:flex;align-items:flex-end;gap:8px;height:170px}
.vbars .vb{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;color:var(--mu);font-size:11px;text-align:center}
.vbars .vb em{font-style:normal;font-size:11px;font-weight:700;color:var(--mu);margin-bottom:6px;font-variant-numeric:tabular-nums;white-space:nowrap}
.vbars .vb i{display:block;flex:none;width:100%;max-width:38px;border-radius:12px 12px 5px 5px;background:linear-gradient(180deg,#36363C,#26262B)}
.vbars .vb.on i{background:var(--heat);box-shadow:0 10px 30px -6px rgba(255,122,51,.55)}
.vbars .vb.on em{color:var(--tx)}
.vbars .vb.on{color:var(--tx);font-weight:700}
.vbars .vb small{display:block;margin-top:8px;line-height:1.25}
.goalwrap{position:relative}
.goalline{position:absolute;left:0;right:0;border-top:1.5px dashed rgba(255,255,255,.35);pointer-events:none}
.goalline span{position:absolute;right:0;top:-18px;font-size:11px;color:var(--mu);background:#161618;padding:0 4px}
/* gauges */
.gauges{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.gauge{text-align:center}
.gauge svg{display:block;width:100%;height:auto;overflow:visible}
.gauge b{display:block;font-family:var(--d);font-size:20px;font-weight:700;letter-spacing:-.04em;margin-top:-28px}
.gauge b small{font-family:var(--f);font-size:12px;color:var(--mu);font-weight:600;letter-spacing:0;margin-left:2px}
.gauge span{display:block;font-size:12px;color:var(--mu);margin-top:6px}
.gauge em{display:block;font-style:normal;font-size:12px;font-weight:700;margin-top:3px}
/* week */
.wk-nav{display:flex;gap:8px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:11px;color:var(--mu)}
.day .cap{width:100%;max-width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-family:var(--d);font-size:14px;font-weight:700;background:rgba(255,255,255,.05);color:var(--mu2)}
.day .cap.on{background:var(--heat);color:var(--ink);box-shadow:0 8px 22px -6px rgba(255,122,51,.6)}
.day .cap.today{outline:1.5px solid rgba(255,255,255,.35);outline-offset:2px}
.day .slp{position:relative;width:12px;height:64px;border-radius:6px;background:rgba(255,255,255,.05);overflow:hidden}
.day .slp i{position:absolute;left:0;right:0;bottom:0;border-radius:6px}
.day b{font-size:12px;color:var(--tx2);font-weight:700;font-variant-numeric:tabular-nums}
.hbars{display:flex;flex-direction:column;gap:12px}
.hb{display:grid;grid-template-columns:96px 1fr 34px;align-items:center;gap:10px;font-size:13px}
.hb span{color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb .tr{position:relative;height:12px;border-radius:6px;background:rgba(255,255,255,.05)}
.hb .tr i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--heat)}
.hb .tr u{position:absolute;top:-4px;bottom:-4px;width:2px;background:rgba(255,255,255,.6);border-radius:1px}
.hb b{text-align:right;font-variant-numeric:tabular-nums}
.movers div{display:flex;align-items:center;gap:10px;padding:10px 0;font-size:14px}
.movers div + div{border-top:1px solid var(--line)}
.movers .mn{flex:1;min-width:0;color:var(--tx2);line-height:1.3;overflow-wrap:anywhere}
.movers .mc{flex:none;display:flex;gap:6px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:14px;font-size:12px;color:var(--mu)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:8px;height:8px;border-radius:2px;display:inline-block}
.macro{display:flex;flex-direction:column;align-items:stretch;gap:18px}
.macro .donut{align-self:center}
.wk-home{display:block;width:100%;text-align:left;color:inherit}
.wk-home .days{margin-top:16px}
.wk-home .day .cap{height:34px;border-radius:11px;font-size:12px}
.wk-top{display:flex;align-items:center;gap:16px}
.wk-top .tx{flex:1;min-width:0}
.wk-top .big{font-size:30px}
.wk-top .big small{font-family:var(--f);font-size:14px;color:var(--mu);font-weight:600;letter-spacing:0;margin-left:4px}
.sets{margin-top:18px}
.sets-h,.set-row{display:grid;grid-template-columns:34px 1fr 1fr 60px;gap:8px;align-items:center}
.uni .sets-h,.uni .set-row{grid-template-columns:34px 1fr .85fr .85fr 60px}
.sets-h{font-size:13px;color:var(--mu2);font-weight:500;padding-bottom:6px}
.sets-h div{text-align:center}
.set-row{padding:4px 0}
.set-n{font-size:17px;font-weight:700;color:var(--mu2);text-align:center;line-height:1;position:relative}
.set-n .prb{display:block;font-size:10px;font-weight:800;color:var(--ink);background:var(--volt);border-radius:5px;padding:2px 0;margin-top:4px;font-style:normal}
.set-n .rm{width:34px;height:44px;display:grid;place-items:center;color:var(--mu)}
.set-n .rm svg{width:18px;height:18px}
.set-row.next .set-n{color:var(--tx)}
.num{width:100%;height:56px;border-radius:15px;border:2px solid transparent;background:var(--s1);text-align:center;font-size:23px;font-weight:700;letter-spacing:-.02em;outline:none;font-variant-numeric:tabular-nums;padding:0 4px;-webkit-appearance:none;appearance:none}
.num::placeholder{color:#4A4A50;font-weight:500;font-size:18px}
.num:focus{border-color:var(--volt);background:var(--s2)}
.set-row.next .num{background:var(--s2)}
.check{width:60px;height:56px;border-radius:15px;background:var(--s2);display:grid;place-items:center;transition:background .15s}
.check svg{width:26px;height:26px;color:var(--mu)}
.set-row.next .check{background:var(--s3)}
.set-row.next .check svg{color:var(--tx)}
.set-row.done .num{background:var(--volt-dim);color:var(--volt)}
.set-row.done .check{background:var(--volt)}
.set-row.done .check svg{color:var(--ink)}
.set-row.done .set-n{color:var(--volt)}
.set-row.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.rir{margin-top:20px}
.rir .k{font-size:14px;color:var(--mu);margin-bottom:10px}
.rir .k b{color:var(--tx);font-weight:600}
.chips5{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.chips5 button{height:46px;border-radius:13px;background:var(--s1);font-weight:700;font-size:17px}
.chips5 button.on{background:var(--tx);color:var(--ink)}
.ex-tools{display:flex;gap:8px;margin-top:12px}
.tool{flex:1;height:46px;border-radius:13px;background:var(--s1);font-size:15px;font-weight:600;color:var(--tx2);display:flex;align-items:center;justify-content:center;gap:7px}
.tool svg{width:18px;height:18px}
.note-in{width:100%;margin-top:10px;background:var(--s1);border:2px solid transparent;border-radius:14px;padding:12px 14px;font-size:16px;outline:none;resize:none;line-height:1.4}
.note-in:focus{border-color:var(--volt)}
.wnav{display:flex;align-items:center;gap:10px}
.wnav .nb{width:58px;height:58px;border-radius:18px;background:var(--s1);display:grid;place-items:center;flex:none}
.wnav .nb svg{width:22px;height:22px}
.wnav .nx{flex:1;min-width:0;height:58px;border-radius:18px;background:var(--s1);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 18px;font-weight:600;font-size:16px;transition:background .2s,color .2s}
.wnav .nx span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.wnav .nx svg{width:20px;height:20px;flex:none}
.wnav .nx.hot{background:var(--volt);color:var(--ink)}
.wnav .cta{flex:1}
body.resting .w-bottom .wnav{visibility:hidden}

/* finish page */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--s1);border-radius:18px;padding:16px}
.stat .v{font-size:28px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .v small{font-size:16px;color:var(--mu);font-weight:500}
.stat .l{font-size:14px;color:var(--mu);margin-top:4px}
.fin-list{margin-top:12px;padding:2px 16px}
.fin-item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;width:100%;text-align:left;font-size:15px}
.fin-item + .fin-item{border-top:1px solid var(--line)}
.fin-item span:first-child{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.fin-item b{font-weight:600;flex:none;font-variant-numeric:tabular-nums}
.fin-item b.ok{color:var(--volt)}
.fin-item b.part{color:var(--warn)}
.field{margin-top:22px}
.field > label,.field > .lbl{display:block;font-size:15px;font-weight:600;margin-bottom:10px}
.txt{width:100%;height:54px;border-radius:15px;background:var(--s1);border:2px solid transparent;padding:0 16px;font-size:18px;font-weight:600;outline:none;-webkit-appearance:none}
.txt:focus{border-color:var(--volt)}
.choices{display:grid;gap:8px}
.choices.c2{grid-template-columns:1fr 1fr}
.choices.c3{grid-template-columns:repeat(3,1fr)}
.choice{min-height:54px;border-radius:15px;background:var(--s1);border:2px solid transparent;font-weight:600;font-size:15px;padding:10px 14px;text-align:left;display:flex;flex-direction:column;justify-content:center}
.choices.c3 .choice{align-items:center;text-align:center}
.choice small{display:block;color:var(--mu);font-weight:500;font-size:13px;margin-top:2px}
.choice.on{border-color:var(--volt);background:var(--volt-dim)}
.linkbtn{display:block;width:100%;padding:14px 0;font-size:15px;font-weight:500;color:var(--mu);text-align:center}
.linkbtn.danger{color:var(--bad)}
.cta.danger{background:var(--bad);color:#fff}
.warn-line{font-size:14px;color:var(--warn);margin-top:12px;line-height:1.4}

/* rest timer */
.rest{position:fixed;left:12px;right:12px;bottom:calc(var(--sb) + 4px);z-index:40;max-width:536px;margin:0 auto;background:#202024;border:1px solid #34343B;border-radius:24px;padding:12px;display:flex;align-items:center;gap:12px;box-shadow:0 20px 50px rgba(0,0,0,.55);transform:translateY(20px);opacity:0;pointer-events:none;transition:.25s}
.rest.on{transform:none;opacity:1;pointer-events:auto}
.rest.end{background:var(--volt);color:var(--ink);border-color:var(--volt)}
.ring{position:relative;width:60px;height:60px;flex:none}
.ring svg{width:60px;height:60px;transform:rotate(-90deg)}
.ring .tm{position:absolute;inset:0;display:grid;place-items:center;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.rest .t{flex:1;min-width:0}
.rest .t b{display:block;font-size:16px;font-weight:700}
.rest .t span{display:block;font-size:13px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rest.end .t span{color:rgba(11,11,12,.7)}
.rest .rb{height:46px;min-width:44px;padding:0 8px;border-radius:13px;background:var(--s3);font-weight:700;font-size:15px;display:grid;place-items:center}
.rest.end .rb{background:rgba(11,11,12,.12)}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:60;opacity:0;transition:opacity .25s}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;max-height:calc(100% - var(--st) - 24px);overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;background:var(--s1);border-radius:28px 28px 0 0;padding:10px var(--pad) calc(var(--sb) + 10px);transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.9,.3,1)}
.sheet.on{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:99px;background:var(--s3);margin:0 auto 16px}
.sheet h3{font-size:24px;margin:4px 0 6px;font-weight:800;letter-spacing:-.03em;line-height:1.15}
.sheet .inner{max-width:520px;margin:0 auto}
.sheet .sub{font-size:15px;color:var(--mu);margin:0 0 4px}
.sheet .choice{background:var(--s2)}
.sheet .choice.on{background:var(--volt-dim)}
.big-media{position:relative;border-radius:22px;overflow:hidden;aspect-ratio:4/3;background:var(--s2)}
.big-media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.big-media img.b{animation:flip 2.6s ease-in-out infinite}
.cues{margin:12px 0 0;padding:0;list-style:none;display:grid;gap:8px}
.cues li{font-size:15px;color:var(--tx2);display:flex;gap:10px;line-height:1.4}
.cues li:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--volt);margin-top:8px;flex:none}
.t-focus{margin:14px 0 4px;padding:16px 18px;border-radius:20px;background:var(--volt-dim)}
.t-focus .t-lbl{font-size:13px;font-weight:600;color:var(--volt);margin-bottom:4px}
.t-focus p{margin:0;font-size:18px;font-weight:600;line-height:1.35;letter-spacing:-.01em}
.t-sec{margin-top:20px}
.t-sec h4{margin:0 0 2px;font-size:17px;font-weight:700;letter-spacing:-.01em}
.t-sec p{margin:8px 0 0;font-size:16px;color:var(--tx2);line-height:1.45}
.t-sec .cues li{font-size:16px}
.cues.err li:before{content:"×";width:auto;height:auto;background:none;color:var(--warn);font-weight:700;margin-top:0;line-height:1.4}
.t-tip{margin:20px 0 0;padding:14px 16px;border-radius:16px;background:var(--s2);font-size:15px;color:var(--tx2);line-height:1.45}
.kv{display:grid;grid-template-columns:auto 1fr;gap:10px 16px;font-size:15px;margin:18px 0}
.kv dt{color:var(--mu)}
.kv dd{margin:0;font-weight:500}
.h-sub{font-size:15px;font-weight:600;margin:6px 0 4px}
.hist-row{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:15px}
.hist-row span:first-child{color:var(--mu);white-space:nowrap}
.hist-row span:last-child{text-align:right;font-weight:500;font-variant-numeric:tabular-nums}

/* done */
.done-hero{text-align:center;padding:48px 0 20px}
.done-badge{width:92px;height:92px;border-radius:50%;background:var(--volt);color:var(--ink);display:grid;place-items:center;margin:0 auto 20px}
.done-badge svg{width:44px;height:44px}
.done-hero h1{font-size:32px;margin:0 0 8px;letter-spacing:-.04em;font-weight:800;line-height:1.1}
.save-state{display:flex;gap:8px;align-items:center;justify-content:center;font-size:15px;font-weight:600;margin-top:14px}
.save-state svg{width:16px;height:16px}

.toast{position:fixed;left:50%;top:calc(var(--st) + 14px);transform:translate(-50%,-30px);z-index:90;background:var(--tx);color:var(--ink);font-weight:600;font-size:15px;padding:12px 18px;border-radius:15px;opacity:0;transition:.25s;max-width:92vw;width:max-content;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.4);pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.volt{background:var(--volt)}
.toast.bad{background:var(--bad);color:#fff}

.loading{height:100%;display:grid;place-items:center;text-align:center;padding:0 var(--pad)}
.logo{font-weight:800;font-size:28px;letter-spacing:-.04em}
.logo i{font-style:normal;color:var(--volt)}
.bar-load{width:120px;height:3px;background:var(--s2);border-radius:99px;margin:18px auto 0;overflow:hidden}
.bar-load:after{content:"";display:block;width:40%;height:100%;background:var(--volt);animation:ld 1s infinite ease-in-out}
@keyframes ld{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
#nosleep{position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;pointer-events:none}
</style>
</head>

<div id="rest" class="rest" aria-live="polite"></div>
<div id="toast" class="toast" role="status"></div>

/* GitHub Pages build: google.script.run replacement that calls the Apps Script JSON API.
   The access key comes from the link (#k=...) once and is kept in this page's own storage. */
(function () {
  var API = 'https://script.google.com/macros/s/AKfycbzcbmUZZP3RrPeqQHUzEDnt28Gj98l1pHzzgB9dKVgNqT05DQZvrfOsPBgcLOKQ7TXt5A/exec';
  var FNS = ['getBootstrap', 'saveSet', 'deleteSet', 'finishSession', 'applyOps', 'getCoachPlan', 'reviewSession', 'weeklyReview'];
  var SLOW = { getCoachPlan: 1, reviewSession: 1, weeklyReview: 1 }; // the coach thinks for up to a couple of minutes
  var key = null;
  try {
    var m = /[#&]k=([A-Za-z0-9_-]{32,128})/.exec(location.hash);
    if (m) { key = m[1]; localStorage.setItem('wf1.key', key); }
    else key = localStorage.getItem('wf1.key');
  } catch (e) { if (m) key = m[1]; }

  function call(fn, args, ok, fail) {
    if (!key) { fail && fail(new Error('нет ключа доступа. Открой ссылку из инструкции целиком, вместе с частью после #')); return; }
    var ctl = window.AbortController ? new AbortController() : null;
    var timer = setTimeout(function () { ctl && ctl.abort(); }, SLOW[fn] ? 240000 : 30000);
    var opts = { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, redirect: 'follow',
      body: JSON.stringify({ key: key, fn: fn, args: args }) };
    if (ctl) opts.signal = ctl.signal;
    // while the page is being hidden the write must still reach the server
    if (document.visibilityState === 'hidden' && opts.body.length < 60000) opts.keepalive = true;
    fetch(API, opts)
      .then(function (r) { if (!r.ok) throw new Error('сервер ответил ' + r.status); return r.json(); })
      .then(function (res) {
        clearTimeout(timer);
        if (res && res.ok) { ok && ok(res.result); return; }
        var msg = res && res.error === 'unauthorized' ? 'ключ доступа не подошёл' : (res && res.error) || 'ошибка сервера';
        fail && fail(new Error(msg));
      })
      .catch(function (e) { clearTimeout(timer); fail && fail(new Error(e && e.name === 'AbortError' ? 'нет ответа от сервера' : 'нет связи')); });
  }

  function runner(ok, fail) {
    var r = {
      withSuccessHandler: function (f) { return runner(f, fail); },
      withFailureHandler: function (f) { return runner(ok, f); },
    };
    FNS.forEach(function (fn) { r[fn] = function () { call(fn, Array.prototype.slice.call(arguments), ok, fail); }; });
    return r;
  }
  window.google = { script: { run: runner(null, null) } };
})();

function $(s,r){return (r||document).querySelector(s)}

function todayISO(){try{return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Bishkek',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}catch(e){return S.boot.today}}
function lsGet(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}

function lsDel(k){try{localStorage.removeItem(k)}catch(e){}}
function num(v){if(v===''||v==null)return null;var n=Number(String(v).replace(',','.'));return isNaN(n)?null:n}
function fmtN(n){if(n==null)return '';var r=Math.round(n*100)/100;return String(r).replace('.',',')}
function str(n){return n==null?'':String(n)}
var MONTHS=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
var WD=['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
function dObj(iso){var p=iso.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function fmtDay(iso){var d=dObj(iso);return d.getDate()+' '+MONTHS[d.getMonth()]}
function fmtShort(iso){var d=dObj(iso);return ('0'+d.getDate()).slice(-2)+'.'+('0'+(d.getMonth()+1)).slice(-2)}
function fmtWd(iso){var w=WD[dObj(iso).getDay()];return w.charAt(0).toUpperCase()+w.slice(1)}
function clock(sec){sec=Math.max(0,Math.round(sec));var h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return (h?h+':'+('0'+m).slice(-2):m)+':'+('0'+s).slice(-2)}
function parseRange(r){var m=String(r||'').match(/(\d+)\D+(\d+)/);if(m)return [+m[1],+m[2]];var one=String(r||'').match(/\d+/);return one?[+one[0],+one[0]]:[null,null]}
function parseRest(r){var s=String(r||'');var m=s.match(/(\d+)/);if(!m)return 90;var n=+m[1];return /мин/.test(s)&&n<10?n*60:n}
function parseLR(note){var m=/левая\s*(\d+(?:[.,]\d+)?)\D+правая\s*(\d+(?:[.,]\d+)?)/i.exec(note||'');return m?[m[1].replace(',','.'),m[2].replace(',','.')]:null}
function imgUrl(id,k){return IMG_BASE+id+'/'+k+'.jpg'}
function e1rm(kg,reps){return kg>0&&reps>0?kg*(1+reps/30):0}
function short(n){return String(n).replace(/\s*\(.*\)/,'')}
function plural(n,a,b,c){var m=n%10,h=n%100;return n+' '+(m===1&&h!==11?a:(m>=2&&m<=4&&(h<10||h>=20)?b:c))}

/* ================= data model ================= */
function libFor(name){for(var i=0;i<LIB.length;i++)if(LIB[i].re.test(name))return LIB[i];return {img:null,cues:[]}}
function catFor(name){var c=(S.boot.catalog||[]);for(var i=0;i<c.length;i++){if(c[i].name===name)return c[i]}var lib=libFor(name);for(var j=0;j<c.length;j++){if(lib.re&&lib.re.test(c[j].name))return c[j]}return null}

var dayCache={};
function buildDay(day,items,key){
  key=key||day;
  if(dayCache[key])return dayCache[key];
  items=items||(S.boot.program.days[day]||[]);
  var exs=items.map(function(it){
    var lib=libFor(it.name),cat=catFor(it.name),rr=parseRange(it.reps);
    var wm=(cat&&cat.weightMeaning)||'';
    return {id:day+it.order,day:day,name:it.name,sets:it.sets,reps:it.reps,repLo:rr[0],repHi:rr[1],rest:String(it.rest||''),restSec:parseRest(it.rest),
      group:it.group,superset:it.superset||'',note:it.note,img:lib.img,cues:lib.cues||[],tech:lib.img?TECH[lib.img]:null,hist:lib.hist||lib.re,
      unilateral:/одной рукой/i.test(it.name),cat:cat,
      dumbbell:/ОДНОЙ гантели/i.test(wm)||/вес одной гантели/i.test(it.note||''),
      addedWeight:/ДОПОЛНИТЕЛЬНОГО/i.test(wm)||/добавочн/i.test(it.note||''),
      counter:/ПРОТИВОВЕС/i.test(wm)};
  });
  // superset mates next to each other, in program order
  var out=[],seen={};
  exs.forEach(function(e){
    if(!e.superset){out.push(e);return}
    if(seen[e.superset])return;seen[e.superset]=1;
    exs.filter(function(x){return x.superset===e.superset}).forEach(function(x){out.push(x)});
  });
  return (dayCache[key]=out);
}
function workoutName(day){return 'Full Body '+day+' · '+(S.boot.program.blockLabel||'блок 1 v2.1')}
function mates(ex){return ex.superset?((S.session&&S.session.day===ex.day)?exList():buildDay(ex.day)).filter(function(x){return x.superset===ex.superset}):null}
function ssNext(ex){var m=mates(ex);if(!m)return null;var i=m.findIndex(function(x){return x.id===ex.id});return i<m.length-1?m[i+1]:null}

function histRows(ex){
  var re=ex.hist; if(!re)return [];
  return (S.boot.log||[]).filter(function(r){return r.exercise&&re.test(r.exercise)&&r.setNo});
}
function prevSession(ex,beforeIso){
  var rows=histRows(ex).filter(function(r){return r.date<beforeIso});
  if(!rows.length)return null;
  var last=rows.reduce(function(m,r){return r.date>m?r.date:m},'');
  var sets=rows.filter(function(r){return r.date===last}).sort(function(a,b){return a.setNo-b.setNo});
  return {date:last,sets:sets};
}
function historyList(ex,beforeIso,n){
  var by={};histRows(ex).filter(function(r){return r.date<beforeIso}).forEach(function(r){(by[r.date]=by[r.date]||[]).push(r)});
  return Object.keys(by).sort().reverse().slice(0,n).map(function(d){return {date:d,sets:by[d].sort(function(a,b){return a.setNo-b.setNo})}});
}
function bestE1(ex,beforeIso){var b=0;histRows(ex).forEach(function(r){if(r.date<beforeIso)b=Math.max(b,e1rm(r.kg,r.reps))});return b}
function setsStr(sets){return sets.map(function(s){return (s.kg!=null?fmtN(s.kg):'—')+' × '+(s.reps!=null?fmtN(s.reps):'—')}).join(',  ')}

/* ================= coach («Методика v2.1» + «Правила тренера») =================
   Double progression: every set at the top of the range with RIR >= 1 -> one weight step, else +1 rep in one set.
   Light day (bad sleep / feeling / confirmed recovery signals): no progression attempt, one set fewer, RIR 2–3.
   Weight steps are never guessed: only a numeric step from «Справочник упражнений» is applied. */
function lastRir(prev){var r=null;prev.sets.forEach(function(s){var v=num(s.rir);if(v!=null)r=v});return r}
function stepOf(ex){var m=/^\s*(\d+(?:[.,]\d+)?)/.exec(String((ex.cat&&ex.cat.step)||''));return m?Number(m[1].replace(',','.')):null}
function topKg(sets){var k=sets.map(function(s){return s.kg}).filter(function(v){return v!=null});return k.length?Math.max.apply(null,k):null}
function stalled(ex,beforeIso){ // the last two sessions did not beat the one before them
  var h=historyList(ex,beforeIso,3);if(h.length<3)return false;
  var e=h.map(function(x){return x.sets.reduce(function(m,s){return Math.max(m,e1rm(s.kg,s.reps))},0)});
  return e[2]>0&&e[0]<=e[2]&&e[1]<=e[2];
}
function coachTarget(ex,prev,mode){
  if(!prev||!prev.sets.length)return {sets:null,text:'Первый раз — подбери вес так, чтобы в запасе оставалось 2–3 повтора.'};
  var src=[];
  for(var i=0;i<ex.sets;i++){var p=prev.sets[i]||prev.sets[prev.sets.length-1],lr=ex.unilateral?parseLR(p.note):null;
    src.push({kg:p.kg,reps:p.reps,left:lr?num(lr[0]):p.reps,right:lr?num(lr[1]):p.reps})}
  var w=topKg(prev.sets),same=prev.sets.every(function(x){return x.kg===prev.sets[0].kg}),kgTxt=w!=null&&same?fmtN(w)+' кг':'веса как в прошлый раз';
  if(mode==='light')return {sets:src,goal:kgTxt+', повторы как в прошлый раз',text:'Лёгкий день: без попытки прогресса, запас 2–3 повтора.'};
  var reps=prev.sets.map(function(s){return ex.unilateral?Math.min.apply(null,[s.reps||0].concat((parseLR(s.note)||[]).map(Number))):(s.reps||0)});
  var top=ex.repHi&&reps.every(function(r){return r>=ex.repHi}),rir=lastRir(prev),t,goal;
  if(top&&rir===0){t='Все подходы дошли до '+ex.repHi+', но на пределе (RIR 0). Сначала повтори те же цифры с запасом хотя бы 1 повтор.';goal=kgTxt+', как в прошлый раз'}
  else if(top){
    var st=stepOf(ex);
    if(st&&w!=null){var nw=Math.round((w+st)*100)/100;src.forEach(function(s){s.kg=nw;s.reps=ex.repLo;s.left=ex.repLo;s.right=ex.repLo});
      goal=fmtN(nw)+' кг × от '+ex.repLo;t='Все подходы дошли до '+ex.repHi+(rir!=null?' с запасом':'')+' — сегодня +'+fmtN(st)+' кг, повторы снова от '+ex.repLo+'.'}
    else{goal='+ шаг веса, повторы от '+ex.repLo;t='Все подходы дошли до '+ex.repHi+' — добавь минимальный шаг веса на этом тренажёре и начни снова от '+ex.repLo+' повторов. Шаг тренажёра ещё не записан в справочнике, поэтому вес поставь сам.'}
  }else{

/* half-circle gauge: the tick on top is the personal norm, the arc fills to today's value */
function gauge(label,v,unit,dec,b,hi){
  var cx=55,cy=56,r=44,sw=9,A=Math.PI/2,t=0,cls='flat',d='',k=Math.pow(10,dec);
  if(v!=null&&b){var span=Math.max(b.sd*2.5,b.m*.2)||1,diff=v-b.m,pct=Math.abs(diff)/b.m;t=Math.max(-1,Math.min(1,diff/span));
    cls=pct<.04?'flat':((diff>0)===hi?'up':'down');d=pct<.04?'как обычно':(diff>0?'+':'−')+fmtN(Math.round(Math.abs(diff)*k)/k)+' к норме'}
  var col={up:'#D4FF3A',down:'#FF7A33',flat:'#8A8A93'}[cls];
  var s='<svg viewBox="0 0 110 64" aria-hidden="true"><path d="'+arc(cx,cy,r,-A,A)+'" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="'+sw+'" stroke-linecap="round"/>';
  if(v!=null)s+=glow('<path d="'+arc(cx,cy,r,-A,Math.max(-A+0.03,t*A))+'" fill="none" stroke="'+col+'" stroke-width="'+sw+'" stroke-linecap="round"/>',110,64);
  if(b)s+='<line x1="'+cx+'" y1="'+(cy-r-8)+'" x2="'+cx+'" y2="'+(cy-r+7)+'" stroke="rgba(255,255,255,.75)" stroke-width="2" stroke-linecap="round"/>';
  return '<div class="gauge">'+s+'</svg><b>'+(v!=null?fmtN(Math.round(v*k)/k):'—')+(unit?'<small>'+unit+'</small>':'')+'</b><span>'+label+'</span>'+(d?'<em class="dl '+cls+'">'+d+'</em>':'')+'</div>';
}
function trendSvg(v){
  if(v.length<2)return '';
  var W=84,H=34,mn=Math.min.apply(null,v),mx=Math.max.apply(null,v),r=mx-mn||1,id='tg'+(++svgN);
  var p=v.map(function(x,i){return [(4+i*(W-8)/(v.length-1)).toFixed(1),(H-5-(x-mn)/r*(H-10)).toFixed(1)]}),l=p[p.length-1];
  return '<svg viewBox="0 0 '+W+' '+H+'" aria-hidden="true"><defs><linearGradient id="'+id+'" x1="0" x2="1"><stop offset="0" stop-color="#55555C"/><stop offset="1" stop-color="#FF9A3C"/></linearGradient></defs><polyline points="'+p.map(function(q){return q.join(',')}).join(' ')+'" fill="none" stroke="url(#'+id+')" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="'+l[0]+'" cy="'+l[1]+'" r="4" fill="#D4FF3A" stroke="#141416" stroke-width="2"/></svg>';
}
function fmtT(kg){return fmtN(Math.round(kg/100)/10)}
function capz(s){return s.charAt(0).toUpperCase()+s.slice(1)}

/* ================= history: past workouts ================= */
function baseName(w){return String(w||'').replace(/ · .*/,'')}
function dayLetter(w){var m=/Full Body ([ABC])/.exec(w||'');return m?m[1]:''}
function rowReps(r){var lr=parseLR(r.note);return lr?(num(lr[0])||0)+(num(lr[1])||0):(r.reps||0)}
function isCounter(name){var c=catFor(name);return !!(c&&/ПРОТИВОВЕС/i.test(c.weightMeaning||''))}
function exHist(name){var lib=libFor(name),re=lib.hist||lib.re;return {hist:re||{test:function(n){return n===name}}}}
/* one entry per date + workout, newest first, with the «Сессии» row (minutes, pulse) when there is one */
function workoutsList(){
  if(S._wl)return S._wl;
  var by={},keys=[],ss=S.boot.sessions||[];
  (S.boot.log||[]).forEach(function(r){if(!r.date||!r.exercise||!r.setNo)return;var k=r.date+'|'+baseName(r.workout);if(!by[k]){by[k]={key:k,date:r.date,workout:r.workout,name:baseName(r.workout),rows:[]};keys.push(k)}by[k].rows.push(r)});
  return (S._wl=keys.map(function(k){var w=by[k];w.sess=ss.filter(function(x){return x.date===w.date&&baseName(x.workout)===w.name})[0]||null;return w})
    .sort(function(a,b){return a.date<b.date?1:(a.date>b.date?-1:0)}));
}
function exMetrics(rows,cnt){
  var top=null,reps=0,e1=0,topReps=0,topSets=0;
  rows.forEach(function(r){reps+=rowReps(r);if(r.kg!=null&&(top==null||(cnt?r.kg<top:r.kg>top)))top=r.kg;if(!cnt)e1=Math.max(e1,e1rm(r.kg,r.reps))});
  rows.forEach(function(r){if(r.kg===top){topReps+=rowReps(r);topSets++}});
  return {top:top,reps:reps,e1:e1,topReps:topReps,topSets:topSets};
}
/* against the previous time: heavier top weight wins; at the same weight, more sets, then more reps at it (counterweight: lighter is harder) */
function exStatus(c,p,cnt){
  if(!p)return {k:'new',t:'впервые'};
  if(c.top!=null&&p.top!=null&&c.top!==p.top){var d=c.top-p.top;return {k:(cnt?d<0:d>0)?'up':'down',t:(d>0?'+':'−')+fmtN(Math.abs(d))+' кг'+(cnt?' противовеса':'')}}
  var at=c.top!=null?' с '+fmtN(c.top)+' кг':'',ds=c.top!=null?c.topSets-p.topSets:0;
  if(ds)return {k:ds>0?'up':'down',t:(ds>0?'+':'−')+plural(Math.abs(ds),'подход','подхода','подходов')+at};
  var dr=(c.top!=null?c.topReps:c.reps)-(p.top!=null?p.topReps:p.reps);
  if(dr>0)return {k:'up',t:'+'+plural(dr,'повтор','повтора','повторов')+at};
  if(dr<0)return {k:'down',t:'−'+plural(-dr,'повтор','повтора','повторов')+at};
  return {k:'same',t:'как в прошлый раз'};
}
function wkStats(w){
  if(w._st)return w._st;
  var ex={},names=[],ton=0;
  w.rows.forEach(function(r){if(!ex[r.exercise]){ex[r.exercise]=[];names.push(r.exercise)}ex[r.exercise].push(r)});
  var list=names.map(function(n){
    var rows=ex[n].sort(function(a,b){return a.setNo-b.setNo}),cnt=isCounter(n),h=exHist(n);
    if(!cnt)rows.forEach(function(r){ton+=(r.kg||0)*rowReps(r)});
    var prev=prevSession(h,w.date),cur=exMetrics(rows,cnt),pm=prev?exMetrics(prev.sets,cnt):null;
    var best=bestE1(h,w.date),trend=historyList(h,isoAdd(w.date,1),6).reverse().map(function(x){var m=exMetrics(x.sets,cnt);return m.e1||m.reps});
    return {name:n,rows:rows,prev:prev,cur:cur,st:exStatus(cur,pm,cnt),pr:!cnt&&!!prev&&best>0&&cur.e1>best+0.01,trend:trend,counter:cnt};
  });
  var c={up:0,same:0,down:0,'new':0};list.forEach(function(x){c[x.st.k]++});
  return (w._st={list:list,ton:ton,sets:w.rows.length,count:c,prs:list.filter(function(x){return x.pr}).length});
}
function mixSegs(c){return ['up','same','down','new'].map(function(k){return {v:c[k],c:COL[k]}})}
function wkMinutes(w){var s=w.sess||{};return s.minutes||(s.watchMin?Math.round(s.watchMin):null)}
function histRow(w,i){
  var st=wkStats(w),d=dObj(w.date),m=wkMinutes(w),c=st.count;
  return '<button class="hrow" data-act="hist" data-key="'+esc(w.key)+'"><div class="dt'+(i===0?' hot':'')+'"><b>'+d.getDate()+'</b><span>'+MONTHS[d.getMonth()].slice(0,3)+'</span></div><div class="md"><b>'+esc(w.name)+'</b><span>'+st.sets+' подх.'+(m?' · '+m+' мин':'')+'</span><div class="sb">'+['up','same','down','new'].map(function(k){return c[k]?'<i style="flex:'+c[k]+';background:'+COL[k]+'"></i>':''}).join('')+'</div></div><div class="rt"><b>'+fmtT(st.ton)+' т</b><span>'+(st.prs?'★ '+st.prs+' · ':'')+'↑ '+c.up+' из '+st.list.length+'</span></div>'+I.fwd+'</button>';
}
function openHist(key,back){if(!key)return openAiSheet();S.hist={key:key,back:back||(S.view==='done'||S.view==='week'?S.view:'home')};S.view='hist';render();var sc=$('#hist-scroll');if(sc)sc.scrollTop=0}
function setBarsHtml(x){
  var useReps=x.counter||x.rows.every(function(r){return !(r.kg>0)});
  var val=function(r){return useReps?rowReps(r):r.kg*rowReps(r)},pv=x.prev?x.prev.sets:[];
  var mx=Math.max.apply(null,x.rows.map(val).concat(pv.map(val)))||1;
  return '<div class="setbars">'+x.rows.map(function(r,i){
    var h=Math.max(8,Math.round(val(r)/mx*66)),p=pv[i],ph=p?Math.round(val(p)/mx*66):null,rir=i===x.rows.length-1?num(r.rir):null;
    var lr=parseLR(r.note),reps=lr?lr[0]+'/'+lr[1]:fmtN(r.reps);
    return '<div class="sb1"><div class="col" style="height:'+h+'px"><div class="bar" style="background:'+BARG[x.st.k]+';top:0"></div>'+(ph!=null?'<div class="tick" style="bottom:'+(ph-1)+'px"></div>':'')+'</div><div class="lb'+(rir===0?' f':'')+'">'+(r.kg!=null?fmtN(r.kg)+'×'+reps:reps+' повт.')+'</div></div>';

function trendHtml(x){
  var v=x.trend;if(v.length<2)return '';
  var a=v[0],b=v[v.length-1],t;
  if(x.counter||!x.cur.e1){var d=b-a;t=d?(d>0?'+':'−')+Math.abs(d)+' повт.':'ровно'}
  else{var pc=a?Math.round((b-a)/a*100):0;t=pc?(pc>0?'+':'−')+Math.abs(pc)+'% сила':'сила ровно'}
  return '<div class="trend">'+trendSvg(v)+'<span style="color:'+(b>a?'var(--volt)':(b<a?'var(--org)':'var(--mu)'))+'">'+t+'</span></div>';
}

  if(dT!=null)h+='<span class="chip '+(Math.abs(dT)<3?'':(dT>0?'up':'down'))+'">'+(Math.abs(dT)<3?'= как прошлая '+L:(dT>0?'↑ +':'↓ −')+Math.abs(dT)+'% к прошлой '+L)+'</span>';
  if(st.prs)h+='<span class="chip heat">★ '+plural(st.prs,'рекорд','рекорда','рекордов')+'</span>';
  h+='</div><div class="tiles"><div class="tile"><b>'+st.sets+'</b><span>подходов</span></div><div class="tile"><b>'+(mins||'—')+'</b><span>минут</span></div><div class="tile"><b>'+(s.hr?Math.round(s.hr):'—')+'</b><span>пульс, ср.</span></div></div>'+(feel?'<div class="feelq">После: '+esc(feel)+'</div>':'')+'</div>';

/* ================= week ================= */
function weekStart(iso){var wd=(dObj(iso).getDay()+6)%7;return isoAdd(iso,-wd)}
function planPerWeek(){return Object.keys((S.boot.program&&S.boot.program.days)||{}).length||3}
function exGroup(name){
  var g='',days=(S.boot.program&&S.boot.program.days)||{};
  Object.keys(days).forEach(function(d){(days[d]||[]).forEach(function(it){if(it.name===name&&it.group)g=it.group})});
  if(!g){var c=catFor(name);g=c&&c.group||''}
  return capz(String(g||'Другое').split(/[,;(]/)[0].trim()||'Другое');
}
function weekData(ws){
  var we=isoAdd(ws,6),list=workoutsList().filter(function(x){return x.date>=ws&&x.date<=we}).reverse();
  var o={ws:ws,we:we,list:list,ton:0,sets:0,prs:0,cnt:{up:0,same:0,down:0,'new':0},movers:[],groups:{}};
  list.forEach(function(w){var st=wkStats(w);o.ton+=st.ton;o.sets+=st.sets;o.prs+=st.prs;['up','same','down','new'].forEach(function(k){o.cnt[k]+=st.count[k]});
    st.list.forEach(function(x){if(x.st.k==='up')o.movers.push({name:x.name,t:x.st.t,pr:x.pr});var g=exGroup(x.name);o.groups[g]=(o.groups[g]||0)+x.rows.length})});
  return o;
}
function weekAi(ws){var it=(S.boot&&S.boot.ai&&S.boot.ai.items)||[],r=null;it.forEach(function(x){if(x.type==='week'&&weekStart(isoAdd(x.date,-1))===ws)r=x});return r}
function weekRange(ws){var a=dObj(ws),b=dObj(isoAdd(ws,6));return a.getMonth()===b.getMonth()?a.getDate()+'–'+b.getDate()+' '+MONTHS[b.getMonth()]:fmtDay(ws)+' – '+fmtDay(isoAdd(ws,6))}

}

/* ================= sync queue ================= */
function qKey(op,p){return op==='finishSession'?'finish|'+p.date+'|'+p.workout:p.date+'|'+p.workout+'|'+p.exercise+'|'+p.setNo}
function enqueue(op,p){
  var key=qKey(op,p);
  S.queue=S.queue.filter(function(it){return (S.inflight&&S.inflight.indexOf(it)>=0)||it.key!==key});
  S.queue.push({key:key,op:op,p:p,tries:0});
  saveQueue();renderSync();
  clearTimeout(S.flushT);S.flushT=setTimeout(flush,250); // one request for a burst of edits
}
function flushNow(){clearTimeout(S.flushT);flush()}
function flush(){
  if(S.inflight||!S.queue.length){if(!S.inflight)aiReviewMaybe();return renderSync()}
  var batch=S.queue.slice(0,40);S.inflight=batch;renderSync();
  google.script.run
    .withSuccessHandler(function(results){
      results=results||[];
      var doneItems=[];
      for(var i=0;i<batch.length;i++){
        var r=results[i];if(!r)break;
        if(r.ok===false&&r.error){S.syncErr=r.error;break}
        if(r.ok===false)toast(r.reason||'Таблица отклонила операцию','bad'); // permanent refusal (e.g. row not written by the form): do not retry forever
        doneItems.push(batch[i]);
        if(batch[i].op==='saveSet')mergeLog(batch[i].p);
        if(batch[i].op==='deleteSet')unmergeLog(batch[i].p);
      }
      S.inflight=null;
      S.queue=S.queue.filter(function(x){return doneItems.indexOf(x)<0});saveQueue();
      if(doneItems.length===batch.length){S.syncErr=null;renderSync();flush()}
      else{renderSync();toast('Таблица не приняла запись: '+(S.syncErr||''),'bad');clearTimeout(S.retryT);S.retryT=setTimeout(flush,15000)}
    })
    .withFailureHandler(function(err){
      S.inflight=null;batch.forEach(function(it){it.tries++});S.syncErr=(err&&err.message)||'Нет связи';saveQueue();renderSync();
      clearTimeout(S.retryT);S.retryT=setTimeout(flush,Math.min(30000,1500*Math.pow(2,batch[0].tries-1)));
    })
    .applyOps(batch.map(function(it){return {op:it.op,p:it.p}}));
}
function mergeLog(p){
  var L=S.boot.log||(S.boot.log=[]);
  var i=L.findIndex(function(r){return r.date===p.date&&r.workout===p.workout&&r.exercise===p.exercise&&r.setNo===p.setNo});
  var row={date:p.date,workout:p.workout,exercise:p.exercise,setNo:p.setNo,kg:num(p.kg),reps:num(p.reps),rir:num(p.rir),feeling:p.feeling||'',note:MARK+(p.note?'; '+p.note:'')};
  if(i>=0)L[i]=row;else L.push(row);
  S._wl=null;
}
function unmergeLog(p){S._wl=null;S.boot.log=(S.boot.log||[]).filter(function(r){return !(r.date===p.date&&r.workout===p.workout&&r.exercise===p.exercise&&r.setNo===p.setNo)})}
window.addEventListener('online',function(){clearTimeout(S.retryT);flushNow()});

function renderSync(){
  var html=syncPill();
  $$('.sync-host').forEach(function(h){h.innerHTML=html});
  var ds=$('#done-save');if(ds)ds.innerHTML=doneSaveState();
}
function syncPill(){
  var n=S.queue.length;
  if(!n)return '<span class="sync"><i></i>Сохранено</span>';
  if(S.syncErr&&!S.inflight)return '<span class="sync off"><i></i>Ждёт сети · '+n+'</span>';
  return '<span class="sync saving"><i></i>Сохраняю</span>';
}

/* ================= session ops ================= */
function newSession(day,date,opts){
  opts=opts||{};
  S.session={id:Date.now().toString(36),date:date,day:day,workout:opts.workout||workoutName(day),startedAt:Date.now(),energy:'',
    plan:JSON.parse(JSON.stringify(S.boot.program.days[day]||[])),sets:{},rir:{},notes:{},extra:{},rest:null,page:0,backfill:date!==todayISO(),watchMin:opts.watchMin||null};
  if(opts.coach&&!S.session.backfill){S.session.coach=opts.coach;if(opts.aiPlan)S.session.aiPlan=JSON.parse(JSON.stringify(opts.aiPlan));S.session.energy=CI_ENERGY[opts.coach.feel]||'';if(opts.coach.mode==='light')cutPlan(true)}
  prefill();
  saveSession();
}
/* light day: one set fewer where the plan has 3+ sets (never below what is already done) */
function cutPlan(on){
  var s=S.session,c=s.coach;c.cut=c.cut||{};
  var done={};exList().forEach(function(ex){done[ex.name]=doneSets(ex).length});
  s.plan.forEach(function(it){
    if(on&&!c.cut[it.order]&&it.sets>=3&&(done[it.name]||0)<it.sets){it.sets--;c.cut[it.order]=1}
    else if(!on&&c.cut[it.order]){it.sets++;delete c.cut[it.order]}
  });
  delete dayCache['s:'+s.id];
}
/* pre-fill planned sets: the coach's target for today (or, when entering a past workout, last time's numbers).
   Only fields the user has not typed into are touched (a_* flags). */
function prefill(){
  var s=S.session,mode=s.coach&&!s.backfill?s.coach.mode:null;
  exList().forEach(function(ex){
    var prev=prevSession(ex,s.date);if(!prev||!prev.sets.length)return;
    var tg=mode?target(ex,prev,mode).sets:null;
    for(var n=1;n<=ex.sets;n++){
      var o=setObj(ex,n);if(o.done)continue;
      var p=tg?tg[n-1]:(function(q){var lr=ex.unilateral?parseLR(q.note):null;return {kg:q.kg,reps:q.reps,left:lr?lr[0]:q.reps,right:lr?lr[1]:q.reps}})(prev.sets[n-1]||prev.sets[prev.sets.length-1]);
      if(!p)continue;
      putAuto(o,'kg',p.kg);
      if(ex.unilateral){putAuto(o,'left',p.left);putAuto(o,'right',p.right)}else putAuto(o,'reps',p.reps);
    }
  });
}
function putAuto(o,f,v){if(v==null||v==='')return;if(o[f]==null||o[f]===''||o['a_'+f]){o[f]=str(v);o['a_'+f]=1}}
function setMode(m){
  var s=S.session;if(!s||!s.coach||s.coach.mode===m)return;
  s.coach.mode=m;s.coach.manual=1;cutPlan(m==='light');prefill();saveSession();renderWorkout();
  toast(m==='light'?'Лёгкий день: цели пересчитаны':'Обычный день: цели с прогрессией','volt');
}
function exList(){var s=S.session;return s.plan?buildDay(s.day,s.plan,'s:'+s.id):buildDay(s.day)} // a running workout keeps the program it started with
function setCount(ex){return ex.sets+(S.session.extra[ex.id]||0)}
function setObj(ex,n){var k=ex.id+'#'+n;return S.session.sets[k]||(S.session.sets[k]={})}
function doneSets(ex){var a=[];for(var n=1;n<=setCount(ex);n++){var s=S.session.sets[ex.id+'#'+n];if(s&&s.done)a.push(n)}return a}
function firstOpen(ex){for(var n=1;n<=setCount(ex);n++){if(!setObj(ex,n).done)return n}return 0}
function repsOf(ex,o){return ex.unilateral?Math.min(num(o.left)||0,num(o.right)||0):num(o.reps)}
function totals(){
  var planned=0,done=0,ton=0;
  exList().forEach(function(e){planned+=e.sets;for(var n=1;n<=setCount(e);n++){var s=S.session.sets[e.id+'#'+n];if(s&&s.done){done++;if(e.counter)continue;var r=e.unilateral?((num(s.left)||0)+(num(s.right)||0)):num(s.reps);ton+=(num(s.kg)||0)*(r||0)}}});
  return {planned:planned,done:done,ton:ton};
}
function payloadFor(ex,n){
  var s=setObj(ex,n),ds=doneSets(ex),last=ds.length?ds[ds.length-1]:0;
  var notes=[];
  if(ex.dumbbell)notes.push('вес одной гантели');
  if(ex.addedWeight)notes.push('добавочный вес');
  if(ex.counter)notes.push('в гравитроне — противовес');
  if(ex.unilateral)notes.push('левая '+(s.left||'—')+', правая '+(s.right||'—'));
  if(n>ex.sets)notes.push('дополнительный подход');
  if(S.session.notes[ex.id])notes.push(S.session.notes[ex.id]);
  return {date:S.session.date,workout:S.session.workout,exercise:ex.name,setNo:n,kg:num(s.kg),reps:repsOf(ex,s),
    rir:(n===last&&S.session.rir[ex.id]!=null)?S.session.rir[ex.id]:null,note:notes.join('; '),feeling:''};
}
function resaveExercise(ex){doneSets(ex).forEach(function(n){enqueue('saveSet',payloadFor(ex,n))})}
function minutesNow(){var s=S.session;if(s.minutes!=null&&s.minutesTouched)return s.minutes;if(s.backfill)return s.watchMin||null;return Math.max(1,Math.round((Date.now()-s.startedAt)/60000))}

function debounce(k,f,ms){clearTimeout(timers[k]);timerFns[k]=f;timers[k]=setTimeout(function(){delete timers[k];delete timerFns[k];f()},ms)}
function cancelTimer(k){clearTimeout(timers[k]);delete timers[k];delete timerFns[k]}
function pendingEdits(){return Object.keys(timerFns).filter(function(k){return /^(set|note)/.test(k)})}
function drainEdits(){pendingEdits().forEach(function(k){var f=timerFns[k];cancelTimer(k);f()})} // send edits still waiting for their debounce

function toggleSet(exId,n){
  var ex=exById(exId),o=setObj(ex,n),row=$('.set-row[data-ex="'+exId+'"][data-n="'+n+'"]');
  if(o.done){
    cancelTimer('set'+exId+n);
    o.done=false;saveSession();
    if(S.session.rest&&S.session.rest.src===exId+'#'+n)stopRest(); // the rest belonged to the set just unticked
    enqueue('deleteSet',{date:S.session.date,workout:S.session.workout,exercise:ex.name,setNo:n});
    var nl=doneSets(ex).slice(-1)[0];if(nl&&nl<n&&S.session.rir[ex.id]!=null)enqueue('saveSet',payloadFor(ex,nl));
    rerenderEx(exId);return;
  }
  var okKg=num(o.kg)!=null,okR=ex.unilateral?(num(o.left)!=null&&num(o.right)!=null):num(o.reps)!=null;
  if(!okKg||!okR){
    if(row){row.classList.remove('shake');void row.offsetWidth;row.classList.add('shake');var first=$$('.num',row).filter(function(i){return !i.value})[0];if(first)first.focus()}
    toast(!okKg?'Введи вес (0 — если без веса)':'Введи число повторов');return;
  }
  var prevLast=doneSets(ex).slice(-1)[0]||0;
  o.done=true;o.doneAt=Date.now();saveSession();
  var best=bestE1(ex,S.session.date);
  enqueue('saveSet',payloadFor(ex,n));
  if(S.session.rir[ex.id]!=null&&prevLast&&prevLast<n)enqueue('saveSet',payloadFor(ex,prevLast)); // RIR moves to the new last set
  if(best>0&&e1rm(num(o.kg),repsOf(ex,o))>best)toast('Новый рекорд: '+short(ex.name),'volt');
  rerenderEx(exId);
  var remaining=doneSets(ex).length<ex.sets,partner=ssNext(ex);
  if(partner){ // superset: straight to the partner, no rest
    if(remaining)setTimeout(function(){goToEx(partner.id)},380);
    return;
  }
  var nx=nextTarget(ex);
  if(!S.session.backfill){startRest(ex.restSec,nx?nx.label:'Последний подход позади');S.session.rest.src=exId+'#'+n;saveSession()}
  if(nx&&nx.ex.id!==ex.id&&remaining)setTimeout(function(){goToEx(nx.ex.id)},380); // back to the first exercise of the superset
  else if(nx&&nx.ex.id===ex.id)revealRow(ex.id,nx.n);
}

function rmSet(exId){var ex=exById(exId),n=setCount(ex),last=S.session.sets[exId+'#'+n];if(n<=ex.sets||(last&&last.done))return;delete S.session.sets[exId+'#'+n];S.session.extra[exId]=Math.max(0,(S.session.extra[exId]||0)-1);saveSession();rerenderEx(exId)}
function nextTarget(ex){

var restTick=null,audioCtx=null;
function unlockAudio(){if(audioCtx)return;try{var C=window.AudioContext||window.webkitAudioContext;if(C){audioCtx=new C();var o=audioCtx.createOscillator(),g=audioCtx.createGain();g.gain.value=0;o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.01)}}catch(e){}}
function beep(){if(!audioCtx)return;try{if(audioCtx.state==='suspended')audioCtx.resume();[0,.22,.44].forEach(function(t,i){var o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=i===2?1320:880;o.type='sine';g.gain.setValueAtTime(.0001,audioCtx.currentTime+t);g.gain.exponentialRampToValueAtTime(.35,audioCtx.currentTime+t+.02);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+t+.18);o.connect(g);g.connect(audioCtx.destination);o.start(audioCtx.currentTime+t);o.stop(audioCtx.currentTime+t+.2)})}catch(e){}if(navigator.vibrate)navigator.vibrate([200,100,200])}
function startRest(sec,label){S.session.rest={endAt:Date.now()+sec*1000,total:sec,label:label};saveSession();runRest()}
function adjRest(d){var r=S.session&&S.session.rest;if(!r)return;r.endAt+=d*1000;r.total=Math.max(15,r.total+d);saveSession();runRest()}
function stopRest(){if(S.session){S.session.rest=null;saveSession()}clearInterval(restTick);restTick=null;$('#rest').className='rest';document.body.classList.remove('resting')}
function runRest(){
  clearInterval(restTick);var el=$('#rest'),r=S.session&&S.session.rest;if(!r||S.view!=='workout'){el.className='rest';document.body.classList.remove('resting');return}
  if(r.endAt<Date.now()-8000){stopRest();return}
  var C=2*Math.PI*26,ended=false;
  el.innerHTML='<div class="ring"><svg viewBox="0 0 60 60"><circle cx="30" cy="30" r="26" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="5"/><circle id="rest-c" cx="30" cy="30" r="26" fill="none" stroke="#D4FF3A" stroke-width="5" stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="0"/></svg><div class="tm" id="rest-tm"></div></div><div class="t"><b id="rest-h">Отдых</b><span>'+esc(r.label)+'</span></div><button class="rb" data-act="rest-minus">−15</button><button class="rb" data-act="rest-plus">+15</button><button class="rb" data-act="rest-skip" aria-label="Пропустить отдых">'+I.x.replace('<svg','<svg width="18" height="18"')+'</button>';
  el.className='rest on';document.body.classList.add('resting');
  function tick(){
    var left=(r.endAt-Date.now())/1000,c=$('#rest-c'),tm=$('#rest-tm');if(!c)return;
    if(left<=0){
      if(!ended){ended=true;if(left>-2)beep();el.classList.add('end');$('#rest-h').textContent='Время! Следующий подход';tm.textContent='0:00';c.setAttribute('stroke','#0B0B0C');c.style.strokeDashoffset=0}
      if(left<-8)stopRest();return;

}

  var n=S.queue.length;
  if(!n)return '<span class="good" style="display:flex;gap:8px;align-items:center">'+I.check+'Записано в Google Таблицу</span>';
  if(S.syncErr&&!S.inflight)return '<span class="warnc">Ждёт сети: '+n+'. Данные сохранены в телефоне</span>';
  return '<span class="muc">Записываю в таблицу…</span>';
}
function renderDone(){
  var d=S.lastDone;if(!d){S.view='home';return render()}
  var h='<div class="screen"><div class="scroll"><div class="pad"><div class="done-hero"><div class="done-badge">'+I.check+'</div><h1>Тренировка<br>завершена</h1><div class="muc" style="font-size:15px">'+esc(short(d.workout.replace(/ · .*/,'')))+' · '+esc(fmtDay(d.date))+'</div><div class="save-state" id="done-save">'+doneSaveState()+'</div></div>';
  h+='<div class="stats"><div class="stat"><div class="v">'+d.totals.done+'<small> / '+d.totals.planned+'</small></div><div class="l">подходов</div></div><div class="stat"><div class="v">'+(d.minutes||'—')+'</div><div class="l">минут</div></div><div class="stat"><div class="v">'+Math.round(d.totals.ton).toLocaleString('ru-RU')+'</div><div class="l">тоннаж, кг</div></div><div class="stat"><div class="v">'+d.prs.length+'</div><div class="l">'+(d.prs.length===1?'рекорд':'рекордов')+'</div></div></div>';
  if(d.prs.length)h+='<div class="card" style="margin-top:12px"><div class="t17" style="margin-bottom:6px">Рекорды</div>'+d.prs.map(function(p){return '<div style="font-size:15px;padding:4px 0">'+esc(p)+'</div>'}).join('')+'</div>';
  h+='<button class="glass ai tap" data-act="hist" data-key="'+esc(d.date+'|'+baseName(d.workout))+'"><div class="go" style="margin:0"><span>Графики и сравнение по упражнениям</span>'+I.fwd+'</div></button>';
  if(aiOn())h+='<div id="ai-review">'+aiReviewHtml()+'</div>';
  else h+='<div class="card" style="margin-top:12px;font-size:15px;color:var(--mu);line-height:1.45">Данные уже в таблице — ChatGPT ничего записывать не нужно. Для разбора напиши ему «разбери сегодняшнюю тренировку» или вставь отчёт.</div>';
  h+='<div style="height:20px"></div></div></div>';
  h+='<div class="bottom"><button class="cta ghost" data-act="copy" style="margin-bottom:10px">Скопировать отчёт для ChatGPT</button><button class="cta" data-act="to-home">На главную</button></div></div>';
  $('#app').innerHTML=h;
  aiReviewMaybe();
}
function copyReport(){
  var txt=(S.lastDone&&S.lastDone.report)||'';
  function fallback(){var ta=document.createElement('textarea');ta.value=txt;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,txt.length);var ok=false;try{ok=document.execCommand('copy')}catch(e){}document.body.removeChild(ta);toast(ok?'Отчёт скопирован':'Не удалось скопировать',ok?'volt':'bad')}
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(function(){toast('Отчёт скопирован','volt')},fallback);else fallback();
}

/* ================= toast ================= */
var toastT;function toast(msg,kind){var t=$('#toast');t.textContent=msg;t.className='toast on'+(kind?' '+kind:'');clearTimeout(toastT);toastT=setTimeout(function(){t.className='toast'},2400)}

/* ================= boot ================= */
function load(){
  google.script.run.withSuccessHandler(function(b){
    S.boot=b;dayCache={};S._wl=null;S.queue.forEach(function(it){if(it.op==='saveSet')mergeLog(it.p);else if(it.op==='deleteSet')unmergeLog(it.p)});lsSet(LS.boot,b);
    setTimeout(function(){aiEnsure();aiReviewMaybe()},0);
    if(S.view==='workout'&&$('#pager'))return; // never redraw under the fingers mid-workout
    if(S.view==='home'&&document.activeElement&&document.activeElement.tagName==='INPUT')return;
    render();
  }).withFailureHandler(function(err){
    if(!S.boot)$('#app').innerHTML='<div class="loading"><div><div class="logo">Трени<i>ровка</i></div><p class="muc">Не удалось загрузить данные: '+esc(err&&err.message||'нет связи')+'</p><button class="cta" onclick="location.reload()">Повторить</button></div></div>';
    else toast('Нет связи — работаю с сохранёнными данными');
  }).getBootstrap();
}
if(S.lastDone&&S.queue.length)S.view='done';
else if(S.session)S.view='workout';
if(S.boot){render();if(S.session&&S.session.rest)runRest()}
load();flush();
})();
</script>
</body>
</html>
