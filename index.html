/* ================= chart kit (inline SVG) ================= */
var COL={up:'#D4FF3A',same:'#8A8A93',down:'#FF7A33','new':'#7AA7FF'},ST_LBL={up:'Прогресс',same:'На месте',down:'Откат','new':'Впервые'},ST_ARR={up:'↑',same:'=',down:'↓','new':'+'};
var BARG={up:'linear-gradient(180deg,#D4FF3A 0%,#FF9A3C 100%)',same:'linear-gradient(180deg,#8A8A93,rgba(138,138,147,.25))',down:'linear-gradient(180deg,#FF7A33,rgba(255,122,51,.3))','new':'linear-gradient(180deg,#7AA7FF,rgba(122,167,255,.3))'};
var svgN=0;
function heatDef(id){return '<defs><linearGradient id="'+id+'" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF5E2B"/><stop offset=".45" stop-color="#FF9A3C"/><stop offset="1" stop-color="#D4FF3A"/></linearGradient></defs>'}
/* soft glow as a blurred copy under the mark: an SVG filter, because Safari ignores CSS drop-shadow on SVG shapes */
function glow(el,W,H){var id='gl'+(++svgN);return '<filter id="'+id+'" filterUnits="userSpaceOnUse" x="-30" y="-30" width="'+(W+60)+'" height="'+(H+60)+'"><feGaussianBlur stdDeviation="5"/></filter>'+el.replace(/\/>$/,' opacity=".65" filter="url(#'+id+')"/>')+el}
function pt(cx,cy,r,a){return (cx+r*Math.sin(a)).toFixed(2)+' '+(cy-r*Math.cos(a)).toFixed(2)}
function arc(cx,cy,r,a0,a1){return 'M'+pt(cx,cy,r,a0)+'A'+r+' '+r+' 0 '+(a1-a0>Math.PI?1:0)+' 1 '+pt(cx,cy,r,a1)}
/* segmented donut: segs [{v,c}], rounded ends with a gap between them */
function donut(segs,size,sw,center){
  var r=(size-sw)/2,c=size/2,tot=0,live=segs.filter(function(s){return s.v>0});live.forEach(function(s){tot+=s.v});
  var h='<circle cx="'+c+'" cy="'+c+'" r="'+r+'" fill="none" stroke="rgba(255,255,255,.06)" stroke-width="'+sw+'"/>';
  if(live.length===1)h+=glow('<circle cx="'+c+'" cy="'+c+'" r="'+r+'" fill="none" stroke="'+live[0].c+'" stroke-width="'+sw+'"/>',size,size);
  else if(live.length>1){var gap=sw/r+0.08,a=0;
    live.forEach(function(s){var span=s.v/tot*2*Math.PI,a0=a+gap/2,a1=a+span-gap/2;if(a1<a0+0.001){var m=a+span/2;a0=m-0.0005;a1=m+0.0005}
      h+=glow('<path d="'+arc(c,c,r,a0,a1)+'" fill="none" stroke="'+s.c+'" stroke-width="'+sw+'" stroke-linecap="round"/>',size,size);a+=span})}
  return '<div class="donut" style="width:'+size+'px;height:'+size+'px"><svg viewBox="0 0 '+size+' '+size+'">'+h+'</svg><div class="dc">'+(center||'')+'</div></div>';
}
/* concentric progress rings, outer first: items [{p:0..1, c:'#hex'|'heat'}] */
function rings(items,size,center){
  var sw=Math.max(7,Math.round(size*(items.length>1?0.07:0.09))),c=size/2,h='',defs='';
  items.forEach(function(it,i){
    var r=c-sw/2-i*(sw+4),p=Math.max(0,Math.min(it.p||0,1)),L=2*Math.PI*r,col=it.c;
    if(col==='heat'){var id='hg'+(++svgN);defs+=heatDef(id);col='url(#'+id+')'}
    h+='<circle cx="'+c+'" cy="'+c+'" r="'+r+'" fill="none" stroke="'+(it.c==='heat'?'#FF7A33':it.c)+'" stroke-opacity=".13" stroke-width="'+sw+'"/>';
    if(p>0)h+=glow('<circle cx="'+c+'" cy="'+c+'" r="'+r+'" fill="none" stroke="'+col+'" stroke-width="'+sw+'" stroke-linecap="round" stroke-dasharray="'+(L*p).toFixed(1)+' '+(L+1).toFixed(1)+'" transform="rotate(-90 '+c+' '+c+')"/>',size,size);
  });
  return '<div class="donut" style="width:'+size+'px;height:'+size+'px"><svg viewBox="0 0 '+size+' '+size+'">'+defs+h+'</svg><div class="dc">'+(center||'')+'</div></div>';
}
/* half-circle gauge: the tick on top is the personal norm, the arc fills to today's value */
function gauge(label,v,unit,dec,b,hi,vs){
  var cx=55,cy=56,r=44,sw=9,A=Math.PI/2,t=0,cls='flat',d='',k=Math.pow(10,dec);
  if(v!=null&&b){var span=Math.max(b.sd*2.5,b.m*.2)||1,diff=v-b.m,pct=Math.abs(diff)/b.m;t=Math.max(-1,Math.min(1,diff/span));
    cls=pct<.04?'flat':((diff>0)===hi?'up':'down');d=pct<.04?'как обычно':(diff>0?'+':'−')+fmtN(Math.round(Math.abs(diff)*k)/k)+' '+(vs||'к норме')}
  var col={up:'#D4FF3A',down:'#FF7A33',flat:'#8A8A93'}[cls];
  var s='<svg viewBox="0 0 110 64" aria-hidden="true"><path d="'+arc(cx,cy,r,-A,A)+'" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="'+sw+'" stroke-linecap="round"/>';
  if(v!=null)s+=glow('<path d="'+arc(cx,cy,r,-A,Math.max(-A+0.03,t*A))+'" fill="none" stroke="'+col+'" stroke-width="'+sw+'" stroke-linecap="round"/>',110,64);
  if(b)s+='<line x1="'+cx+'" y1="'+(cy-r-8)+'" x2="'+cx+'" y2="'+(cy-r+7)+'" stroke="rgba(255,255,255,.75)" stroke-width="2" stroke-linecap="round"/>';
  return '<div class="gauge">'+s+'</svg><b>'+(v!=null?fmtN(Math.round(v*k)/k):'—')+(unit?'<small>'+unit+'</small>':'')+'</b><span>'+label+'</span>'+(d?'<em class="dl '+cls+'">'+d+'</em>':'')+'</div>';
}
function trendSvg(v){
  if(v.length<2)return '';
  var W=84,H=34,mn=Math.min.apply(null,v),mx=Math.max.apply(null,v),r=mx-mn||1,id='tg'+(++svgN);
  var p=v.map(function(x,i){return [(4+i*(W-8)/(v.length-1)).toFixed(1),(H-5-(x-mn)/r*(H-10)).toFixed(1)]}),l=p[p.length-1];
  return '<svg viewBox="0 0 '+W+' '+H+'" aria-hidden="true"><defs><linearGradient id="'+id+'" x1="0" x2="1"><stop offset="0" stop-color="#55555C"/><stop offset="1" stop-color="#FF9A3C"/></linearGradient></defs><polyline points="'+p.map(function(q){return q.join(',')}).join(' ')+'" fill="none" stroke="url(#'+id+')" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="'+l[0]+'" cy="'+l[1]+'" r="4" fill="#D4FF3A" stroke="#141416" stroke-width="2"/></svg>';
}
function fmtT(kg){return fmtN(Math.round(kg/100)/10)}
function capz(s){return s.charAt(0).toUpperCase()+s.slice(1)}

/* ================= history: past workouts ================= */
function baseName(w){return String(w||'').replace(/ · .*/,'')}
function dayLetter(w){var m=/Full Body ([ABC])/.exec(w||'');return m?m[1]:''}
function rowReps(r){var lr=parseLR(r.note);return lr?(num(lr[0])||0)+(num(lr[1])||0):(r.reps||0)}
function isCounter(name){var c=catFor(name);return !!(c&&/ПРОТИВОВЕС/i.test(c.weightMeaning||''))}
function exHist(name){return {hist:histRe(name)}}
/* one entry per date + workout, newest first, with the «Сессии» row (minutes, pulse) when there is one */
function workoutsList(){
  if(S._wl)return S._wl;
  var by={},keys=[],ss=S.boot.sessions||[];
  (S.boot.log||[]).forEach(function(r){if(!r.date||!r.exercise||!r.setNo)return;var k=r.date+'|'+baseName(r.workout);if(!by[k]){by[k]={key:k,date:r.date,workout:r.workout,name:baseName(r.workout),rows:[]};keys.push(k)}by[k].rows.push(r)});
  return (S._wl=keys.map(function(k){var w=by[k];w.sess=ss.filter(function(x){return x.date===w.date&&baseName(x.workout)===w.name})[0]||null;return w})
    .sort(function(a,b){return a.date<b.date?1:(a.date>b.date?-1:0)}));
}
function exMetrics(rows,cnt){
  var top=null,reps=0,e1=0,topReps=0,topSets=0,vol=0;
  rows.forEach(function(r){reps+=rowReps(r);if(r.kg!=null&&(top==null||(cnt?r.kg<top:r.kg>top)))top=r.kg;if(!cnt){e1=Math.max(e1,e1rm(r.kg,r.reps));vol+=(r.kg>0?r.kg:0)*rowReps(r)}});
  rows.forEach(function(r){if(r.kg===top){topReps+=rowReps(r);topSets++}});
  return {top:top,reps:reps,e1:e1,topReps:topReps,topSets:topSets,vol:vol};
}
/* Against the previous time. With weights: strength is the best set's estimated max (Epley), work is kg × reps.
   Within ±2.5% strength is the same (day-to-day noise), and then the work decides: 90×10/9/8 after
   90×11, 100×6, 110×4 is more work at the same strength — progress, not a 20 kg drop.
   A drop only when strength fell more than 5% without extra work, or the work fell 10% without extra strength.
   Without weights or with a counterweight (lighter is harder): weight, then sets, then reps, as before. */
var ST_SAME=0.025,ST_DROP=0.05,VOL_UP=0.05,VOL_DROP=0.10;
function pctTxt(x){return (x>0?'+':'−')+Math.round(Math.abs(x)*100)+'%'}
function exStatus(c,p,cnt){
  if(!p)return {k:'new',t:'впервые'};
  if(!cnt&&c.e1>0&&p.e1>0&&c.vol>0&&p.vol>0){
    var de=c.e1/p.e1-1,dv=c.vol/p.vol-1,dvTxt='объём '+pctTxt(dv);
    if(de>=ST_SAME)return {k:'up',t:'сила '+pctTxt(de)+(dv>=VOL_UP?', '+dvTxt:'')};
    if(dv>=VOL_UP&&de>-ST_DROP)return {k:'up',t:dvTxt+(de>-ST_SAME?', сила на уровне':', сила '+pctTxt(de))};
    if(de<=-ST_DROP&&dv<VOL_DROP)return {k:'down',t:'сила '+pctTxt(de)+(dv<=-VOL_UP?', '+dvTxt:'')};
    if(dv<=-VOL_DROP)return {k:'down',t:dvTxt+(de>-ST_SAME?', сила на уровне':', сила '+pctTxt(de))};
    return {k:'same',t:de<=-ST_DROP?'легче, но '+dvTxt:'на уровне прошлого раза'};
  }
  if(c.top!=null&&p.top!=null&&c.top!==p.top){var d=c.top-p.top;return {k:(cnt?d<0:d>0)?'up':'down',t:(d>0?'+':'−')+fmtN(Math.abs(d))+' кг'+(cnt?' противовеса':'')}}
  var at=c.top>0?' с '+fmtN(c.top)+' кг':'',ds=c.top!=null?c.topSets-p.topSets:0;
  if(ds)return {k:ds>0?'up':'down',t:(ds>0?'+':'−')+plural(Math.abs(ds),'подход','подхода','подходов')+at};
  var dr=(c.top!=null?c.topReps:c.reps)-(p.top!=null?p.topReps:p.reps);
  if(dr>0)return {k:'up',t:'+'+plural(dr,'повтор','повтора','повторов')+at};
  if(dr<0)return {k:'down',t:'−'+plural(-dr,'повтор','повтора','повторов')+at};
  return {k:'same',t:'как в прошлый раз'};
}
function wkStats(w){
  if(w._st)return w._st;
  var ex={},names=[],ton=0;
  w.rows.forEach(function(r){if(!ex[r.exercise]){ex[r.exercise]=[];names.push(r.exercise)}ex[r.exercise].push(r)});
  var list=names.map(function(n){
    var rows=ex[n].sort(function(a,b){return a.setNo-b.setNo}),cnt=isCounter(n),h=exHist(n);
    if(!cnt)rows.forEach(function(r){ton+=(r.kg||0)*rowReps(r)});
    var prev=prevSession(h,w.date),cur=exMetrics(rows,cnt),pm=prev?exMetrics(prev.sets,cnt):null;
    var best=bestE1(h,w.date),th=historyList(h,isoAdd(w.date,1),6).reverse(),trend=th.map(function(x){var m=exMetrics(x.sets,cnt);return m.e1||m.reps});
    return {name:n,rows:rows,prev:prev,cur:cur,st:exStatus(cur,pm,cnt),pr:!cnt&&!!prev&&best>0&&cur.e1>best+0.01,trend:trend,trendFrom:th.length?th[0].date:null,counter:cnt};
  });
  var c={up:0,same:0,down:0,'new':0};list.forEach(function(x){c[x.st.k]++});
  return (w._st={list:list,ton:ton,sets:w.rows.length,count:c,prs:list.filter(function(x){return x.pr}).length});
}
function mixSegs(c){return ['up','same','down','new'].map(function(k){return {v:c[k],c:COL[k]}})}
function wkMinutes(w){var s=w.sess||{};return s.minutes||(s.watchMin?Math.round(s.watchMin):null)}
function histRow(w,i){
  var st=wkStats(w),d=dObj(w.date),m=wkMinutes(w),c=st.count;
  return '<button class="hrow" data-act="hist" data-key="'+esc(w.key)+'"><div class="dt'+(i===0?' hot':'')+'"><b>'+d.getDate()+'</b><span>'+MONTHS[d.getMonth()].slice(0,3)+'</span></div><div class="md"><b>'+esc(w.name)+'</b><span>'+st.sets+' подх.'+(m?' · '+m+' мин':'')+'</span><div class="sb">'+['up','same','down','new'].map(function(k){return c[k]?'<i style="flex:'+c[k]+';background:'+COL[k]+'"></i>':''}).join('')+'</div></div><div class="rt"><b>'+fmtT(st.ton)+' т</b><span>'+(st.prs?'★ '+st.prs+' · ':'')+'↑ '+c.up+' из '+st.list.length+'</span></div>'+I.fwd+'</button>';
}
function openHist(key,back){if(!key)return openAiSheet();S.hist={key:key,back:back||(S.view==='done'||S.view==='week'?S.view:'home')};S.view='hist';render();var sc=$('#hist-scroll');if(sc)sc.scrollTop=0}
function setBarsHtml(x){
  var useReps=x.counter||x.rows.every(function(r){return !(r.kg>0)});
  var val=function(r){return useReps?rowReps(r):r.kg*rowReps(r)},pv=x.prev?x.prev.sets:[];
  var mx=Math.max.apply(null,x.rows.map(val).concat(pv.map(val)))||1;
  return '<div class="setbars">'+x.rows.map(function(r,i){
    var h=Math.max(8,Math.round(val(r)/mx*66)),p=pv[i],ph=p?Math.round(val(p)/mx*66):null,rir=i===x.rows.length-1?num(r.rir):null;
    var lr=parseLR(r.note),reps=lr?lr[0]+'/'+lr[1]:fmtN(r.reps);
    return '<div class="sb1"><div class="col" style="height:'+h+'px"><div class="bar" style="background:'+BARG[x.st.k]+';top:0"></div>'+(ph!=null?'<div class="tick" style="bottom:'+(ph-1)+'px"></div>':'')+'</div><div class="lb'+(rir===0?' f':'')+'">'+(r.kg!=null?fmtN(r.kg)+'×'+reps:reps+' повт.')+'</div></div>';
  }).join('')+'</div>';
}
/* the line spans up to six times: the chip compares with the previous time, this label with the first point («с 30.10»),
   so a drop since last time and a gain over the weeks can both be true without reading as a contradiction */
function trendHtml(x){
  var v=x.trend;if(v.length<2)return '';
  var a=v[0],b=v[v.length-1],t,since=x.trendFrom?' с '+fmtShort(x.trendFrom):'';
  if(x.counter||!x.cur.e1){var d=b-a;t=(d?(d>0?'+':'−')+Math.abs(d)+' повт.':'ровно')+since}
  else{var pc=a?Math.round((b-a)/a*100):0;t=pc?'сила '+(pc>0?'+':'−')+Math.abs(pc)+'%'+since:'сила ровно'+since}
  return '<div class="trend">'+trendSvg(v)+'<span style="color:'+(b>a?'var(--volt)':(b<a?'var(--org)':'var(--mu)'))+'">'+t+'</span></div>';
}
function renderHist(){
  var all=workoutsList(),w=null,i;
  for(i=0;i<all.length;i++)if(all[i].key===S.hist.key)w=all[i];
  if(!w){S.view='home';return render()}
  var st=wkStats(w),pw=null;for(i=0;i<all.length;i++)if(all[i].date<w.date&&all[i].name===w.name){pw=all[i];break}
  var ps=pw?wkStats(pw):null,s=w.sess||{},mins=wkMinutes(w),feel=(w.rows.filter(function(r){return r.feeling})[0]||{}).feeling,L=dayLetter(w.name);
  var h='<div class="screen"><div class="w-head"><div class="w-row"><button class="icon-btn" data-act="hist-back" aria-label="Назад">'+I.back+'</button><div class="w-title"><b>'+esc(w.name)+'</b><span>'+esc(fmtWd(w.date))+', '+esc(fmtDay(w.date))+'</span></div></div></div><div class="scroll" id="hist-scroll"><div class="pad">';
  // hero: the one number first, then context
  var dT=ps&&ps.ton&&st.ton?Math.round((st.ton-ps.ton)/ps.ton*100):null;
  h+='<div class="lux hx"><div class="ghost">'+esc(L)+'</div><div class="eyebrow hot">Тоннаж тренировки</div><div class="big">'+Math.round(st.ton).toLocaleString('ru-RU')+'<small>кг</small></div><div class="row">';
  if(dT!=null)h+='<span class="chip '+(Math.abs(dT)<3?'':(dT>0?'up':'down'))+'">'+(Math.abs(dT)<3?'= как прошлая '+L:(dT>0?'↑ +':'↓ −')+Math.abs(dT)+'% к прошлой '+L)+'</span>';
  if(st.prs)h+='<span class="chip heat">★ '+plural(st.prs,'рекорд','рекорда','рекордов')+'</span>';
  h+='</div><div class="tiles"><div class="tile"><b>'+st.sets+'</b><span>подходов</span></div><div class="tile"><b>'+(mins||'—')+'</b><span>минут</span></div><div class="tile"><b>'+(s.hr?Math.round(s.hr):'—')+'</b><span>пульс, ср.</span></div></div>'+(feel?'<div class="feelq">После: '+esc(feel)+'</div>':'')+'</div>';
  // verdict: how many exercises moved forward
  var c=st.count,n=st.list.length;
  h+='<div class="gap"></div><div class="glass"><div class="eyebrow">Против прошлого раза</div><div class="ctitle" style="margin-bottom:16px">'+(c.up?c.up+' из '+n+' упражнений в плюсе':'Без прогресса')+'</div><div class="mixrow">'+donut(mixSegs(c),124,14,'<b>'+c.up+'<small style="font-size:15px;color:var(--mu)">/'+n+'</small></b><span>в плюсе</span>')+'<div class="lg">'+['up','same','down','new'].filter(function(k){return c[k]}).map(function(k){return '<div><i style="background:'+COL[k]+'"></i>'+ST_LBL[k]+'<b>'+c[k]+'</b></div>'}).join('')+(st.prs?'<div><i style="background:var(--heat)"></i>Рекорды<b>'+st.prs+'</b></div>':'')+'</div></div></div>';
  // the coach's reasoning, folded
  var rv=aiGet('review',w.date,w.workout)||aiGet('review',w.date);
  if(rv)h+='<div class="glass ai"><div class="eyebrow hot">Разбор тренера</div><div style="margin-top:10px">'+aiFolded(rv)+'</div></div>';
  else if(S.lastDone&&S.lastDone.date===w.date&&aiOn())h+='<div id="ai-review">'+aiReviewHtml()+'</div>';
  // every exercise: today's sets as bars, last time as a dashed mark
  h+='<div class="sec"><h2>Упражнения</h2></div><div class="keyline"><span><i></i>объём подхода сегодня</span><span><i class="t"></i>прошлый раз</span></div>';
  st.list.forEach(function(x){
    h+='<div class="exc" style="--c:'+COL[x.st.k]+'"><div class="top"><div class="nm">'+esc(short(x.name))+'<div class="meta"><span class="chip '+(x.st.k==='same'?'':x.st.k)+'">'+ST_ARR[x.st.k]+' '+esc(x.st.t)+'</span>'+(x.pr?'<span class="chip heat">★ рекорд</span>':'')+'</div></div>'+trendHtml(x)+'</div>'+setBarsHtml(x)+(x.prev?'<div class="was">Прошлый раз, '+fmtShort(x.prev.date)+': '+esc(setsStr(x.prev.sets))+(x.counter?' (противовес)':'')+'</div>':'')+'</div>';
  });

  if(win.length>1){var mx=Math.max.apply(null,win.map(function(x){return wkStats(x).ton}))||1;
    h+='<div class="sec"><h2>Динамика</h2><span>тоннаж, тонн</span></div><div class="glass"><div class="vbars">'+win.map(function(x){var t=wkStats(x).ton;return '<button class="vb'+(x===w?' on':'')+'" data-act="hist-go" data-key="'+esc(x.key)+'"><em>'+fmtT(t)+'</em><i style="height:'+Math.max(6,Math.round(t/mx*112))+'px"></i><small>'+esc(dayLetter(x.name))+'<br>'+fmtShort(x.date)+'</small></button>'}).join('')+'</div></div>'}
  // recovery that morning against the norm of the days before

    var bs=function(k){var t=stat(base,k);return t&&t.n>=5?t:null};
    h+='<div class="sec"><h2>Восстановление</h2><span>утро тренировки</span></div><div class="glass"><div class="gauges">'+gauge('Сон',hr.sleep,'ч',1,bs('sleep'),true)+gauge('HRV',hr.hrv,'мс',0,bs('hrv'),true)+gauge('Пульс покоя',hr.rhr,'',0,bs('rhr'),false)+'</div><div class="note-s" style="margin-top:14px">Риска сверху — твоя норма за прошлые дни.</div></div>'}
  h+='<div style="height:32px"></div></div></div></div>';
  $('#app').innerHTML=h;
}

/* ================= week ================= */
function weekStart(iso){var wd=(dObj(iso).getDay()+6)%7;return isoAdd(iso,-wd)}

function exGroup(name){

/* ================= sync queue ================= */
function qKey(op,p){return op==='finishSession'?'finish|'+p.date+'|'+p.workout:p.date+'|'+p.workout+'|'+p.exercise+'|'+p.setNo}
function enqueue(op,p){
  var key=qKey(op,p);
  S.queue=S.queue.filter(function(it){return (S.inflight&&S.inflight.indexOf(it)>=0)||it.key!==key});
  S.queue.push({key:key,op:op,p:p,tries:0});
  saveQueue();renderSync();
  clearTimeout(S.flushT);S.flushT=setTimeout(flush,250); // one request for a burst of edits
}
function flushNow(){clearTimeout(S.flushT);flush()}
function flush(){
  if(S.inflight||!S.queue.length){if(!S.inflight)aiReviewMaybe();return renderSync()}
  var batch=S.queue.slice(0,40);S.inflight=batch;renderSync();
  google.script.run
    .withSuccessHandler(function(results){
      results=results||[];
      var doneItems=[];
      for(var i=0;i<batch.length;i++){
        var r=results[i];if(!r)break;
        if(r.ok===false&&r.error){S.syncErr=r.error;break}
        if(r.ok===false)toast(r.reason||'Таблица отклонила операцию','bad'); // permanent refusal (e.g. row not written by the form): do not retry forever
        doneItems.push(batch[i]);
        if(batch[i].op==='saveSet')mergeLog(batch[i].p);
        if(batch[i].op==='deleteSet')unmergeLog(batch[i].p);
      }
      S.inflight=null;
      S.queue=S.queue.filter(function(x){return doneItems.indexOf(x)<0});saveQueue();
      if(doneItems.length===batch.length){S.syncErr=null;renderSync();flush()}
      else{renderSync();toast('Таблица не приняла запись: '+(S.syncErr||''),'bad');clearTimeout(S.retryT);S.retryT=setTimeout(flush,15000)}
    })
    .withFailureHandler(function(err){
      S.inflight=null;batch.forEach(function(it){it.tries++});S.syncErr=(err&&err.message)||'Нет связи';saveQueue();renderSync();
      clearTimeout(S.retryT);S.retryT=setTimeout(flush,Math.min(30000,1500*Math.pow(2,batch[0].tries-1)));
    })
    .applyOps(batch.map(function(it){return {op:it.op,p:it.p}}));
}
function mergeLog(p){
  var L=S.boot.log||(S.boot.log=[]);
  var i=L.findIndex(function(r){return r.date===p.date&&r.workout===p.workout&&r.exercise===p.exercise&&r.setNo===p.setNo});
  var row={date:p.date,workout:p.workout,exercise:p.exercise,setNo:p.setNo,kg:num(p.kg),reps:num(p.reps),rir:num(p.rir),feeling:p.feeling||'',note:MARK+(p.note?'; '+p.note:'')};
  if(i>=0)L[i]=row;else L.push(row);
  S._wl=null;
}
function unmergeLog(p){S._wl=null;S.boot.log=(S.boot.log||[]).filter(function(r){return !(r.date===p.date&&r.workout===p.workout&&r.exercise===p.exercise&&r.setNo===p.setNo)})}
window.addEventListener('online',function(){clearTimeout(S.retryT);flushNow()});

function renderSync(){
  var html=syncPill();
  $$('.sync-host').forEach(function(h){h.innerHTML=html});
  var ds=$('#done-save');if(ds)ds.innerHTML=doneSaveState();
}
function syncPill(){
  var n=S.queue.length;
  if(!n)return '<span class="sync"><i></i>Сохранено</span>';
  if(S.syncErr&&!S.inflight)return '<span class="sync off"><i></i>Ждёт сети · '+n+'</span>';
  return '<span class="sync saving"><i></i>Сохраняю</span>';
}

/* ================= session ops ================= */
function newSession(day,date,opts){
  opts=opts||{};
  S.session={id:Date.now().toString(36),date:date,day:day,workout:opts.workout||workoutName(day),startedAt:opts.at||Date.now(),energy:'',
    plan:JSON.parse(JSON.stringify(S.boot.program.days[day]||[])),sets:{},rir:{},notes:{},extra:{},rest:null,page:0,backfill:date!==todayISO(),watchMin:opts.watchMin||null,wu:{}};
  if(!S.session.backfill&&!opts.noWarmup)S.session.wup={st:'open',items:{},at:Date.now(),min:null};
  if(opts.coach&&!S.session.backfill){S.session.coach=opts.coach;if(opts.aiPlan)S.session.aiPlan=JSON.parse(JSON.stringify(opts.aiPlan));S.session.energy=CI_ENERGY[opts.coach.feel]||'';if(opts.coach.mode==='light'||opts.coach.mode==='deload')cutPlan(opts.coach.mode)}
  prefill();
  saveSession();
}
/* light day: one set fewer where the plan has 3+ sets (never below what is already done) */
function cutPlan(kind){ // kind: 'light' | 'deload' | anything else restores the full plan
  var s=S.session,c=s.coach;c.cut=c.cut||{};
  var done={};exList().forEach(function(ex){done[ex.name]=doneSets(ex).length});
  s.plan.forEach(function(it){
    var had=+c.cut[it.order]||0;if(had){it.sets+=had;delete c.cut[it.order]}
    var want=kind==='light'?(it.sets>=3?1:0):kind==='deload'?Math.floor(it.sets/2):0;
    want=Math.min(want,Math.max(0,it.sets-(done[it.name]||0)));
    if(want){it.sets-=want;c.cut[it.order]=want}
  });
  delete dayCache['s:'+s.id];
}
/* pre-fill planned sets: the coach's target for today (or, when entering a past workout, last time's numbers).
   Only fields the user has not typed into are touched (a_* flags). */
function prefill(){
  var s=S.session,mode=s.coach&&!s.backfill?s.coach.mode:null;
  exList().forEach(function(ex){
    var prev=prevSession(ex,s.date);if(!prev||!prev.sets.length)return;
    var tg=mode?target(ex,prev,mode).sets:null;
    for(var n=1;n<=ex.sets;n++){
      var o=setObj(ex,n);if(o.done)continue;
      var p=tg?tg[n-1]:(function(q){var lr=ex.unilateral?parseLR(q.note):null;return {kg:q.kg,reps:q.reps,left:lr?lr[0]:q.reps,right:lr?lr[1]:q.reps}})(prev.sets[n-1]||prev.sets[prev.sets.length-1]);
      if(!p)continue;
      putAuto(o,'kg',p.kg);
      if(ex.unilateral){putAuto(o,'left',p.left);putAuto(o,'right',p.right)}else putAuto(o,'reps',p.reps);
    }
  });
}
function putAuto(o,f,v){if(v==null||v==='')return;if(o[f]==null||o[f]===''||o['a_'+f]){o[f]=str(v);o['a_'+f]=1}}
function setMode(m){
  var s=S.session;if(!s||!s.coach||s.coach.mode===m)return;
  s.coach.mode=m;s.coach.manual=1;cutPlan(m);prefill();saveSession();renderWorkout();
  toast(m==='light'?'Лёгкий день: цели пересчитаны':m==='deload'?'Разгрузка: подходов вдвое меньше':'Обычный день: цели с прогрессией','volt');
}
function exList(){var s=S.session;return s.plan?buildDay(s.day,s.plan,'s:'+s.id):buildDay(s.day)} // a running workout keeps the program it started with
function setCount(ex){return ex.sets+(S.session.extra[ex.id]||0)}
function setObj(ex,n){var k=ex.id+'#'+n;return S.session.sets[k]||(S.session.sets[k]={})}
function doneSets(ex){var a=[];for(var n=1;n<=setCount(ex);n++){var s=S.session.sets[ex.id+'#'+n];if(s&&s.done)a.push(n)}return a}
function firstOpen(ex){for(var n=1;n<=setCount(ex);n++){if(!setObj(ex,n).done)return n}return 0}
function repsOf(ex,o){return ex.unilateral?Math.min(num(o.left)||0,num(o.right)||0):num(o.reps)}
function totals(){

  var sum=function(end){var s=0;for(var i=0;i<7;i++)s+=byDay[isoAdd(end,-i)]||0;return s};
  var full=function(end){return isoAdd(end,-6)>=first},pts=[];

/* Sleep detail per night (date = the morning): «Сон» rows from the sheet, replaced by the app's fresher copy

   segs: [[from, to, stage]] in minutes from bedtime, stage d deep, c core, r REM, a awake. */
var SLEEP_ST={d:['Глубокий','#7B5CFF'],c:['Базовый','#4C7DFF'],r:['REM','#8FD3FF'],a:['Бодрствование','#FF8A5B']};

  var n=function(v,lo,hi){return typeof v==='number'&&isFinite(v)&&v>=lo&&v<=hi?v:null},t=function(v){return typeof v==='string'&&/^\d{1,2}:\d{2}$/.test(v)?v:null};
  var y={date:x.date,bed:t(x.bed),wake:t(x.wake),asleep:n(x.asleep,0,16),deep:n(x.deep,0,900),rem:n(x.rem,0,900),core:n(x.core,0,900),awake:n(x.awake,0,900),
    wakes:n(x.wakes,0,99),resp:n(x.resp,4,40),spo2:n(x.spo2,70,100),temp:n(x.temp,30,42),dist:n(x.dist,0,100),hrv:n(x.hrv,1,300),hr:n(x.hr,25,150)};
  if(Array.isArray(x.segs))y.segs=x.segs.filter(function(q){return Array.isArray(q)&&q[1]>q[0]&&SLEEP_ST[q[2]]}).slice(0,400);
  return y.asleep==null?null:y;
}
function sleepNightsAll(){
  var by={};((S.boot&&S.boot.sleep)||[]).forEach(function(x){by[x.date]=x});(S.sn||[]).forEach(function(x){by[x.date]=x});
  return Object.keys(by).sort().map(function(d){return by[d]});
}
/* minutes from the evening's midnight: 23:40 → 1420, 00:50 → 1490 (times before 15:00 belong to the morning) */

  h+='<div class="wt-main"><div class="wt-v">'+unitsSmall(fmtHM(x.asleep))+'<small>сна</small></div>'+

/* Wake-up goal: the median weekday wake-up (Monday to Friday mornings) of the last 28 nights, to 5 minutes; bedtime by it =
   the goal minus the sleep goal minus 15 minutes to fall asleep, rounded down to 5 minutes. Needs 5 weekday mornings. */
function wakeTarget(rec){

  var g=S.boot&&S.boot.sleepGoal;
  if(g&&clockMin(g.wake)!=null&&clockMin(g.bed)!=null)return {wake:clockMin(g.wake),bed:clockMin(g.bed),final:clockMin(g.final),ladder:true};
  var t=todayISO(),W=sleepNightsAll().filter(function(x){var g=dObj(x.date).getDay();return x.date>isoAdd(t,-28)&&x.date<=t&&g>=1&&g<=5&&clockMin(x.wake)!=null})
    .map(function(x){return clockMin(x.wake)}).sort(function(a,b){return a-b});

  return {wake:wake,bed:Math.floor((wake-need*60-15)/5)*5};

  var s=G[0],hv=null;for(var g=3;g>=1&&!hv;g--)if(G[g].length>=3)hv=g;
  var on=D.filter(function(x){return x.on&&x.score!=null}).length;
  if(s.length<3||!hv)return '<div class="alc-big">Пока собираю утра</div><div class="alc-sub">Сравнение появится, когда наберётся хотя бы 3 утра после трезвого вечера и 3 после одного и того же количества алкоголя. Сейчас: '+plural(s.length,'утро','утра','утр')+' после трезвых, '+plural(on,'утро','утра','утр')+' после алкоголя.</div>';
  var base=alcMean(s,'score'),mu=alcMean(G[hv],'score'),de=base-mu,w='«'+ALC_WORD[hv]+'»',n=D.filter(function(x){return x.score!=null&&x.g>=0}).length;
  var seq=[base];for(var k=1;k<=3;k++)if(G[k].length>=3)seq.push(alcMean(G[k],'score'));
  var down=seq.length>=3&&seq.every(function(v,i){return !i||v<seq[i-1]});
  var big=de>=0.5?(down?'Чем больше выпил, тем хуже утро':'После '+w+' утро хуже')+': <em>−'+alcF1(de)+'</em> к оценке дня'
    :de<=-0.5?'После '+w+' утро даже лучше: +'+alcF1(-de)+' к оценке дня':'После '+w+' утро почти как после трезвого вечера';
  return '<div class="alc-big">'+big+'</div><div class="alc-sub">После '+w+' утро в среднем на '+alcF1(mu)+' из 10, после трезвого вечера — на '+alcF1(base)+'. По '+plural(n,'отмеченному вечеру','отмеченным вечерам','отмеченным вечерам')+'.</div>';
}
function alcLadderHtml(G,unk){

  var base=G[0].length>=3?alcMean(G[0],'score'):null,h='',rows=G.map(function(l,g){return [l,g,ALC_GRP[g]]});
  if(unk.length)rows.push([unk,2,'Не указано']);
  rows.forEach(function(r,k){
    var l=r[0],ok=l.length>=3,mu=l.length?alcMean(l,'score'):null,c=mu!=null?alcScoreCol(mu):'';
    h+='<div class="alc-row'+(l.length&&!ok?' thin':'')+'"><span class="gl"'+(k>3?' style="opacity:.5"':'')+'>'+alcGlass(r[1])+'</span><span class="nm">'+r[2]+'<small>'+(l.length?plural(l.length,'утро','утра','утр')+(ok?'':' · мало'):'нет утр')+'</small></span>'+
      '<span class="tr">'+(mu!=null?'<i class="fl" style="width:'+(mu*10).toFixed(1)+'%;--c:'+c+';--g:'+c+'66"></i>':'')+(k&&base!=null?'<i class="ref" style="left:'+(base*10).toFixed(1)+'%"></i>':'')+'</span>'+
      (mu!=null?'<b style="--c:'+c+'">'+alcF1(mu)+'</b>':'<b class="few">—</b>')+'</div>';
  });

/* New or changed Health weighings go to «Тело» once per page; weights typed into the sheet are never replaced. */
var hwSent='';
function weightsSync(){
  if(!S.hw||!S.boot)return;
  var have={};(S.boot.body||[]).forEach(function(x){have[x.date]=x});
  var todo=S.hw.filter(function(x){var b=have[x.date];return !b||(b.hk&&b.kg!==x.kg)||(b.kg==null)}).slice(-400);
  var sig=JSON.stringify(todo);if(!todo.length||sig===hwSent)return;hwSent=sig;
  google.script.run.withSuccessHandler(function(){
    var body=S.boot.body=(S.boot.body||[]).slice();
    todo.forEach(function(x){var b=have[x.date];if(!b)body.push({date:x.date,kg:x.kg,waist:null,hk:true});else if(b.hk||b.kg==null){b.kg=x.kg;b.hk=true}});
    body.sort(function(a,c){return a.date<c.date?-1:1});lsSet(LS.boot,S.boot);
  }).withFailureHandler(function(){hwSent=''}).saveWeights(todo);
}
/* Health's daily steps go to «Шаги» once per page, only new or changed days; the coach and the tasks read them there. */
var hsSent='';
function stepsSync(){
  if(!S.hs||!S.boot)return;
  var have=S.boot.steps||{},todo=S.hs.filter(function(x){return have[x.date]!==x.steps});
  var sig=JSON.stringify(todo);if(!todo.length||sig===hsSent)return;hsSent=sig;
  google.script.run.withSuccessHandler(function(){
    var st=S.boot.steps=Object.assign({},S.boot.steps||{});
    todo.forEach(function(x){st[x.date]=x.steps});
    (S.boot.health||[]).forEach(function(r){if(st[r.date]!=null)r.steps=st[r.date]});
    lsSet(LS.boot,S.boot);tkRefresh();
  }).withFailureHandler(function(){hsSent=''}).saveSteps(todo);
}
/* Health's nights go to «Сон» once per page, only new or changed ones (the timeline stays in the phone). */
var snSent='';
function sleepSync(){
  if(!S.sn||!S.boot)return;
  var key=function(x){return [x.bed,x.wake,x.asleep,x.deep,x.rem,x.core,x.awake,x.wakes,x.resp,x.spo2,x.temp,x.dist,x.hrv,x.hr].join('|')};
  var have={};(S.boot.sleep||[]).forEach(function(x){have[x.date]=key(x)});
  var todo=S.sn.filter(function(x){return have[x.date]!==key(x)}).map(function(x){var y=Object.assign({},x);delete y.segs;return y});
  var sig=JSON.stringify(todo);if(!todo.length||sig===snSent)return;snSent=sig;
  google.script.run.withSuccessHandler(function(){
    var by={};(S.boot.sleep||[]).forEach(function(x){by[x.date]=x});todo.forEach(function(x){by[x.date]=x});

function metric(l,v,unit,cur,avg,higherBetter,dec){

  if(cur!=null&&avg){var diff=cur-avg,pct=Math.abs(diff)/avg;var cls=pct<0.04?'flat':((diff>0)===higherBetter?'up':'down');
    d='<div class="d '+cls+'">'+(pct<0.04?'как обычно':(diff>0?'+':'−')+fmtN(Math.round(Math.abs(diff)*Math.pow(10,dec))/Math.pow(10,dec))+' к норме')+'</div>'}
  return '<div class="metric"><div class="v">'+v+(unit?'<small>'+unit+'</small>':'')+'</div><div class="l">'+l+'</div>'+d+'</div>';
}

/* the day's mode for a feeling: the coach's plan decides when there is one (never «strong» when you feel broken),
   otherwise the rules; a bad morning mood takes away the strong day */
function ciPick(feel,rec,ai,wb){
  function pick0(){
    if(ai&&feel&&ai.by_feel[feel]){var f=ai.by_feel[feel],m=f.mode;if(feel==='bad'&&m==='push')m='light';if(['normal','push','light'].indexOf(m)<0)m='normal';
      if(rec&&rec.ill&&m!=='light'){if(feel!=='great')return {mode:'light',why:[ILL_WHY]};if(m==='push')return {mode:'normal',why:['много сил, но пульс и HRV похожи на начало болезни — без форсирования']}}
      return {mode:m,why:f.why?[f.why]:[],ai:1}}
    return decideMode(feel,rec);
  }
  if(deloadWeek(todayISO()))return {mode:'deload',why:[DELOAD_WHY]};
  var m=pick0();
  if(wb&&wb.mood<=2&&m.mode==='push')return {mode:'normal',why:['утром настроение на нуле — по плану, без рекордов']};

}

function toggleSet(exId,n){
  var ex=exById(exId),o=setObj(ex,n),row=$('.set-row[data-ex="'+exId+'"][data-n="'+n+'"]');

    o.done=false;saveSession();

    enqueue('deleteSet',{date:S.session.date,workout:S.session.workout,exercise:ex.name,setNo:n});
    var nl=doneSets(ex).slice(-1)[0];if(nl&&nl<n&&S.session.rir[ex.id]!=null)enqueue('saveSet',payloadFor(ex,nl));
    rerenderEx(exId);return;
  }
  var okKg=num(o.kg)!=null,okR=ex.unilateral?(num(o.left)!=null&&num(o.right)!=null):num(o.reps)!=null;
  if(!okKg||!okR){
    if(row){row.classList.remove('shake');void row.offsetWidth;row.classList.add('shake');var first=$$('.num',row).filter(function(i){return !i.value})[0];if(first)first.focus()}
    toast(!okKg?'Введи вес (0 — если без веса)':'Введи число повторов');return;
  }

  if(wuOpen())wuFinish(Object.keys(S.session.wup.items).length?'done':'skip',true); // a set ticked (maybe from the watch): the warm-up is over

  enqueue('saveSet',payloadFor(ex,n));

  if(best>0&&e1rm(num(o.kg),repsOf(ex,o))>best)toast('Новый рекорд: '+short(ex.name),'volt');

  if(!nx){ // the last working set of the day: no rest, straight to saving

    setTimeout(function(){if(S.session&&!nextTarget(ex))goTo(exList().length)},420);

  var lbl=nx.ex.id!==ex.id&&nx.n===1&&wuNext(nx.ex)?'Дальше: разминочный · '+short(nx.ex.name):nx.label;
  if(!S.session.backfill){startRest(restFor(ex),lbl);S.session.rest.src=exId+'#'+n;saveSession()}
  if(nx&&nx.ex.id!==ex.id&&remaining)setTimeout(function(){goToEx(nx.ex.id)},380); // back to the first exercise of the superset

/* ================= swapping a machine =================
   The set rows go to the sheet under the machine actually used, with «вместо «planned»» in the note, so each machine
   keeps its own history, records and targets; weights from one machine are never compared with another's.
   Sets already ticked move to the new name; open sets drop the old machine's numbers. */
/* Offered in this order: back to the plan; each part of an «… или …» name; the other exercises of the planned one's
   «Движение» in «Замены» (same movement, other equipment); machines swapped in before for this slot. Without a movement
   in «Замены», exercises of the catalog with the same main muscle group (whole name, not its first word: «Задняя
   поверхность бедра» is not «Задняя дельта»). Never an exercise already in today's workout. */
function swapKey(n){return String(n||'').replace(/\s+/g,' ').trim().toLowerCase()}
function swapNames(n){var a=[n,short(n)];String(n||'').split(/ или /i).forEach(function(x){x=capz(x.trim());a.push(x,short(x))});return a.map(swapKey)}
function swapGroup(g){return swapKey(String(g||'').split(',')[0].replace(/\(.*?\)/g,''))}
function swapOptions(ex){
  var orig=ex.was||ex.name,seen={},out=[],sw=S.boot.swaps||[];
  var add=function(n){n=String(n||'').replace(/\s+/g,' ').trim();if(!n||seen[swapKey(n)])return;seen[swapKey(n)]=1;out.push(n)};
  seen[swapKey(ex.name)]=1;
  if(ex.was)add(ex.was);
  orig.split(/ или /i).forEach(function(x,i,a){if(a.length>1)add(capz(x.replace(/\s*\(.*?(при необходимости).*?\)/i,'')))});
  var mine=swapNames(orig),moves={};
  sw.forEach(function(r){if(mine.indexOf(swapKey(r.name))>=0||mine.indexOf(swapKey(short(r.name)))>=0)moves[r.move]=1});
  sw.forEach(function(r){if(moves[r.move]&&!/ или /i.test(r.name))add(r.name)});
  if(!Object.keys(moves).length){var g=swapGroup(ex.group);
    (S.boot.catalog||[]).forEach(function(c){if(g&&swapGroup(c.group)===g&&!/ или /i.test(c.name))add(c.name)})}
  // machines swapped in before for this slot
  (S.boot.log||[]).forEach(function(r){if(wasOf(r.note)===orig)add(r.exercise)});
  var today={};((S.session&&S.session.plan)||[]).forEach(function(x){if(x.name!==ex.name)today[swapKey(x.name)]=1});
  // «Жим ногами» from «… или жим ногами» is dropped when a precise «Жим ногами сидя (…)» is listed
  return out.filter(function(n){var l=n.toLowerCase();return (n===ex.was||!today[swapKey(n)])&&!out.some(function(m){return m!==n&&m.toLowerCase().indexOf(l+' ')===0})});
}
function swapEquip(n){var k=swapKey(n),r=(S.boot.swaps||[]).filter(function(x){return swapKey(x.name)===k})[0];return r?r.equipment:''}
function openSwap(exId){
  var ex=exById(exId);if(!ex)return;S.swapFor=exId;
  var opts=swapOptions(ex);
  openSheet('<h3>Чем заменить?</h3><p class="sub">'+(ex.was?'Сейчас «'+esc(short(ex.name))+'» вместо «'+esc(short(ex.was))+'».':'По плану «'+esc(short(ex.name))+'».')+' У каждого тренажёра своя история и свои цели.</p>'+
    (opts.length?'<div class="swap-l">'+opts.map(function(n){var back=n===ex.was,eq=swapEquip(n);return '<button class="choice" data-act="swap-pick" data-name="'+esc(n)+'">'+esc(n)+(back?'<small>вернуть по плану</small>':eq?'<small>'+esc(eq)+'</small>':'')+'</button>'}).join('')+'</div>':'<p class="sub">Похожих упражнений в листе «Замены» нет — впиши тренажёр ниже или добавь строку в лист.</p>')+
    '<div class="sub">Другой тренажёр</div><div class="swap-own"><input id="swap-in" maxlength="80" placeholder="Например: кроссовер" enterkeyhint="done"><button class="btn2 volt" data-act="swap-own">Готово</button></div>');
}
function swapEx(exId,name){
  var s=S.session,ex=exId&&exById(exId);if(!s||!ex||!name||name===ex.name)return;
  var it=s.plan.filter(function(x){return s.day+x.order===exId})[0];if(!it)return;

/* ================= Workout Bridge app (iOS) =================
   Active only inside the native app (WKWebView with a "wb" message handler); in a browser NB is null and
   nothing here runs. Reports the running workout so the app can drive the lock-screen Live Activity and the
   rest-end alarm, and applies taps made there (mark a set, skip rest, +15 s) through the form's own functions. */
function nbPost(m){if(!NB)return;try{NB.postMessage(m)}catch(e){}}
function nbSet(ex,n){return S.session.sets[ex.id+'#'+n]||{}} // read-only: never creates set objects
function nbFilled(ex,o){return num(o.kg)!=null&&(ex.unilateral?num(o.left)!=null&&num(o.right)!=null:num(o.reps)!=null)}
function nbTarget(ex,o){
  var reps=ex.unilateral?(o.left&&o.right?o.left+'/'+o.right:''):(o.reps||''),kg=num(o.kg);
  if(kg==null&&!reps)return '';
  var w=kg==null?'':kg===0?'без веса':String(o.kg).replace('.',',')+' кг';
  return w&&reps?w+' × '+reps:w||'× '+reps;
}
/* the order the form walks through sets: the same rules as toggleSet()/nextTarget() */
function nbQueue(){
  var s=S.session,exs=exList(),vd={},out=[];
  function isDone(ex,n){return vd[ex.id+'#'+n]||nbSet(ex,n).done}
  function firstUndone(ex,lim){for(var n=1;n<=lim;n++)if(!isDone(ex,n))return n;return 0}
  function anyUndone(){for(var i=0;i<exs.length;i++){var q=firstUndone(exs[i],exs[i].sets);if(q)return {ex:exs[i],n:q}}return null}
  function nextAfter(ex){
    var p=ssNext(ex);if(p){var pn=firstUndone(p,setCount(p));if(pn)return {ex:p,n:pn}}
    var m=mates(ex);if(m){var k=firstUndone(m[0],m[0].sets);if(k)return {ex:m[0],n:k}}
    var j=firstUndone(ex,setCount(ex));if(j)return {ex:ex,n:j};
    return anyUndone();
  }
  var cur=null,pg=exs[s.page],wq={};
  // the warm-up screen comes first: one step the watch can close with «Разминка сделана»
  if(wuOpen())out.push({exId:'__wup',n:1,warm:true,name:'Разминка',target:'',canMark:true,setsTotal:1,rest:0});
  if(pg){var n0=firstUndone(pg,setCount(pg));if(n0)cur={ex:pg,n:n0}}
  if(!cur)cur=anyUndone();
  while(cur&&out.length<30){
    // open warm-up sets come before an exercise's first working set
    if(!wq[cur.ex.id]){wq[cur.ex.id]=1;if(!doneSets(cur.ex).length)nbWarm(cur.ex).forEach(function(w){if(out.length<30)out.push(w)})}
    if(out.length>=30)break;
    var o=nbSet(cur.ex,cur.n);
    out.push({exId:cur.ex.id,n:cur.n,name:short(cur.ex.name),target:nbTarget(cur.ex,o),canMark:nbFilled(cur.ex,o),
      setsTotal:setCount(cur.ex),rest:ssNext(cur.ex)?0:restFor(cur.ex)});
    vd[cur.ex.id+'#'+cur.n]=1;cur=nextAfter(cur.ex);
  }
  return out;
}
/* open warm-up sets of an exercise, read-only (never creates entries in S.session.wu) */
function nbWarm(ex){
  var s=S.session,c=wuCount(ex),e=s.wu&&s.wu[ex.id],out=[];
  for(var k=1;k<=c;k++){
    var o=(e&&e.s[k])||{};if(o.done)continue;
    var sg=wuSuggest(ex,k,c),kg=o.t_kg?(o.kg||''):sg.kg,reps=o.t_reps?(o.reps||''):sg.reps;
    out.push({exId:ex.id,n:k,warm:true,name:short(ex.name),target:nbTarget({},{kg:kg,reps:reps}),canMark:num(kg)!=null&&num(reps)!=null,setsTotal:setCount(ex),rest:60});
  }
  return out;
}

function nbRun(a){
  var s=S.session;if(!s)throw new Error('тренировка уже закрыта');
  if(a.sid!==s.startedAt)throw new Error('отметка из другой тренировки — пропущена');
  if(a.type==='done'&&a.exId==='__wup'){if(wuOpen())wuFinish('done',false,a.at);return} // «Разминка сделана» on the watch
  if(a.type==='done'&&a.warm){ // a warm-up set marked on the lock screen or the watch

    var wi=exList().findIndex(function(x){return x.id===a.exId});
    if(wi>=0&&s.page!==wi){s.page=wi;goTo(wi,false)}
    if(S.view!=='workout'){S.view='workout';render()}
    toggleWarm(a.exId,a.n);
    ow=s.wu&&s.wu[a.exId]&&s.wu[a.exId].s[a.n];
    if(!ow||!ow.done)throw new Error(short(exw.name)+', разминочный: не отмечен — нет веса или повторов');
    ow.doneAt=a.at;
    if(s.rest&&s.rest.src==='w:'+a.exId+'#'+a.n)s.rest.endAt=a.at+s.rest.total*1000;
    saveSession();
  }else if(a.type==='done'){
    var ex=exById(a.exId);if(!ex)throw new Error('упражнение не найдено');
    var key=a.exId+'#'+a.n,o=s.sets[key];
    if(o&&o.done)return;
    if(S.view!=='workout'){S.view='workout';render()}
    toggleSet(a.exId,a.n);
    o=s.sets[key];
    if(!o||!o.done)throw new Error(short(ex.name)+', подход '+a.n+': не отмечен — нет веса или повторов');
    o.doneAt=a.at;
    if(s.rest&&s.rest.src===key)s.rest.endAt=a.at+s.rest.total*1000; // the rest began at the tap, not when the app opened
    saveSession();
    // toggleSet moves on to the next exercise after an animation; do it now so the next snapshot names the right set
    var partner=ssNext(ex),remaining=doneSets(ex).length<ex.sets,nx=partner?null:nextTarget(ex);
    if(remaining&&(partner||(nx&&nx.ex.id!==ex.id))){
      var to=partner?partner.id:nx.ex.id,i=exList().findIndex(function(x){return x.id===to});
      if(i>=0){goTo(i,false);s.page=i} // instant jump, and the page is set even if the pager is not laid out yet
    }
  }else if(a.type==='skip'){if(s.rest)stopRest()}
  else if(a.type==='add'){var r=s.rest;if(r){r.endAt+=(a.sec||15)*1000;r.total=Math.max(15,r.total+(a.sec||15))}} // timer redrawn after the batch
  // «Сохранить» / «Удалить» on the watch: the same as the buttons here, with the feeling chosen on the watch
  else if(a.type==='finish'){
    if(FEELINGS.some(function(f){return f.v===a.feeling}))s.feeling=a.feeling;
    saveFinish(a.at); // the phone may get it much later: the workout ended at the tap
    if(S.session)throw new Error('Тренировка с часов не сохранилась — сохрани её в форме');
  }
  else if(a.type==='cancel')cancelSession();
}
var nbMem=[]; // applied in this page's life, even if storing the list failed
var nbBoot=nbApplied(); // read from storage when the page loaded: these taps are known to be on disk
var NB=window.webkit&&window.webkit.messageHandlers&&window.webkit.messageHandlers.wb||null;
// A light tap on every button press, inside the app only (Safari gives a page no haptics).
if(NB)document.addEventListener('click',function(e){var t=e.target;if(t&&t.closest&&t.closest('button,[role="button"],.choice,label,input[type="checkbox"],input[type="radio"]'))nbPost({type:'haptic',kind:'tap'})},true);
if(NB)document.documentElement.classList.add('in-app');
if(NB){
  window.wbNative={
    apply:function(actions){
      var done=nbApplied(),ids=[],known=[],errors=[];
      (actions||[]).forEach(function(a){
        if(!a||!a.id)return;
        // Already on disk when this page loaded: the app may forget it. Anything newer is only "applied":
        // WebKit writes storage a moment later, so the app keeps it and offers it again to the next page.
        if(nbBoot.indexOf(a.id)>=0){known.push(a.id);return}
        if(done.indexOf(a.id)<0&&nbMem.indexOf(a.id)<0){try{nbRun(a)}catch(e){errors.push(String(e&&e.message||e))}nbMem.push(a.id)}
        if(done.indexOf(a.id)<0)done.push(a.id);
        ids.push(a.id);
      });
      runRest(); // once, after the whole batch: a +15 later in the batch may still extend a rest that looks over
      // Ack only what is safely stored; otherwise the app keeps the taps and offers them again.
      var stored=(!S.session||lsSet(LS.session,S.session))&&lsSet(LS.queue,S.queue)&&lsSet('wf1.nbApplied',done.slice(-300));
      if(!stored){nbPost({type:'ack',ids:[],known:known,errors:['Память телефона переполнена — отметки с экрана блокировки пока не сохранены']});return}
      nbPost({type:'ack',ids:ids,known:known,errors:errors});nbTick(true);
    },
    post:function(force){nbTick(!!force)},
    // «Начать» on the watch: the same start as the check-in's button, with the feeling chosen on the watch.
    // The answer «begun» says why nothing started; a start is made once (its id joins the applied list).
    start:function(a){
      var res={type:'begun',id:a&&a.id,ok:false};
      try{
        if(!a||!a.id){res.error='bad';return}
        var done=nbApplied();
        if(done.indexOf(a.id)>=0||nbMem.indexOf(a.id)>=0){res.error='known';return}
        if(!S.boot||!S.boot.program){res.error='later';return} // nothing loaded yet: the app offers it again
        if(S.session){res.error='busy'}
        else if(!(a.at>0)||Date.now()-a.at>2*3600e3||a.at-Date.now()>600e3){res.error='old'}
        else{
          // always the form's own next workout: the watch may still show one saved since, and starting that
          // again would write over its rows
          var day=S.day||nextDay(),feel=FEEL_ORDER.indexOf(a.feel)>=0?a.feel:'';
          S.day=day;ciStart(day,feel,Math.round(a.at));
          if($('#ci-go'))closeSheet(); // the check-in was open here: the watch answered it
          S.tab='train';S.view='workout';render();keepAwake();res.ok=true;
        }
        nbMem.push(a.id);done.push(a.id);lsSet('wf1.nbApplied',done.slice(-300));
      }catch(e){res.error=String(e&&e.message||e)}
      finally{nbPost(res);nbTick(true)}
    },
    // the 10:00 reminder was tapped: show «Сегодня» with the check-in, unless a workout is on screen
    wellbeing:function(){if(S.view==='workout'&&S.session)return;S.tab='today';S.view='home';render();var c=$('#wb-card');if(c&&c.scrollIntoView)c.scrollIntoView({behavior:'smooth',block:'center'})},
    recovery:function(x){
      if(!x||x.date!==todayISO())return;
      var num=function(v,lo,hi){return typeof v==='number'&&v>=lo&&v<=hi?v:null};
      S.hn={date:x.date,sleep:num(x.sleep,0,16),hrv:num(x.hrv,1,300),rhr:num(x.rhr,25,150),steps:num(x.steps,0,150000),at:Date.now()};lsSet('wf1.hn',S.hn);
      if(S.view==='home')render();
      if(S.boot)setTimeout(aiEnsure,0); // fresh sleep may change the morning advice
    },
    weights:function(list){
      if(!Array.isArray(list))return;
      S.hw=list.filter(function(x){return x&&/^\d{4}-\d{2}-\d{2}$/.test(x.date)&&x.kg>0}).slice(-400);lsSet('wf1.hw',S.hw);
      var wc=S.view==='home'&&$('#wt-card');if(wc)wc.innerHTML=weightCardHtml();
      var tl=S.view==='home'&&$('#tiles');if(tl)tl.innerHTML=todayTilesHtml();
      weightsSync();
    },
    // each whole day's steps as Health shows them: «Apple Health» has iPhone and Watch added together
    steps:function(list){
      if(!Array.isArray(list))return;
      S.hs=list.filter(function(x){return x&&/^\d{4}-\d{2}-\d{2}$/.test(x.date)&&x.date<todayISO()&&typeof x.steps==='number'&&x.steps>=0&&x.steps<=150000}).slice(-400);
      stepsSync();
    },
    // the last nights from Health with stages; the newest may carry its stage timeline (segs)
    sleep:function(list){
      if(!Array.isArray(list))return;
      S.sn=list.map(sleepClean).filter(Boolean).slice(-90);lsSet('wf1.sn',S.sn);
      if(S.view==='home'&&S.tab==='sleep')render();
      sleepSync();
    }
  };
  nbPost({type:'ready'});
  setInterval(nbTick,700);
  document.addEventListener('visibilitychange',function(){nbTick(true)}); // also on hide: the app must know before WebKit pauses the page
  window.addEventListener('pagehide',function(){nbTick(true)});
}

if(S.lastDone&&S.queue.length)S.view='done';
else if(S.session)S.view='workout';
/* Saved data from the last visit would be drawn first and then redrawn when fresh data arrives a second later,
   so the screen jumps. The home screen waits for fresh data instead; without network it shows the saved data
   after a moment. A running workout opens at once: it does not depend on fresh data. */
var bootHold=0;
function releaseHold(){if(!bootHold)return;clearTimeout(bootHold);bootHold=0;render()}
if(S.boot){if(S.view==='home')bootHold=setTimeout(releaseHold,2500);else render();if(S.session&&S.session.rest)runRest()}
load();flush();
})();
</script>
