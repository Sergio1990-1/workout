<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Тренировка">
<meta name="theme-color" content="#0B0B0C">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<title>Тренировка</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=Unbounded:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0B0C; --s1:#161618; --s2:#1F1F22; --s3:#2B2B2F; --line:rgba(255,255,255,.08);
  --tx:#F4F4F5; --tx2:#D4D4D8; --mu:#A1A1AA; --mu2:#71717A;
  --volt:#D4FF3A; --ink:#0B0B0C; --volt-dim:rgba(212,255,58,.13);
  --warn:#FFB35C; --bad:#FF5A5F; --blue:#8AB4FF;
  --f:'Onest',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --pad:20px; --sb:max(calc(env(safe-area-inset-bottom) - 10px),12px); /* buttons sit just above the home indicator */ --st:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;height:100dvh;height:var(--app-h,100dvh);margin:0;overflow:hidden;background:var(--bg);color:var(--tx);font-family:var(--f);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button:disabled{opacity:.35}
input,textarea{font:inherit;color:inherit}
/* normal digit widths everywhere: equal-width digits leave a gap around every «1» */
html,body,input,textarea,button{font-variant-numeric:proportional-nums}
svg{display:block}
.hide{display:none!important}
.tnum{font-variant-numeric:proportional-nums}
#app{height:100%;padding-top:var(--st)}
.screen{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;position:relative}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scrollbar-width:none}
.tasks{margin-top:12px}
.tk-sum{font-size:13px;font-weight:700;color:var(--mu)}
.tk-sum.all{color:var(--volt)}
.tk-list{display:flex;flex-direction:column;margin-top:8px}
.tk{display:flex;align-items:center;gap:14px;width:100%;padding:11px 0;border:0;border-top:1px solid var(--line);background:none;color:inherit;font:inherit;text-align:left}
.tk:first-child{border-top:0}
.tk-ic{flex:none;width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.tk-ic svg{width:32px;height:32px;display:block}
.tk-ic.ok{background:var(--volt);color:#0B0B0C;box-shadow:0 0 16px rgba(212,255,58,.45)}
.tk-ic.fail{background:var(--org-dim);color:var(--org)}
.tk-ic.ok svg,.tk-ic.fail svg{width:16px;height:16px}
.tk-t{display:flex;flex-direction:column;min-width:0}
.tk-t b{font-size:15px;font-weight:600;color:var(--tx);line-height:1.3}
.tk.ok .tk-t b{color:var(--tx2)}
.tk-t span{font-size:13px;color:var(--mu2);margin-top:2px}
.tk.fail .tk-t span{color:var(--org)}
.tk-all{margin-top:6px;font-size:13px;font-weight:600;color:var(--volt)}
.tk-y{margin-top:10px;padding-top:12px;border-top:1px solid var(--line);font-size:13px;color:var(--mu);line-height:1.4}
.ptr{position:absolute;top:6px;left:50%;width:36px;height:36px;margin-left:-18px;border-radius:50%;background:#1E1E21;box-shadow:0 6px 18px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;opacity:0;transform:translateY(-20px) scale(.6);transition:opacity .2s,transform .25s;z-index:6;pointer-events:none}
.ptr i{width:16px;height:16px;border-radius:50%;border:2px solid rgba(212,255,58,.22);border-top-color:var(--volt);display:block}
.ptr.on{opacity:1;transform:translateY(14px) scale(1)}
.ptr.ready i{border-color:var(--volt)}
.ptr.spin i{animation:ptrspin .75s linear infinite}
@keyframes ptrspin{to{transform:rotate(360deg)}}
.scroll::-webkit-scrollbar,.pager::-webkit-scrollbar,.page::-webkit-scrollbar,.car::-webkit-scrollbar,.sheet::-webkit-scrollbar{display:none}
.pad{padding:0 var(--pad)}
@keyframes pulse{50%{opacity:.25}}

/* ---------- shared ---------- */
.sync{display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:500;color:var(--mu);white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--volt)}
.sync.saving i{background:var(--blue);animation:pulse 1s infinite}
.sync.off{color:var(--warn)}
.sync.off i{background:var(--warn)}
.card{background:var(--s1);border-radius:22px;padding:18px}
.bottom{flex:none;position:relative;padding:12px var(--pad) var(--sb);background:var(--bg)}
.bottom:before{content:"";position:absolute;left:0;right:0;top:-24px;height:24px;background:linear-gradient(rgba(11,11,12,0),var(--bg));pointer-events:none}
.cta{width:100%;height:58px;border-radius:18px;background:var(--volt);color:var(--ink);font-weight:700;font-size:18px;letter-spacing:-.01em;display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .12s}
.cta:active{transform:scale(.98)}
.cta.ghost{background:var(--s2);color:var(--tx)}
.cta svg{width:20px;height:20px}
.icon-btn{width:44px;height:44px;border-radius:50%;background:var(--s1);display:grid;place-items:center;flex:none}
.icon-btn svg{width:20px;height:20px}

/* ---------- home ---------- */
.h-top{display:flex;justify-content:space-between;align-items:center;padding:18px 0 0}
.h-date{font-size:15px;color:var(--mu);font-weight:500}
.wb-gear{width:34px;height:34px;border-radius:50%;background:var(--s2);color:var(--mu);display:grid;place-items:center;flex:none;margin-left:10px}.h-top .sync-host{margin-left:auto}
.h1{font-size:34px;line-height:1.08;font-weight:800;letter-spacing:-.04em;margin:8px 0 22px}
.resume{width:100%;display:flex;align-items:center;gap:14px;background:var(--volt);color:var(--ink);border-radius:22px;padding:16px 18px;margin-bottom:12px;text-align:left}
.resume .t{flex:1;min-width:0}
.resume b{display:block;font-size:17px;font-weight:700}
.resume span{display:block;font-size:14px;font-weight:500;opacity:.72;margin-top:2px}
.resume svg{width:24px;height:24px;flex:none}
.resume.alt{background:var(--s1);color:var(--tx)}
.resume.alt span{color:var(--mu);opacity:1}
.resume.alt svg{color:var(--volt)}
.row-b{display:flex;justify-content:space-between;align-items:center;gap:10px}
.t17{font-size:17px;font-weight:700;letter-spacing:-.01em}
.status{display:inline-flex;align-items:center;gap:7px;font-size:15px;font-weight:600;white-space:nowrap}
.status i{width:8px;height:8px;border-radius:50%;background:currentColor}
.good{color:var(--volt)} .warnc{color:var(--warn)} .muc{color:var(--mu)}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);margin-top:18px}
.metric{min-width:0}
.metric + .metric{border-left:1px solid var(--line);padding-left:16px}
.metric .v{font-size:32px;font-weight:700;letter-spacing:-.04em;line-height:1;font-variant-numeric:proportional-nums}
.metric .v small{font-size:15px;color:var(--mu);font-weight:500;margin-left:3px;letter-spacing:0}
.metric .l{font-size:14px;color:var(--mu);margin-top:8px}
.metric .d{font-size:13px;font-weight:600;margin-top:2px}
.up{color:var(--volt)} .down{color:var(--warn)} .flat{color:var(--mu2)}
.note-s{font-size:14px;color:var(--mu2);margin-top:16px;line-height:1.4}
.notice{display:flex;align-items:center;gap:14px;background:var(--s1);border-radius:22px;padding:16px;margin-top:12px}
.notice .ic{width:46px;height:46px;border-radius:14px;background:var(--s2);display:grid;place-items:center;flex:none;color:var(--warn)}
.notice .ic svg{width:22px;height:22px}
.notice .tx{flex:1;min-width:0}
.notice .tx b{display:block;font-size:16px;font-weight:600;line-height:1.3}
.notice .tx span{display:block;font-size:14px;color:var(--mu);margin-top:3px}
.btn2{height:42px;padding:0 18px;border-radius:13px;background:var(--tx);color:var(--ink);font-weight:700;font-size:15px;flex:none}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:32px 0 14px}
.sec h2{font-size:24px;font-weight:800;letter-spacing:-.035em;margin:0}
.sec span{font-size:14px;color:var(--mu)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--s1);padding:4px;border-radius:15px;gap:4px}
.seg button{height:42px;border-radius:11px;font-weight:600;font-size:15px;color:var(--mu);transition:background .2s,color .2s}
.seg button.on{background:var(--s3);color:var(--tx)}
.seg .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--volt);margin-left:6px;vertical-align:2px}
.car{display:flex;gap:10px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;margin:12px calc(-1 * var(--pad)) 0;padding:0 var(--pad);scroll-padding:0 var(--pad);scrollbar-width:none;overscroll-behavior-x:contain}
.hero{flex:0 0 calc(100% - 30px);scroll-snap-align:start;scroll-snap-stop:always;position:relative;border-radius:24px;overflow:hidden;height:236px;background:var(--s2);display:flex;flex-direction:column;justify-content:flex-end;text-align:left}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(.25)}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,11,12,0) 25%,rgba(11,11,12,.93) 100%)}
.hero .in{position:relative;z-index:1;padding:18px 18px 20px}
.hero .tag{display:inline-block;font-size:13px;font-weight:700;background:var(--volt);color:var(--ink);padding:4px 10px;border-radius:8px;margin-bottom:10px}
.hero h3{font-size:36px;font-weight:800;letter-spacing:-.045em;line-height:1;margin:0 0 8px}
.hero .meta{font-size:15px;color:var(--tx2);font-weight:500}
.car-hint{text-align:center;font-size:13px;color:var(--mu2);margin-top:10px}
.plist{margin-top:14px;padding:4px 18px}
.pitem{display:flex;gap:14px;align-items:center;padding:12px 0;width:100%;text-align:left}
.pitem + .pitem{border-top:1px solid var(--line)}
.thumb{width:58px;height:58px;border-radius:15px;overflow:hidden;flex:none;background:var(--s2)}
.thumb img{width:100%;height:100%;object-fit:cover}
.pitem .nm{font-size:16px;font-weight:600;line-height:1.25}
.pitem .sx{font-size:14px;color:var(--mu);margin-top:3px}
.badge{display:inline-block;font-size:13px;font-weight:600;color:var(--blue);margin-left:6px}
.kvline{display:flex;justify-content:space-between;gap:12px;font-size:15px;padding:4px 0}
.kvline span:first-child{color:var(--mu)}
.kvline span:last-child{font-weight:600;text-align:right}

/* ---------- workout ---------- */
.w-head{flex:none;padding:12px var(--pad) 6px;background:var(--bg)}
.w-row{display:flex;align-items:center;gap:12px}
.w-title{flex:1;min-width:0}
.w-title b{display:block;font-size:18px;font-weight:700;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.w-title span{display:block;font-size:14px;color:var(--mu);font-variant-numeric:proportional-nums}
.segs{display:flex;gap:4px;margin-top:10px}
.segs button{flex:1;height:22px;display:flex;align-items:center;min-width:0}
.segs button.fin{flex:0 0 22px;justify-content:center;color:var(--mu2)}
.segs button.fin svg{width:14px;height:14px}
.segs button.fin.cur{color:var(--volt)}
.segs i{display:block;position:relative;width:100%;height:4px;border-radius:3px;background:var(--s3);overflow:hidden;transition:height .2s}
.segs i b{position:absolute;left:0;top:0;bottom:0;background:var(--volt);border-radius:3px;transition:width .3s}
.segs button.cur i{height:8px;background:#3C3C42}
.pager{flex:1;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;scrollbar-width:none}
.page{flex:0 0 100%;width:100%;height:100%;overflow-y:auto;overflow-x:hidden;scroll-snap-align:start;scroll-snap-stop:always;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;scrollbar-width:none}
.page-in{padding:8px var(--pad) 36px}
.media{position:relative;display:block;width:100%;height:190px;border-radius:22px;overflow:hidden;background:var(--s2)}
.media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.media img.b{animation:flip 2.6s ease-in-out infinite}
@keyframes flip{0%,38%{opacity:0}50%,88%{opacity:1}100%{opacity:0}}
.media .cnt,.media .how{position:absolute;z-index:1;font-size:14px;font-weight:600;background:rgba(11,11,12,.62);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);padding:6px 11px;border-radius:10px;display:flex;align-items:center;gap:6px}
.media .cnt{top:12px;left:12px}
.media .how{bottom:12px;right:12px}
.media .how svg{width:16px;height:16px}
.ss-bar{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--blue);margin-top:14px}
.ss-bar svg{width:16px;height:16px;flex:none}
.ex-name{font-size:26px;font-weight:800;letter-spacing:-.035em;line-height:1.12;margin:14px 0 8px}
.ex-meta{font-size:15px;color:var(--mu);display:flex;flex-wrap:wrap;gap:4px 14px}
.ex-meta b{color:var(--tx);font-weight:600}
.ex-meta .tg{color:var(--blue);font-weight:500}
.last{background:var(--s1);border-radius:18px;padding:14px 16px;margin-top:16px}
.last .k{font-size:14px;color:var(--mu)}
.last .v{font-size:18px;font-weight:600;margin-top:3px;font-variant-numeric:proportional-nums;letter-spacing:-.01em}
.last .s{font-size:15px;color:var(--tx2);margin-top:8px;line-height:1.4}
.last .tgt{font-size:15px;font-weight:700;color:var(--volt);margin-top:10px;font-variant-numeric:proportional-nums}
.mode{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;padding:10px 12px 10px 14px;border-radius:14px;background:var(--volt-dim);font-size:14px;line-height:1.35;color:var(--tx2)}
.mode b{color:var(--volt)}
.mode.light,.mode.deload{background:rgba(255,179,92,.13)}
.mode.light b,.mode.deload b{color:var(--warn)}
.mode button{flex:none;height:34px;padding:0 12px;border-radius:10px;background:var(--s2);color:var(--tx);font-weight:600;font-size:14px}
.ci-plan{margin-top:16px;padding:12px 14px;border-radius:14px;background:var(--s2);font-size:15px;line-height:1.4;color:var(--tx2);min-height:22px}
.ci-plan b{color:var(--volt)}
.ci-plan.light b,.ci-plan.deload b{color:var(--warn)}
.ai{margin-top:12px}
.ai .hd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.ai .tag2{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--volt)}
.ai .tx{font-size:15px;line-height:1.45;color:var(--tx2)}
.ai ul{margin:8px 0 0;padding:0;list-style:none}
.ai li{font-size:15px;line-height:1.4;color:var(--tx2);padding:5px 0 5px 16px;position:relative}
.ai li:before{content:'';position:absolute;left:2px;top:13px;width:5px;height:5px;border-radius:50%;background:var(--volt)}
.ai .wait{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--mu)}
.ai .pl{display:flex;flex-direction:column;gap:14px;margin-top:16px}
.nutri{margin-top:12px}
.nb-cap{font-size:12px;color:var(--mu2)}
.nb-list{display:flex;flex-direction:column;gap:14px;margin-top:16px}
.nb-h{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;color:var(--mu)}
.nb-h b{font-weight:600;color:var(--tx);font-variant-numeric:proportional-nums}
.nb-tr{position:relative;height:8px;border-radius:4px;background:var(--s3);margin-top:7px}
.nb-in{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
.nb-ov{position:absolute;top:0;bottom:0;border-radius:0 4px 4px 0;background:repeating-linear-gradient(135deg,#FF5A5F 0 4px,rgba(255,90,95,.55) 4px 8px)}
.nb-ov.ok{background:repeating-linear-gradient(135deg,#D4FF3A 0 4px,rgba(212,255,58,.5) 4px 8px)}
.nb-goal{position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1px;border-radius:1px;background:var(--tx)}
.nb-n{font-size:12px;color:var(--mu2);margin-top:5px}
.nb-bad{color:var(--bad)}
.rest-cap{font-size:13px;color:var(--mu);text-align:center;margin-bottom:10px}
.wt{margin-top:12px}
.wst-box{margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.08)}
.wst-v{font-size:13px;color:var(--mu2)}.wst-v b{color:var(--tx);font-weight:600}
.wst{display:flex;gap:8px;margin-top:10px}
.wst input{flex:1;min-width:0;height:40px;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:var(--tx);font:inherit;font-size:16px;padding:0 12px}
.wt-main{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:12px}
.wt-v{font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1;font-variant-numeric:proportional-nums}
.wt-v small{font-size:15px;font-weight:500;color:var(--mu);margin-left:4px;letter-spacing:0}
.wt-d{display:flex;gap:16px;text-align:right}
.wt-d div{font-size:12px;color:var(--mu2)}
.wt-d b{display:block;font-size:15px;font-weight:600;color:var(--tx);font-variant-numeric:proportional-nums;margin-bottom:2px}
.wt-sp{display:block;width:100%;height:56px;margin-top:14px;overflow:visible}
.wt-ax{display:flex;justify-content:space-between;font-size:11px;color:var(--mu2);margin-top:4px}
.tdee{border-top:1px solid var(--line);margin-top:16px;padding-top:14px}
.tdee-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:14px;color:var(--mu)}
.tdee-h b{font-size:20px;font-weight:700;color:var(--tx);font-variant-numeric:proportional-nums}
.tdee-t{font-size:14px;line-height:1.45;color:var(--tx2);margin-top:6px}
.tdee-t b{color:var(--volt);font-weight:600}
.ai .pl-row{display:flex;gap:12px;align-items:flex-start}
.ai .pl-ic{width:30px;height:30px;border-radius:50%;background:var(--s2);color:var(--mu);display:grid;place-items:center;flex:none}
.ai .pl-ic svg{width:16px;height:16px}
.ai .pl-lb{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mu2);margin:1px 0 3px}
.ai .pl-tx{font-size:15px;line-height:1.45;color:var(--tx2)}
.ai .pl-tx b{font-weight:600;color:var(--tx)}
.ai .pl-row.focus{background:var(--volt-dim);border-radius:16px;padding:12px}
.ai .pl-row.focus .pl-ic{background:var(--volt);color:var(--ink)}
.ai .pl-row.focus .pl-lb{color:var(--volt)}
.ai .pl-row.focus .pl-tx{color:var(--tx)}
.ai .wait i{width:8px;height:8px;border-radius:50%;background:var(--volt);animation:pulse 1.2s infinite;flex:none}
.ai .more{color:var(--volt);font-size:14px;font-weight:600;margin-top:6px}
.sheet .ai-sum{color:var(--tx2);margin-top:8px}
/* ===== insights: premium cards, charts, history, week ===== */
:root{--org:#FF7A33;--org-dim:rgba(255,122,51,.14);--same:#8A8A93;--d:'Unbounded',var(--f);
  --heat:linear-gradient(120deg,#FF5E2B 0%,#FF9A3C 42%,#D4FF3A 100%)}
.lux{position:relative;overflow:hidden;border-radius:28px;padding:20px;
  background:radial-gradient(120% 90% at 105% -10%,rgba(255,122,51,.30),transparent 52%),radial-gradient(90% 80% at -10% 110%,rgba(212,255,58,.16),transparent 58%),linear-gradient(180deg,#1B1B1E,#121214)}
.lux:before,.glass:before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
  background:linear-gradient(140deg,rgba(255,154,60,.55),rgba(255,255,255,.06) 40%,rgba(212,255,58,.35));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.glass{position:relative;border-radius:24px;padding:18px;background:linear-gradient(180deg,#19191C,#141416)}
.glass:before{background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.03) 50%,rgba(255,255,255,.07))}
.gap{height:12px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mu)}
.eyebrow.hot{background:var(--heat);-webkit-background-clip:text;background-clip:text;color:transparent}
.ctitle{font-size:19px;font-weight:800;letter-spacing:-.025em;margin:4px 0 0}
.chd{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:14px}
.chd .side{font-size:13px;color:var(--mu);text-align:right}
.big{font-family:var(--d);font-weight:700;letter-spacing:-.04em;line-height:.95;font-variant-numeric:proportional-nums}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:999px;font-size:13px;font-weight:700;white-space:nowrap;background:rgba(255,255,255,.07);color:var(--tx2)}
.chip.up{background:var(--volt-dim);color:var(--volt)}
.chip.down{background:var(--org-dim);color:var(--org)}
.chip.new{background:rgba(122,167,255,.14);color:#7AA7FF}
.chip.heat{background:var(--heat);color:var(--ink)}
/* compact coach card on home */
.ai.tap{display:block;width:100%;text-align:left;color:inherit}
.ai .ttl{font-size:16px;font-weight:600;line-height:1.38;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ai .go{display:flex;align-items:center;justify-content:space-between;margin-top:14px;font-size:14px;font-weight:700;color:var(--volt)}
.ai .go svg{width:16px;height:16px}
.rv-row{display:flex;gap:14px;align-items:center}
.rv-row .ttl{flex:1;min-width:0}
/* folded coach points */
.pts{margin-top:12px}
.pts details{border-top:1px solid var(--line)}
.pts summary{list-style:none;display:flex;gap:10px;align-items:center;padding:13px 0;cursor:pointer}
.pts summary::-webkit-details-marker{display:none}
.pts summary b{flex:none;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:5px 8px;border-radius:8px;background:var(--volt-dim);color:var(--volt)}
.pts summary b.warn{background:var(--org-dim);color:var(--org)}
.pts summary b.info{background:rgba(122,167,255,.14);color:#7AA7FF}
.pts summary span{flex:1;min-width:0;font-size:15px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pts details[open] summary span{display:none}
.pts summary:after{content:'';flex:none;margin-left:auto;width:8px;height:8px;border-right:2px solid var(--mu);border-bottom:2px solid var(--mu);transform:rotate(45deg) translateY(-3px);transition:transform .2s}
.pts details[open] summary:after{transform:rotate(225deg) translateY(-1px)}
.pts p{margin:-2px 0 14px;font-size:15px;line-height:1.5;color:var(--tx2)}
/* donut / rings */
.donut{position:relative;flex:none}
.donut svg{display:block;width:100%;height:100%;overflow:visible}
.donut .dc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.donut .dc b{font-family:var(--d);font-size:26px;font-weight:700;letter-spacing:-.04em;line-height:1}
.donut .dc span{font-size:11px;color:var(--mu);margin-top:4px;line-height:1.2}
.mixrow{display:flex;align-items:center;gap:20px}
.lg{flex:1;min-width:0;display:flex;flex-direction:column;gap:9px}
.lg div{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--tx2)}
.lg i{width:10px;height:10px;border-radius:3px;flex:none}
.lg b{margin-left:auto;font-weight:700;color:var(--tx);font-variant-numeric:proportional-nums;white-space:nowrap}
/* history list */
.hrow{display:flex;align-items:center;gap:14px;width:100%;padding:14px 0;text-align:left;color:inherit}
.hrow + .hrow{border-top:1px solid var(--line)}
.hrow .dt{flex:none;width:52px;height:56px;border-radius:16px;background:rgba(255,255,255,.05);display:flex;flex-direction:column;align-items:center;justify-content:center}
.hrow .dt b{font-family:var(--d);font-size:20px;font-weight:700;letter-spacing:-.04em;line-height:1}
.hrow .dt span{font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:.06em;margin-top:3px}
.hrow .dt.hot{background:var(--heat);color:var(--ink)}
.hrow .dt.hot span{color:rgba(11,11,12,.7)}
.hrow .md{flex:1;min-width:0}
.hrow .md b{display:block;font-size:16px;font-weight:700}
.hrow .md span{display:block;font-size:13px;color:var(--mu);margin-top:3px}
.hrow .sb{display:flex;gap:2px;height:6px;margin-top:9px;border-radius:3px;overflow:hidden}
.hrow .sb i{display:block;height:100%}
.hrow .rt{flex:none;text-align:right}
.hrow .rt b{display:block;font-family:var(--d);font-size:15px;font-weight:700;letter-spacing:-.03em}
.hrow .rt span{display:block;font-size:11px;color:var(--mu);margin-top:3px}
.hrow>svg{flex:none;width:16px;height:16px;color:var(--mu2)}
/* workout hero */
.hx{padding:22px 20px 20px}
.hx .ghost{position:absolute;right:-18px;top:-42px;font-family:var(--d);font-weight:800;font-size:220px;line-height:1;color:transparent;-webkit-text-stroke:1.5px rgba(255,255,255,.05);pointer-events:none}
.hx .big{font-size:56px;margin-top:18px}
.hx .big small{font-family:var(--f);font-size:17px;font-weight:600;color:var(--mu);letter-spacing:0;margin-left:6px}
.hx .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}
.tile{border-radius:16px;padding:12px;background:rgba(255,255,255,.055);backdrop-filter:blur(8px)}
.tile b{display:block;font-family:var(--d);font-size:20px;font-weight:700;letter-spacing:-.04em}
.tile span{display:block;font-size:12px;color:var(--mu);margin-top:4px}
.feelq{margin-top:14px;font-size:14px;color:var(--tx2)}
/* exercises */
.exc{position:relative;padding:16px 16px 14px 20px;border-radius:22px;background:linear-gradient(180deg,#19191C,#141416);overflow:hidden}
.exc + .exc{margin-top:10px}
.exc:before{content:'';position:absolute;left:0;top:16px;bottom:16px;width:4px;border-radius:0 4px 4px 0;background:var(--c,#8A8A93)}
.exc .top{display:flex;align-items:flex-start;gap:10px}
.exc .nm{flex:1;min-width:0;font-size:16px;font-weight:700;line-height:1.3}
.exc .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.exc .was{font-size:12px;color:var(--mu);margin-top:10px}
.setbars{display:flex;align-items:flex-end;gap:8px;height:92px;margin-top:14px}
.setbars .sb1{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end}
.setbars .col{position:relative;width:100%;max-width:56px;flex:none}
.setbars .bar{position:absolute;left:0;right:0;bottom:0;border-radius:10px 10px 4px 4px}
.setbars .tick{position:absolute;left:-3px;right:-3px;height:0;border-top:2px dashed rgba(255,255,255,.55)}
.setbars .lb{font-size:12px;font-weight:700;color:var(--tx2);margin-top:7px;white-space:nowrap;font-variant-numeric:proportional-nums}
.setbars .lb.f{color:var(--org)}
.keyline{display:flex;gap:14px;font-size:12px;color:var(--mu);margin:-4px 0 12px}
.keyline span{display:inline-flex;align-items:center;gap:6px}
.keyline i{display:inline-block;width:14px;height:8px;border-radius:3px;background:var(--heat)}
.keyline i.t{height:0;border-top:2px dashed rgba(255,255,255,.55);background:none}
.trend{flex:none;text-align:right}
.trend svg{display:block;width:84px;height:34px}
.trend span{display:block;font-size:11px;font-weight:700;margin-top:2px}
/* bars (tonnage, kcal) */
.vbars{display:flex;align-items:flex-end;gap:8px;height:170px}
.vbars .vb{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;color:var(--mu);font-size:11px;text-align:center}
.vbars .vb em{font-style:normal;font-size:11px;font-weight:700;color:var(--mu);margin-bottom:6px;font-variant-numeric:proportional-nums;white-space:nowrap}
.vbars .vb i{display:block;flex:none;width:100%;max-width:38px;border-radius:12px 12px 5px 5px;background:linear-gradient(180deg,#36363C,#26262B)}
.vbars .vb.on i{background:var(--heat);box-shadow:0 10px 30px -6px rgba(255,122,51,.55)}
.vbars .vb.on em{color:var(--tx)}
.vbars .vb.on{color:var(--tx);font-weight:700}
.vbars .vb small{display:block;margin-top:8px;line-height:1.25}
.goalwrap{position:relative}
.goalline{position:absolute;left:0;right:0;border-top:1.5px dashed rgba(255,255,255,.35);pointer-events:none}
.goalline span{position:absolute;right:0;top:-18px;font-size:11px;color:var(--mu);background:#161618;padding:0 4px}
/* gauges */
.gauges{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.gauge{text-align:center}
.gauge svg{display:block;width:100%;height:auto;overflow:visible}
.gauge b{display:block;font-family:var(--d);font-size:20px;font-weight:700;letter-spacing:-.04em;margin-top:-28px}
.gauge b small{font-family:var(--f);font-size:12px;color:var(--mu);font-weight:600;letter-spacing:0;margin-left:2px}
.gauge span{display:block;font-size:12px;color:var(--mu);margin-top:6px}
.gauge em{display:block;font-style:normal;font-size:12px;font-weight:700;margin-top:3px}
/* week */
.wk-nav{display:flex;gap:8px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:11px;color:var(--mu)}
.day .cap{width:100%;max-width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-family:var(--d);font-size:14px;font-weight:700;background:rgba(255,255,255,.05);color:var(--mu2)}
.day .cap.on{background:var(--heat);color:var(--ink);box-shadow:0 8px 22px -6px rgba(255,122,51,.6)}
.day .cap.today{outline:1.5px solid rgba(255,255,255,.35);outline-offset:2px}
.day .slp{position:relative;width:12px;height:64px;border-radius:6px;background:rgba(255,255,255,.05);overflow:hidden}
.day .slp i{position:absolute;left:0;right:0;bottom:0;border-radius:6px}
.day b{font-size:12px;color:var(--tx2);font-weight:700;font-variant-numeric:proportional-nums}
.hbars{display:flex;flex-direction:column;gap:12px}
.hb{display:grid;grid-template-columns:96px 1fr 34px;align-items:center;gap:10px;font-size:13px}
.hb span{color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb .tr{position:relative;height:12px;border-radius:6px;background:rgba(255,255,255,.05)}
.hb .tr i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--heat)}
.hb .tr u{position:absolute;top:-4px;bottom:-4px;width:2px;background:rgba(255,255,255,.6);border-radius:1px}
.hb b{text-align:right;font-variant-numeric:proportional-nums}
.movers div{display:flex;align-items:center;gap:10px;padding:10px 0;font-size:14px}
.movers div + div{border-top:1px solid var(--line)}
.movers .mn{flex:1;min-width:0;color:var(--tx2);line-height:1.3;overflow-wrap:anywhere}
.movers .mc{flex:none;display:flex;gap:6px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:14px;font-size:12px;color:var(--mu)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:8px;height:8px;border-radius:2px;display:inline-block}
.mm{display:flex;justify-content:center;gap:4px;margin:14px -6px 0;position:relative}
.mm:before{content:'';position:absolute;left:10%;right:10%;bottom:-4px;height:30px;border-radius:50%;background:radial-gradient(closest-side,rgba(212,255,58,.12),transparent);filter:blur(2px)}
.mm>div{width:48%;position:relative}
.mm svg{width:100%;height:auto;display:block}
.mm .side{position:absolute;top:0;left:50%;transform:translateX(-50%);font-size:11px;color:var(--mu2);font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.mrows{display:flex;flex-direction:column;gap:12px;margin-top:18px}
.mr{display:grid;grid-template-columns:118px 1fr 40px;align-items:center;gap:12px;font-size:14px;line-height:1.2;color:var(--tx2)}
.mr .tr{position:relative;height:6px;border-radius:3px;background:rgba(255,255,255,.07)}
.mr .tr i{position:absolute;left:0;top:0;bottom:0;border-radius:3px}
.mr .tr .zone{position:absolute;top:-4px;bottom:-4px;left:33.33%;width:33.33%;border-left:1px dashed rgba(255,255,255,.35);border-right:1px dashed rgba(255,255,255,.35)}
.mr b{text-align:right;font-size:15px;color:var(--tx);font-variant-numeric:proportional-nums}
.mr b.o{color:var(--org)}
.cor-sp{display:block;width:100%;height:auto;margin-top:14px;overflow:visible}
.mm-card{margin-top:12px}
.macro{display:flex;flex-direction:column;align-items:stretch;gap:18px}
.macro .donut{align-self:center}
.wk-home{display:block;width:100%;text-align:left;color:inherit}
.wk-home .days{margin-top:16px}
.wk-home .day .cap{height:34px;border-radius:11px;font-size:12px}
.wk-top{display:flex;align-items:center;gap:16px}
.wk-top .tx{flex:1;min-width:0}
.wk-top .big{font-size:30px}
.wk-top .big small{font-family:var(--f);font-size:14px;color:var(--mu);font-weight:600;letter-spacing:0;margin-left:4px}
.sets{margin-top:18px}
.sets-h,.set-row{display:grid;grid-template-columns:34px 1fr 1fr 60px;gap:8px;align-items:center}
.uni .sets-h,.uni .set-row{grid-template-columns:34px 1fr .85fr .85fr 60px}
.sets-h{font-size:13px;color:var(--mu2);font-weight:500;padding-bottom:6px}
.sets-h div{text-align:center}
.set-row{padding:4px 0}
.set-n{font-size:17px;font-weight:700;color:var(--mu2);text-align:center;line-height:1;position:relative}
.set-n .prb{display:block;font-size:10px;font-weight:800;color:var(--ink);background:var(--volt);border-radius:5px;padding:2px 0;margin-top:4px;font-style:normal}
.set-n .rm{width:34px;height:44px;display:grid;place-items:center;color:var(--mu)}
.set-n .rm svg{width:18px;height:18px}
.set-row.next .set-n{color:var(--tx)}
.num{width:100%;height:56px;border-radius:15px;border:2px solid transparent;background:var(--s1);text-align:center;font-size:23px;font-weight:700;letter-spacing:-.02em;outline:none;font-variant-numeric:proportional-nums;padding:0 4px;-webkit-appearance:none;appearance:none}
.num::placeholder{color:#4A4A50;font-weight:500;font-size:18px}
.num:focus{border-color:var(--volt);background:var(--s2)}
.set-row.next .num{background:var(--s2)}
.check{width:60px;height:56px;border-radius:15px;background:var(--s2);display:grid;place-items:center;transition:background .15s}
.check svg{width:26px;height:26px;color:var(--mu)}
.set-row.next .check{background:var(--s3)}
.set-row.next .check svg{color:var(--tx)}
.set-row.done .num{background:var(--volt-dim);color:var(--volt)}
.set-row.done .check{background:var(--volt)}
.set-row.done .check svg{color:var(--ink)}
.set-row.done .set-n{color:var(--volt)}
.set-row.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.rir{margin-top:20px}
.rir .k{font-size:14px;color:var(--mu);margin-bottom:10px}
.rir .k b{color:var(--tx);font-weight:600}
.chips5{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.chips5 button{height:46px;border-radius:13px;background:var(--s1);font-weight:700;font-size:17px}
.chips5 button.on{background:var(--tx);color:var(--ink)}
.ex-tools{display:flex;gap:8px;margin-top:12px}
.ex-was{font-size:14px;color:var(--volt);font-weight:600;margin:-2px 0 8px}
.swap-l{display:flex;flex-direction:column;gap:8px;margin:14px 0}
.swap-l .choice{width:100%}
.swap-own{display:flex;gap:8px;margin-top:6px}
.swap-own input{flex:1;min-width:0;height:50px;border-radius:14px;background:var(--s2);border:0;color:var(--tx);font:inherit;font-size:16px;padding:0 14px}
.swap-own button{height:50px;padding:0 16px}
.tool{flex:1;height:46px;border-radius:13px;background:var(--s1);font-size:15px;font-weight:600;color:var(--tx2);display:flex;align-items:center;justify-content:center;gap:7px}
.tool svg{width:18px;height:18px}
.note-in{width:100%;margin-top:10px;background:var(--s1);border:2px solid transparent;border-radius:14px;padding:12px 14px;font-size:16px;outline:none;resize:none;line-height:1.4}
.note-in:focus{border-color:var(--volt)}
.wnav{display:flex;align-items:center;gap:10px}
.wnav .nb{width:58px;height:58px;border-radius:18px;background:var(--s1);display:grid;place-items:center;flex:none}
.wnav .nb svg{width:22px;height:22px}
.wnav .nx{flex:1;min-width:0;height:58px;border-radius:18px;background:var(--s1);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 18px;font-weight:600;font-size:16px;transition:background .2s,color .2s}
.wnav .nx span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.wnav .nx svg{width:20px;height:20px;flex:none}
.wnav .nx.hot{background:var(--volt);color:var(--ink)}
.wnav .cta{flex:1}
body.resting .w-bottom .wnav{visibility:hidden}
/* warm-up: the screen before the first exercise and the «Р» rows above the working sets */
.wu-scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scrollbar-width:none;padding:8px var(--pad) 24px}
.wu-hero{display:flex;align-items:center;gap:16px}
.wu-hero .tx{flex:1;min-width:0}
.wu-hero h2{font-family:var(--d);font-size:28px;font-weight:700;letter-spacing:-.03em;margin:6px 0 4px;line-height:1.05}
.wu-hero p{margin:0;font-size:14px;color:var(--mu)}
.wu-ring{position:relative;width:84px;height:84px;flex:none}
.wu-ring svg{width:84px;height:84px;transform:rotate(-90deg)}
.wu-ring circle{transition:stroke-dashoffset .5s cubic-bezier(.2,.8,.2,1)}
.wu-ring .v{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--d);font-size:20px;font-weight:700;font-variant-numeric:proportional-nums}
.wu-ring .v small{font-size:12px;color:var(--mu);font-weight:600}
.wu-list{margin-top:12px;padding:6px 16px}
.wu-it{display:flex;align-items:center;gap:14px;width:100%;padding:13px 0;border-top:1px solid var(--line);text-align:left}
.wu-it:first-child{border-top:0}
.wu-it .ck{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--s3);display:grid;place-items:center;color:transparent;transition:all .2s}
.wu-it .ck svg{width:16px;height:16px}
.wu-it.on .ck{background:var(--org);border-color:var(--org);color:var(--ink);box-shadow:0 0 16px rgba(255,122,51,.5)}
.wu-it .nm{flex:1;min-width:0}
.wu-it .nm b{display:block;font-size:16px;font-weight:600;letter-spacing:-.01em}
.wu-it .nm span{display:block;font-size:13px;color:var(--mu);margin-top:1px}
.wu-it.on .nm b{color:var(--tx2)}
.wu-tm{flex:none;height:40px;padding:0 14px;border-radius:12px;background:var(--org-dim);color:var(--org);font-weight:700;font-size:15px;display:flex;align-items:center;gap:6px;font-variant-numeric:proportional-nums}
.wu-tm svg{width:14px;height:14px}
.wu-tm.run{background:var(--org);color:var(--ink)}
.wu-next{margin-top:14px;font-size:13px;color:var(--mu);text-align:center}
.wu-next b{color:var(--tx2);font-weight:600}
.wu-bottom .linkbtn{padding:12px 0 2px}
body.resting .wu-bottom{padding-bottom:calc(var(--sb) + 92px)}
.set-row.warm .set-n{font-family:var(--d);font-size:15px;color:var(--org);opacity:.75}
.set-row.warm .set-n sub{font-family:var(--f);font-size:10px;vertical-align:baseline;margin-left:1px}
.set-row.warm .num{height:48px;font-size:19px;color:var(--tx2)}
.set-row.warm .check{height:48px}
.set-row.warm .check svg{width:22px;height:22px}
.set-row.warm.next .set-n{opacity:1}
.set-row.warm.done .set-n{opacity:1}
.set-row.warm.done .num{background:var(--org-dim);color:var(--org)}
.set-row.warm.done .check{background:var(--org);box-shadow:0 0 18px rgba(255,122,51,.4)}
.set-row.warm.done .check svg{color:var(--ink)}
.wu-line{display:flex;align-items:center;gap:10px;margin:4px 0 8px;font-size:13px;color:var(--mu2)}
.wu-line:after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.wu-line button{color:var(--org);font-weight:600;font-size:13px;padding:6px 0}
.wu-line .rmw{color:var(--mu)}
.rest.warm .t b{color:var(--org)}
.rest.warm.end .t b{color:var(--ink)}

/* finish page */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--s1);border-radius:18px;padding:16px}
.stat .v{font-size:28px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:proportional-nums;line-height:1.1}
.stat .v small{font-size:16px;color:var(--mu);font-weight:500}
.stat .l{font-size:14px;color:var(--mu);margin-top:4px}
.fin-list{margin-top:12px;padding:2px 16px}
.fin-item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;width:100%;text-align:left;font-size:15px}
.fin-item + .fin-item{border-top:1px solid var(--line)}
.fin-item span:first-child{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.fin-item b{font-weight:600;flex:none;font-variant-numeric:proportional-nums}
.fin-item b.ok{color:var(--volt)}
.fin-item b.part{color:var(--warn)}
.field{margin-top:22px}
.field > label,.field > .lbl{display:block;font-size:15px;font-weight:600;margin-bottom:10px}
.txt{width:100%;height:54px;border-radius:15px;background:var(--s1);border:2px solid transparent;padding:0 16px;font-size:18px;font-weight:600;outline:none;-webkit-appearance:none}
.txt:focus{border-color:var(--volt)}
.choices{display:grid;gap:8px}
.choices.c2{grid-template-columns:1fr 1fr}
.choices.c3{grid-template-columns:repeat(3,1fr)}
.choice{min-height:54px;border-radius:15px;background:var(--s1);border:2px solid transparent;font-weight:600;font-size:15px;padding:10px 14px;text-align:left;display:flex;flex-direction:column;justify-content:center}
.choices.c3 .choice{align-items:center;text-align:center}
.choice small{display:block;color:var(--mu);font-weight:500;font-size:13px;margin-top:2px}
.choice.on{border-color:var(--volt);background:var(--volt-dim)}
.linkbtn{display:block;width:100%;padding:14px 0;font-size:15px;font-weight:500;color:var(--mu);text-align:center}
.linkbtn.danger{color:var(--bad)}
.cta.danger{background:var(--bad);color:#fff}
.warn-line{font-size:14px;color:var(--warn);margin-top:12px;line-height:1.4}

/* rest timer */
.rest{position:fixed;left:12px;right:12px;bottom:calc(var(--sb) + 4px);z-index:40;max-width:536px;margin:0 auto;background:#202024;border:1px solid #34343B;border-radius:24px;padding:12px;display:flex;align-items:center;gap:12px;box-shadow:0 20px 50px rgba(0,0,0,.55);transform:translateY(20px);opacity:0;pointer-events:none;transition:.25s}
.rest.on{transform:none;opacity:1;pointer-events:auto}
.rest.end{background:var(--volt);color:var(--ink);border-color:var(--volt)}
.ring{position:relative;width:60px;height:60px;flex:none}
.ring svg{width:60px;height:60px;transform:rotate(-90deg)}
.ring .tm{position:absolute;inset:0;display:grid;place-items:center;font-size:16px;font-weight:700;font-variant-numeric:proportional-nums}
.rest .t{flex:1;min-width:0}
.rest .t b{display:block;font-size:16px;font-weight:700}
.rest .t span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-size:13px;line-height:1.25;color:var(--mu);overflow:hidden}
.rest.end .t span{color:rgba(11,11,12,.7)}
.rest .rb{height:46px;min-width:44px;padding:0 8px;border-radius:13px;background:var(--s3);font-weight:700;font-size:15px;display:grid;place-items:center}
.rest.end .rb{background:rgba(11,11,12,.12)}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:60;opacity:0;transition:opacity .25s}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;max-height:calc(100% - var(--st) - 24px);overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;background:var(--s1);border-radius:28px 28px 0 0;padding:10px var(--pad) calc(var(--sb) + 10px);transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.9,.3,1)}
.sheet.on{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:99px;background:var(--s3);margin:0 auto 16px}
.sheet h3{font-size:24px;margin:4px 0 6px;font-weight:800;letter-spacing:-.03em;line-height:1.15}
.sheet .inner{max-width:520px;margin:0 auto}
.sheet .sub{font-size:15px;color:var(--mu);margin:0 0 4px}
.sheet .choice{background:var(--s2)}
.sheet .choice.on{background:var(--volt-dim)}
.big-media{position:relative;border-radius:22px;overflow:hidden;aspect-ratio:4/3;background:var(--s2)}
.big-media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.big-media img.b{animation:flip 2.6s ease-in-out infinite}
.cues{margin:12px 0 0;padding:0;list-style:none;display:grid;gap:8px}
.cues li{font-size:15px;color:var(--tx2);display:flex;gap:10px;line-height:1.4}
.cues li:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--volt);margin-top:8px;flex:none}
.t-focus{margin:14px 0 4px;padding:16px 18px;border-radius:20px;background:var(--volt-dim)}
.t-focus .t-lbl{font-size:13px;font-weight:600;color:var(--volt);margin-bottom:4px}
.t-focus p{margin:0;font-size:18px;font-weight:600;line-height:1.35;letter-spacing:-.01em}
.t-sec{margin-top:20px}
.t-sec h4{margin:0 0 2px;font-size:17px;font-weight:700;letter-spacing:-.01em}
.t-sec p{margin:8px 0 0;font-size:16px;color:var(--tx2);line-height:1.45}
.t-sec .cues li{font-size:16px}
.cues.err li:before{content:"×";width:auto;height:auto;background:none;color:var(--warn);font-weight:700;margin-top:0;line-height:1.4}
.t-tip{margin:20px 0 0;padding:14px 16px;border-radius:16px;background:var(--s2);font-size:15px;color:var(--tx2);line-height:1.45}
.kv{display:grid;grid-template-columns:auto 1fr;gap:10px 16px;font-size:15px;margin:18px 0}
.kv dt{color:var(--mu)}
.kv dd{margin:0;font-weight:500}
.h-sub{font-size:15px;font-weight:600;margin:6px 0 4px}
.hist-row{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:15px}
.hist-row span:first-child{color:var(--mu);white-space:nowrap}
.hist-row span:last-child{text-align:right;font-weight:500;font-variant-numeric:proportional-nums}

/* done */
.done-hero{text-align:center;padding:48px 0 20px}
.done-badge{width:92px;height:92px;border-radius:50%;background:var(--volt);color:var(--ink);display:grid;place-items:center;margin:0 auto 20px}
.done-badge svg{width:44px;height:44px}
.done-hero h1{font-size:32px;margin:0 0 8px;letter-spacing:-.04em;font-weight:800;line-height:1.1}
.save-state{display:flex;gap:8px;align-items:center;justify-content:center;font-size:15px;font-weight:600;margin-top:14px}
.save-state svg{width:16px;height:16px}

.toast{position:fixed;left:50%;top:calc(var(--st) + 14px);transform:translate(-50%,-30px);z-index:90;background:var(--tx);color:var(--ink);font-weight:600;font-size:15px;padding:12px 18px;border-radius:15px;opacity:0;transition:.25s;max-width:92vw;width:max-content;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.4);pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.volt{background:var(--volt)}
.toast.bad{background:var(--bad);color:#fff}

.loading{height:100%;display:grid;place-items:center;text-align:center;padding:0 var(--pad)}
.logo{font-weight:800;font-size:28px;letter-spacing:-.04em}
.logo i{font-style:normal;color:var(--volt)}
.bar-load{width:120px;height:3px;background:var(--s2);border-radius:99px;margin:18px auto 0;overflow:hidden}
.bar-load:after{content:"";display:block;width:40%;height:100%;background:var(--volt);animation:ld 1s infinite ease-in-out}
@keyframes ld{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
/* launch: the bar slides in, plates load from the middle out, then it is lifted again and again while data loads */
.boot{position:relative;display:flex;flex-direction:column;align-items:center}
.boot:before{content:'';position:absolute;left:50%;top:44px;width:260px;height:260px;margin:-130px 0 0 -130px;border-radius:50%;
  background:radial-gradient(closest-side,rgba(212,255,58,.16),rgba(212,255,58,0));animation:bglow 1.6s .9s infinite ease-in-out;opacity:.5}
.boot svg{width:176px;height:88px;overflow:visible;position:relative}
.boot .bar{fill:#3A3A3F;transform-box:fill-box;transform-origin:center;animation:bbar .45s cubic-bezier(.2,.8,.2,1) both}
.boot .pl{fill:var(--volt);transform-box:fill-box;transform-origin:center;animation:bplate .42s cubic-bezier(.3,1.6,.5,1) both}
.boot .pl.in{animation-delay:.32s;fill:#B4DA2E}.boot .pl.out{animation-delay:.46s}
.boot .lift{animation:blift 1.6s .9s infinite cubic-bezier(.45,0,.3,1);filter:drop-shadow(0 0 10px rgba(212,255,58,.35))}
.boot .sh{fill:rgba(212,255,58,.22);transform-box:fill-box;transform-origin:center;animation:bsh 1.6s .9s infinite cubic-bezier(.45,0,.3,1)}
.boot .logo{margin-top:22px;animation:bword .6s .5s cubic-bezier(.2,.8,.2,1) both}
.boot .logo i{background:linear-gradient(100deg,var(--volt) 40%,#F6FFD6 50%,var(--volt) 60%);background-size:250% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:bshine 1.6s 1.1s infinite linear}
@keyframes bbar{from{transform:scaleX(0);opacity:0}}
@keyframes bplate{from{transform:scaleY(0);opacity:0}}
@keyframes blift{0%,12%{transform:translateY(0)}45%,58%{transform:translateY(-16px)}90%,100%{transform:translateY(0)}}
@keyframes bsh{0%,12%{transform:scaleX(1);opacity:1}45%,58%{transform:scaleX(.55);opacity:.35}90%,100%{transform:scaleX(1);opacity:1}}
@keyframes bglow{0%,12%,90%,100%{opacity:.45;transform:scale(.92)}45%,58%{opacity:1;transform:scale(1.06)}}
@keyframes bword{from{opacity:0;transform:translateY(10px);filter:blur(6px)}}
@keyframes bshine{from{background-position:100% 0}to{background-position:-150% 0}}
#app.reveal>.screen{animation:breveal .45s cubic-bezier(.2,.8,.2,1)}
@keyframes breveal{from{opacity:0;transform:translateY(12px) scale(.985)}}
@media (prefers-reduced-motion:reduce){.boot *,.boot:before,#app.reveal>.screen{animation:none!important}}
#nosleep{position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;pointer-events:none}

/* ===== tabs: «Сегодня», Тренировки, Питание, Сон, Тренер ===== */
.tabbar{flex:none;display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px var(--sb);background:rgba(14,14,16,.96);border-top:1px solid var(--line);position:relative;z-index:2}
/* inside the app the web view already stops above the home indicator: no extra gap under the tabs */
.in-app .tabbar{padding-bottom:2px}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0 0;font-size:11px;font-weight:600;color:var(--mu2);letter-spacing:-.01em;white-space:nowrap}
.tabbar svg{width:24px;height:24px}
.tabbar button.on{color:var(--volt)}
.tabbar button.on svg{filter:drop-shadow(0 0 6px rgba(212,255,58,.55))}
.bottom.tabbed{padding-bottom:12px}
.h1.tab-h{margin:20px 0 18px}
.tap-card{display:block;width:100%;text-align:left;color:inherit;margin-top:12px}
.tap-card:active{transform:scale(.99)}
.hero.solo{height:220px}
.empty-tab{padding:18px}
.sn{margin-top:12px}
.sl{margin-top:12px}
.sl-bw{display:flex;gap:18px;text-align:right}
.sl-bw div{font-size:11px;color:var(--mu2)}
.sl-bw b{display:block;font-size:20px;font-weight:600;color:var(--tx);letter-spacing:-.01em;margin-bottom:2px;font-variant-numeric:tabular-nums}
.sl-hy{display:block;width:100%;height:auto;margin-top:16px}
.sl-bar{display:flex;gap:3px;height:14px;margin-top:16px}
.sl-bar i{border-radius:4px}
.sl-st{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line);font-size:12px;color:var(--mu2)}
.sl-st span{display:flex;align-items:center;gap:6px;color:var(--mu)}
.sl-st span i{width:9px;height:9px;border-radius:3px}
.sl-st b{display:block;font-size:20px;font-weight:600;color:var(--tx);margin:3px 0 1px;letter-spacing:-.01em}
.sl-st b small{font-size:12px;font-weight:500;color:var(--mu);margin:0 3px 0 2px}
.sl-ex{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.sl-ex span{font-size:12px;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.06);color:var(--mu)}
.sl-ex b{color:var(--tx);font-weight:600}
.sl-rt{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:12px;font-size:12px;color:var(--mu2)}
.sl-rt span{display:block;color:var(--mu)}
.sl-rt b{display:inline-block;font-size:24px;font-weight:600;color:var(--tx);margin:2px 6px 0 0;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.sl-tg{display:flex;justify-content:space-between;margin-top:16px;padding:10px 12px;border-radius:14px;background:rgba(212,255,58,.07);font-size:13px;color:var(--mu)}
.sl-tg b{color:var(--volt);font-weight:700;font-size:15px;margin-left:4px;font-variant-numeric:tabular-nums}
.sl-tg small{font-size:12px;color:var(--mu2);margin-left:6px}
.sl-fs{font-size:13px;color:var(--mu);margin-top:10px}
.sl-fs b{color:var(--tx);font-weight:600}
.sl-fri{margin-top:12px}
.sl-fri-t{font-size:22px;font-weight:600;color:var(--tx);margin-top:8px}
.sl-fri-t b{color:var(--volt);font-variant-numeric:tabular-nums}
.sl-ch{display:block;width:100%;height:auto;margin-top:16px}
.sn-ch{display:block;width:100%;height:auto;margin-top:12px;overflow:visible}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.tiles>:only-child{grid-column:1/-1}
.tile{display:flex;flex-direction:column;gap:10px;text-align:left;color:inherit;padding:16px;min-width:0}
.tile-row{display:flex;align-items:center;gap:10px}
.tile-ring{width:52px;height:52px;flex:none;overflow:visible}
.tile-v{display:block;font-family:var(--d);font-size:20px;font-weight:700;letter-spacing:-.04em;line-height:1;font-variant-numeric:proportional-nums}
.tile-v small{font-family:var(--f);font-size:12px;color:var(--mu);font-weight:600;letter-spacing:0;margin-left:3px}
.tile-s{display:block;font-size:12px;color:var(--mu2);margin-top:5px}
.tile-sp{width:100%;height:30px;overflow:visible}
/* coach card: ring mark, verdict line, rows */
.coach{overflow:hidden}
.coach:after{content:'';position:absolute;right:-50px;top:-60px;width:190px;height:190px;border-radius:50%;background:radial-gradient(circle,rgba(212,255,58,.13),transparent 65%);pointer-events:none}
.co-h{display:flex;align-items:center;gap:12px}
.co-mark{width:38px;height:38px;border-radius:50%;padding:2px;flex:none;background:conic-gradient(from 200deg,#FF5E2B,#FF9A3C,#D4FF3A,#FF5E2B)}
.co-mark i{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:#101012;color:var(--volt)}
.co-mark svg{width:18px;height:18px}
.co-t b{display:block;font-size:15px;font-weight:700}
.co-t span{display:block;font-size:13px;color:var(--mu2);margin-top:1px}
.co-v{font-family:var(--d);font-weight:600;font-size:19px;letter-spacing:-.03em;line-height:1.22;margin-top:14px;text-wrap:balance}
.co-v span{color:var(--volt);text-shadow:0 0 18px rgba(212,255,58,.35)}
.co-v span.lt{color:var(--org);text-shadow:0 0 18px rgba(255,122,51,.35)}

/* phase 2: weekly goal, meals, meal advice, evening marks */
.goal{margin-top:12px;overflow:hidden}
.goal::before{content:'';position:absolute;right:-60px;top:-70px;width:200px;height:200px;border-radius:50%;background:radial-gradient(closest-side,rgba(212,255,58,.16),transparent);pointer-events:none}
.goal-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:12px 0 4px}
.goal-v{font-family:var(--d);font-size:30px;font-weight:600;letter-spacing:-.03em;line-height:1;font-variant-numeric:proportional-nums;margin-top:12px}
.goal-row .goal-v{margin-top:0}
.goal-v small{font-family:var(--f);font-size:13px;font-weight:500;color:var(--mu);letter-spacing:0;margin-left:6px}
.goal-was{text-align:right;font-size:13px;color:var(--mu2);font-variant-numeric:proportional-nums}
.goal-was s{display:block;margin-bottom:3px}
.goal-was span{font-weight:700;font-size:15px}
.goal-was .dn{color:var(--volt)}.goal-was .up{color:var(--org)}
.goal-act{display:flex;align-items:center;gap:14px;margin-top:14px}
.btn2.volt{background:var(--volt);box-shadow:0 0 22px rgba(212,255,58,.25)}
.btn2.ghost{background:rgba(255,255,255,.08);color:var(--tx)}
.btn2:disabled{opacity:.55}
.goal-skip{font-size:15px;font-weight:500;color:var(--mu);padding:10px 4px}
.meals{margin-top:12px}
.ml-g{margin-top:14px}
.ml-gh{display:flex;justify-content:space-between;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mu2);padding-bottom:6px;border-bottom:1px solid var(--line)}
.ml-gh span:first-child{color:var(--org)}
.ml-r{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.ml-g .ml-r:last-child{border-bottom:0}
.ml-n{font-size:15px;line-height:1.3;color:var(--tx2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ml-n i,.ma-d i{font-style:normal;color:var(--mu2)}
.ml-k,.ma-k{flex:none;text-align:right;font-variant-numeric:proportional-nums}
.ml-k b,.ma-k b{display:block;font-size:15px;font-weight:600;color:var(--tx)}
.ml-k small,.ma-k small{font-size:12px;color:var(--volt)}
.meal-ai{margin-top:12px}
.co-v.ma-t{font-size:17px}
.ma-list{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.ma-o{display:flex;align-items:flex-start;gap:12px;padding:12px;border-radius:16px;background:rgba(255,255,255,.04)}
.ma-i{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--volt-dim);color:var(--volt)}
.ma-b{flex:1;min-width:0}
.ma-d{font-size:15px;font-weight:600;line-height:1.3}
.ma-w{font-size:13px;color:var(--mu);margin-top:3px;line-height:1.35}
.meal-btn{display:flex;align-items:center;gap:14px;width:100%;text-align:left;margin-top:12px;border:1px solid rgba(212,255,58,.18)}
.meal-btn .mb-ic{flex:none;width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--volt-dim);color:var(--volt)}
.meal-btn .mb-ic svg{width:22px;height:22px}
.meal-btn .mb-t{flex:1;min-width:0}
.meal-btn .mb-t b{display:block;font-size:17px;font-weight:700}
.meal-btn .mb-t span{display:block;font-size:13px;color:var(--mu);margin-top:3px;line-height:1.35}
.meal-btn>svg{width:18px;height:18px;color:var(--mu2);flex:none}
.wt-lg{display:inline-flex;align-items:center;gap:5px}
.wt-lg i{display:inline-block}
.wt-lg i.d{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.45)}
.wt-lg i.l{width:12px;height:2px;border-radius:2px;background:var(--volt);box-shadow:0 0 6px var(--volt);margin-left:6px}
.hab{margin-top:12px}
.hab-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.hab-c{height:38px;padding:0 14px;border-radius:999px;font-size:14px;font-weight:600;background:rgba(255,255,255,.06);color:var(--tx2);border:1px solid transparent;transition:background .15s,color .15s}
.hab-c.on{background:rgba(255,122,51,.16);color:var(--org);border-color:rgba(255,122,51,.4)}
.hab-act{display:flex;align-items:center;gap:12px;margin-top:14px}
.hab-act .nb-n{margin-top:0;flex:1}
/* alcohol: what and how much in the evening card, the morning line, «Алкоголь и следующий день» on «Сон» */
.alc-pick{margin-top:12px;padding:12px;border-radius:18px;background:rgba(255,122,51,.06);border:1px solid rgba(255,122,51,.18)}
.alc-l{font-size:13px;color:var(--mu);margin:0 2px 10px}
.alc-l span{color:var(--mu2)}
.alc-pick .hab-chips{margin-top:0;gap:6px}
.alc-pick .hab-c{height:34px;font-size:13px;padding:0 12px}
.alc-lv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.alc-am{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 4px 9px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid transparent;color:var(--tx2);font-size:13px;font-weight:600}
.alc-am svg{width:28px;height:36px;display:block}
.alc-am small{font-size:11px;font-weight:500;color:var(--mu2);line-height:1.3;text-align:center}
.alc-am.on{background:rgba(255,122,51,.18);border-color:rgba(255,122,51,.55);color:var(--tx)}
.alc-why{margin-top:14px;display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:16px;background:rgba(255,122,51,.08);font-size:14px;line-height:1.4;color:var(--tx2)}
.alc-why b{color:var(--tx);font-weight:600}
.alc-why .alc-ic{width:22px;height:28px;flex:none;color:var(--tx2)}
.alc-why .alc-ic svg{width:22px;height:28px;display:block}
.alc-why.calm{background:var(--volt-dim);align-items:center}
.alc-why .alc-n{font-size:20px;font-weight:800;color:var(--volt);min-width:22px;text-align:center}
.alc-card{margin-top:12px}
.alc-big{font-size:21px;font-weight:800;letter-spacing:-.02em;line-height:1.15;margin-top:8px;text-wrap:balance}
.alc-big em{font-style:normal;color:#FF7A33}
.alc-sub{font-size:14px;color:var(--mu);margin-top:6px}
.alc-l2{display:flex;justify-content:space-between;font-size:12px;color:var(--mu2);margin:22px 2px 8px}
.alc-row{display:grid;grid-template-columns:26px 86px 1fr 40px;align-items:center;gap:8px;padding:6px 0}
.alc-row .gl{color:var(--tx2)}.alc-row .gl svg{width:20px;height:25px;display:block;margin:auto}
.alc-row .nm{font-size:14px;font-weight:600;color:var(--tx2);line-height:1.2;white-space:nowrap}
.alc-row .nm small{display:block;font-size:11px;font-weight:500;color:var(--mu2)}
.alc-row .tr{position:relative;height:12px;border-radius:7px;background:rgba(255,255,255,.05)}
.alc-row .fl{position:absolute;left:0;top:0;bottom:0;border-radius:7px;background:var(--c);box-shadow:0 0 12px var(--g);transform-origin:left;animation:alcGrow .8s cubic-bezier(.2,.8,.2,1) backwards}
.alc-row .ref{position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1px;border-radius:1px;background:var(--tx);opacity:.55}
.alc-row b{font-size:17px;font-weight:800;text-align:right;color:var(--c)}
.alc-row b.few{font-size:12px;font-weight:600;color:var(--mu2)}
.alc-row.thin .fl{opacity:.4;box-shadow:none}.alc-row.thin b{opacity:.6}
.alc-refn{font-size:11px;color:var(--mu2);margin:4px 0 0 120px}
@keyframes alcGrow{from{transform:scaleX(0)}}
.alc-cmp{display:grid;grid-template-columns:1fr auto auto auto;gap:9px 10px;align-items:center;font-size:14px;padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.035)}
.alc-cmp .h{font-size:11px;color:var(--mu2);text-align:right}
.alc-cmp .k{color:var(--tx2)}.alc-cmp .a{color:var(--mu);text-align:right}.alc-cmp .ar{font-size:12px;color:var(--mu2)}.alc-cmp .b{font-weight:700;text-align:right;color:var(--tx2)}
.alc-cmp .w{color:#FF7A33}
.alc-tl{display:grid;grid-template-columns:repeat(12,1fr);gap:2px}
.alc-ev{display:flex;flex-direction:column;align-items:center;gap:4px;padding:5px 0 4px;border-radius:10px}
.alc-ev.sel{background:rgba(255,255,255,.07)}
.alc-ev .top{height:30px;display:flex;align-items:flex-end}
.alc-ev .bar{width:12px;border-radius:4px 4px 2px 2px;background:var(--c)}
.alc-ev .bar.hi{box-shadow:0 0 10px rgba(255,122,51,.6)}
.alc-ev .bar.no{width:10px;background:rgba(255,255,255,.12)}
.alc-ev .ln{width:1px;height:8px;background:rgba(255,255,255,.12)}
.alc-ev .md{width:19px;height:19px;margin:2px 0;border-radius:50%;display:grid;place-items:center;font-style:normal;line-height:1;font-size:10px;font-weight:800;color:var(--ink);background:var(--c);outline:1.5px solid var(--e);outline-offset:1.5px}
.alc-ev .md.none{background:none;outline:0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.alc-ev .dd{font-size:11px;color:var(--mu2)}.alc-ev.now .dd{color:var(--tx)}
.alc-det{margin-top:10px;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.035);font-size:13px;line-height:1.45;color:var(--mu)}
.alc-det b{color:var(--tx);font-weight:600}
.alc-fix{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-top:10px}.alc-fix span{flex-basis:100%;font-size:13px;color:var(--tx2)}.alc-fix .hab-c{height:32px;font-size:13px;padding:0 12px}
.alc-streak{display:flex;align-items:center;gap:12px;margin-top:14px;padding:12px 14px;border-radius:16px;background:var(--volt-dim)}
.alc-streak b{font-size:24px;font-weight:800;color:var(--volt);min-width:18px;text-align:center}
.alc-streak span{font-size:14px;color:var(--tx2);line-height:1.35}
.alc-streak small{display:block;color:var(--mu2);font-size:12px}
@media (prefers-reduced-motion:reduce){.alc-row .fl{animation:none}}
.hab-done{display:flex;align-items:center;gap:12px;font-size:15px;color:var(--tx2);padding:14px 18px}
.hab-ok{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--volt-dim);color:var(--volt)}
.hab-ok svg{width:16px;height:16px}
/* morning check-in: the orb sits on a 5×5 grid, --x mood and --y strength (0 top) in 0..1; --m keeps it inside */
.wb{margin-top:12px}
.wb-read{display:flex;align-items:center;gap:14px;margin-top:12px;min-height:54px}
.wb-rt{flex:1;min-width:0}
.wb-rt b{display:block;font-family:var(--d);font-size:22px;font-weight:700;letter-spacing:-.03em;line-height:1.05}
.wb-rt span{display:block;font-size:14px;color:var(--mu);margin-top:4px}
.wb-sc{display:flex;gap:6px;flex:none}
.wb-sc div{width:46px;padding:6px 0 5px;border-radius:12px;background:rgba(255,255,255,.05);text-align:center}
.wb-sc b{display:block;font-family:var(--d);font-size:18px;font-weight:700;line-height:1;font-variant-numeric:proportional-nums}
.wb-sc span{font-size:10px;color:var(--mu2)}
.wb-pad{--m:42px;--px:calc(var(--m) + var(--x) * (100% - 2 * var(--m)));--py:calc(var(--m) + var(--y) * (100% - 2 * var(--m)));
  position:relative;margin-top:12px;height:268px;border-radius:20px;touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden;
  background:radial-gradient(180px 180px at var(--px) var(--py),var(--glow),transparent 70%),#111113;box-shadow:inset 0 0 0 1px var(--line)}
.wb-grid{position:absolute;inset:22px;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(5,1fr);pointer-events:none}
.wb-grid i{justify-self:center;align-self:center;width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.12)}
.wb-ax{position:absolute;font-size:11px;color:var(--mu2);pointer-events:none}
.wb-ax-y{left:12px;top:8px}.wb-ax-x{left:50%;bottom:6px;transform:translateX(-50%)}
.wb-orb{position:absolute;left:var(--px);top:var(--py);width:76px;height:76px;margin:-38px 0 0 -38px;border-radius:50%;background:var(--c);pointer-events:none;
  box-shadow:0 0 0 6px rgba(255,255,255,.06),0 10px 40px -4px var(--glow);transition:background .12s}
.wb-orb.snap{transition:left .32s cubic-bezier(.3,1.5,.5,1),top .32s cubic-bezier(.3,1.5,.5,1),background .12s}
.wb-orb svg{width:100%;height:100%;display:block}
.wb-orb.idle{animation:wbBreathe 2.2s ease-in-out infinite}
@keyframes wbBreathe{50%{box-shadow:0 0 0 14px rgba(255,255,255,.04),0 10px 40px -4px var(--glow)}}
.wb-hint{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);font-size:12px;color:var(--mu);background:rgba(0,0,0,.45);padding:5px 10px;border-radius:999px;pointer-events:none;white-space:nowrap}
.wb-row{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:12px}.wb-row[hidden]{display:none}
.wb-l{font-size:13px;color:var(--mu);margin-right:2px}
.wb-done-t{display:flex;align-items:center;gap:12px;font-size:15px;color:var(--tx2)}
.wb-week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:14px}
.wb-day{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--mu2)}
.wb-dot{position:relative;width:38px;height:38px;display:grid;place-items:center}
.wb-dot svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);overflow:visible;filter:drop-shadow(0 0 2.5px var(--e)) drop-shadow(0 0 7px var(--e))}
.wb-dot circle{fill:none;stroke-width:2.6}
.wb-dot .tr{stroke:var(--line)}
.wb-dot .ar{stroke:var(--e);stroke-linecap:round}
.wb-day i{width:27px;height:27px;border-radius:50%;background:var(--c,transparent);box-shadow:inset 0 0 0 1px var(--line);display:grid;place-items:center;font-style:normal;line-height:1;font-size:12px;font-weight:700;color:var(--ink);font-variant-numeric:proportional-nums}
.wb-day.now{color:var(--tx)}.wb-day.now i{animation:wbPop .5s cubic-bezier(.3,1.6,.5,1)}.wb-day.now .ar{animation:wbArc .9s .25s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes wbPop{0%{transform:scale(0)}100%{transform:scale(1)}}
@keyframes wbArc{from{stroke-dasharray:0 107}}
@media (prefers-reduced-motion:reduce){.wb-orb,.wb-orb.snap,.wb-day.now i,.wb-day.now .ar{animation:none;transition:none}}

.act-row .act-ic{flex:none;width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:rgba(122,167,255,.13);color:#7AA7FF}
.act-row .act-ic.hot{background:rgba(212,255,58,.13);color:var(--volt);box-shadow:0 0 18px rgba(212,255,58,.12)}
.act-row .act-ic svg{width:23px;height:23px}
.act-row .md span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* sleep debt and the illness sign */
.debt{margin-top:12px}
.sd-ch{display:block;width:100%;height:auto;margin-top:12px;overflow:visible}
.sd-ax{display:grid;grid-template-columns:repeat(7,1fr);font-size:11px;color:var(--mu2);margin-top:2px;text-align:center}
.sd-ax span.on{color:var(--volt);font-weight:700}
.sd-lg{display:flex;gap:14px;font-size:11px;color:var(--mu2);margin-top:8px}
.sd-lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.sd-lg i.o{background:#FF7A33}.sd-lg i.g{background:#D4FF3A}.sd-lg i.b{background:#7FA6EC}
.sd-lg i.ln{width:14px;height:0;border-radius:0;border-top:2px dashed rgba(255,255,255,.7);vertical-align:3px}
.badc{color:var(--bad)}
.rc-debt{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:13px;color:var(--mu)}
.rc-debt b{font-size:15px;color:var(--org)}
.ill{border:1px solid rgba(255,122,51,.35);background:radial-gradient(120% 90% at 100% 0%,rgba(255,94,43,.16),transparent 60%),linear-gradient(180deg,#1C1714,#141416);margin-bottom:12px}
.ill-t{font-family:var(--d);font-weight:600;font-size:20px;letter-spacing:-.03em;line-height:1.2;margin-top:12px;text-wrap:balance}
.ill-t span{color:var(--org);text-shadow:0 0 18px rgba(255,122,51,.35)}
.ill-m{display:flex;gap:22px;margin-top:14px}
.ill-m div{font-size:12px;color:var(--mu2)}
.ill-m b{display:block;font-family:var(--d);font-size:24px;font-weight:600;color:var(--tx);letter-spacing:-.03em;margin-bottom:2px}
.ill-m b small{font-family:var(--f);font-size:12px;color:var(--mu);margin-left:3px}

.sd-goal{display:flex;justify-content:space-between;align-items:baseline;margin-top:14px;padding-top:14px;border-top:1px solid var(--line);font-size:14px;color:var(--mu)}
.sd-goal b{font-family:var(--d);font-size:24px;font-weight:600;letter-spacing:-.03em;color:var(--volt);text-shadow:0 0 18px rgba(212,255,58,.3)}
.sd-goal b small{font-family:var(--f);font-size:13px;color:var(--mu);margin:0 4px 0 2px;text-shadow:none}
</style>

function histRe(name){var lib=libFor(name),re=lib.hist||lib.re;return re&&re.test(name)?re:exactRe(name)}
function exactRe(name){return new RegExp('^'+String(name).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'$')}

var dayCache={};
function buildDay(day,items,key){
  key=key||day;
  if(dayCache[key])return dayCache[key];
  items=items||(S.boot.program.days[day]||[]);
  var exs=items.map(function(it){
    var lib=libFor(it.name),cat=catFor(it.name),rr=parseRange(it.reps);
    var wm=(cat&&cat.weightMeaning)||'';
    return {id:day+it.order,day:day,name:it.name,sets:it.sets,reps:it.reps,repLo:rr[0],repHi:rr[1],rest:String(it.rest||''),restSec:parseRest(it.rest),
      group:it.group,superset:it.superset||'',note:it.note,img:lib.img,cues:lib.cues||[],tech:lib.img?TECH[lib.img]:null,hist:histRe(it.name),was:it.was||'',
      unilateral:/одной рукой/i.test(it.name),cat:cat,
      dumbbell:/ОДНОЙ гантели/i.test(wm)||/вес одной гантели/i.test(it.note||''),
      addedWeight:/ДОПОЛНИТЕЛЬНОГО/i.test(wm)||/добавочн/i.test(it.note||''),
      counter:/ПРОТИВОВЕС/i.test(wm)};
  });

  var out=[],seen={};
  exs.forEach(function(e){
    if(!e.superset){out.push(e);return}

/* ================= coach («Методика v2.1» + «Правила тренера») =================
   Double progression: every set at the top of the range with RIR >= 1 -> one weight step, else +1 rep in one set.
   Light day (bad sleep / feeling / confirmed recovery signals): no progression attempt, one set fewer, RIR 2–3.
   Weight steps are never guessed: the step from «Справочник упражнений», else the smallest jump between weights
   already used on this machine (the same check the coach's numbers pass). */

   morning advice is written again — the server allows at most four answers a day. */
function hnToday(){var n=S.hn;return n&&n.date===todayISO()&&(n.sleep!=null||n.hrv!=null||n.rhr!=null)?n:null}
function hnSig(x){return ''+(x.sleep==null?0:1)+(x.hrv==null?0:1)+(x.rhr==null?0:1)}
function hnSame(d,x){return !!d&&d.sig===hnSig(x)&&(x.sleep==null||Math.abs((d.sl||0)-x.sleep)<0.25)}
var aiAsked={};
function aiStale(item,slot){
  if(item&&!(item.data&&Array.isArray(item.data.tasks))&&!aiAsked[slot+':tk']){aiAsked[slot+':tk']=1;return true} // written before daily tasks
  var w=wbPayload();if(item&&w&&(item.data||{}).wb!==wbSig(w)&&aiAsked[slot+':wb']!==wbSig(w)){aiAsked[slot+':wb']=wbSig(w);return true} // written before this morning's mark
  var n=hnToday();if(!item||!n||hnSame(item.data,n))return false;var sig=hnSig(n)+'|'+n.sleep;
  if(aiAsked[slot]===sig)return false; // asked once already with these numbers

}

  else aiWeekMaybe();
}

var PL_LB={rec:'Восстановление',food:'Питание',focus:'Сегодня',note:''};
function plKind(t){
  if(/^сегодня/i.test(t))return 'focus';
  if(/ккал|калори|белк|белок|питани|углевод/i.test(t))return 'food';
  if(/\bсон\b|сна\b|пульс|HRV|восстанов|ночь|ночи/i.test(t))return 'rec';

function aiPlanHtml(text){

  parts.forEach(function(p){

    var same=rows.filter(function(r){return k&&r.k===k})[0];

    else rows.push({k:k||'note',t:[p]});

function tkState(t,date,i){
  var today=todayISO(),past=date<today,wait=function(note){return {st:past?'na':'wait',p:0,note:note}};
  switch(t.kind){

        if(a)v=a.steps;else if(r&&r.steps!=null)v=r.steps} // the app's total first: it may not be in «Шаги» yet
      if(v==null)return wait(past?'нет данных':'шаги придут из Здоровья');

      p=Math.round(p);return p>=t.target?{st:'ok',p:1,note:p+' г белка'}:{st:past?'fail':'wait',p:p/t.target,note:p+' из '+t.target+' г'}}
    case 'kcal_max':{var k=mealSum(date,'kcal');if(k==null)return wait(past?'еда не записана':'по «Питанию» пока пусто');

}
